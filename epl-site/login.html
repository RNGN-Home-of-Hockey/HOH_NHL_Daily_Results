<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, nofollow">
  <title>HOH Футбол — вход</title>
  <!-- the only page of the operator site open without a login (with the OBS overlay); owner 2026-10-23 -->
  <style>
    :root { --bg: #f3f4f8; --surface: #fff; --line: #cfd4e0; --text: #161a22; --muted: #5b6475; --accent: #f26a1b; --bad: #c0392b; --bad-soft: #fdebe8; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    .box { width: 100%; max-width: 380px; background: var(--surface); border-radius: 14px; padding: 26px 22px; box-shadow: 0 1px 2px rgba(22,26,34,.06), 0 8px 24px rgba(22,26,34,.07); }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; margin-bottom: 18px; }
    .mark { background: var(--accent); color: #fff; font-weight: 800; border-radius: 8px; padding: 6px 8px; font-size: 13px; }
    .brand small { display: block; color: var(--muted); font-weight: 500; font-size: 12px; }
    form { display: grid; gap: 12px; }
    label { display: grid; gap: 5px; font-size: 12px; font-weight: 650; color: var(--muted); }
    input { font: inherit; padding: 11px 12px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--text); }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
    button { font: inherit; font-weight: 700; padding: 12px; border: 0; border-radius: 9px; background: var(--accent); color: #fff; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .error { display: none; background: var(--bad-soft); color: var(--bad); padding: 9px 12px; border-radius: 9px; font-size: 13px; }
    .error.on { display: block; }
    .note { color: var(--muted); font-size: 12px; margin: 14px 0 0; }
  </style>
</head>
<body>
  <main>
    <div class="box">
      <div class="brand"><span class="mark">HOH</span><div>Футбол · АПЛ<small>плашки Winline для трансляций</small></div></div>
      <form id="login" autocomplete="on">
        <label>Почта<input type="email" name="email" autocomplete="username" inputmode="email" required autofocus></label>
        <label>Пароль<input type="password" name="password" autocomplete="current-password" required></label>
        <div class="error" id="error" role="alert"></div>
        <button type="submit">Войти</button>
      </form>
      <p class="note">Логин и пароль приходят на почту. Забыли пароль или нет доступа — напишите администратору.</p>
    </div>
  </main>
  <script type="module" src="login.js"></script>
</body>
</html>
