<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Вход: Больше! Matchday</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/matchday/styles.css">
</head>
<body>
<main class="login">
  <form class="login-card" id="login">
    <h1>Больше! <span>Matchday</span></h1>
    <p class="login-error" id="error" role="alert"></p>
    <label>Почта
      <input type="email" name="email" autocomplete="username" inputmode="email" required autofocus>
    </label>
    <label>Пароль
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="button" id="submit">Войти</button>
  </form>
</main>
<script src="/matchday/login.js"></script>
</body>
</html>
