name: Apply Demo Winline Odds

on:
  push:
    paths:
      - '.github/workflows/apply-demo-winline-odds.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch insight engines
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('cloudflare-worker/src/betting-insight-engine.js')
          s = p.read_text()
          if not s.startswith('import { withDemoOdds }'):
              s = 'import { withDemoOdds } from "./demo-winline-odds.js";\n\n' + s
          old = '''function card({game=null,type,category,timing,score,eyebrow,value,title,explanation,sample,evidence,market}) {
            const idParts=[game?.game_pk||"context",type,market?.subject||"all",String(sample||0)];
            return {
              id:idParts.join(":"),
              insight_type:type,
              category,
              timing,
              score:Math.round(Math.max(0,Math.min(100,score))),
              eyebrow,
              value,
              title,
              explanation,
              evidence:{sample_size:sample,...evidence},
              note:`${market.label} · WINLINE: кэф — · промокод HOH`,
              kind:category==="live"?"live":"history",
              market:{...market,odds:null,promo_code:"HOH",provider:"winline_pending"},
            };
          }'''
          new = '''function card({game=null,type,category,timing,score,eyebrow,value,title,explanation,sample,evidence,market}) {
            const idParts=[game?.game_pk||"context",type,market?.subject||"all",String(sample||0)];
            const id=idParts.join(":");
            const pricedMarket=withDemoOdds(market,id);
            return {
              id,
              insight_type:type,
              category,
              timing,
              score:Math.round(Math.max(0,Math.min(100,score))),
              eyebrow,
              value,
              title,
              explanation,
              evidence:{sample_size:sample,...evidence},
              note:`${pricedMarket.label} · WINLINE · ДЕМО-КЭФ ${pricedMarket.odds.toFixed(2)} · промокод HOH`,
              kind:category==="live"?"live":"history",
              market:pricedMarket,
            };
          }'''
          if old not in s:
              raise SystemExit('historical card anchor not found')
          p.write_text(s.replace(old,new,1))

          p = Path('cloudflare-worker/src/live-betting-engine.js')
          s = p.read_text()
          if 'import { withDemoOdds } from "./demo-winline-odds.js";' not in s:
              s = s.replace('import { fetchNhlJson } from "./data-core-importer.js";\n', 'import { fetchNhlJson } from "./data-core-importer.js";\nimport { withDemoOdds } from "./demo-winline-odds.js";\n', 1)
          old = '''function card({ game, id, type, score, eyebrow, value, title, explanation, evidence, market }) {
            return {
              id,
              type,
              category: "live",
              kind: "live",
              timing: "live",
              score: Math.round(score),
              eyebrow,
              value,
              title,
              explanation,
              note: `${market.label} · WINLINE: кэф — · промокод HOH`,
              evidence: {
                ...evidence,
                game_pk: game.game_pk,
                state: game.game_state,
                period: game.period_number,
                time_remaining: game.time_remaining,
                score: `${game.away_tri} ${game.away_score}:${game.home_score} ${game.home_tri}`,
              },
              market: {
                ...market,
                odds: null,
                promo_code: "HOH",
                provider: "winline_pending",
              },
            };
          }'''
          new = '''function card({ game, id, type, score, eyebrow, value, title, explanation, evidence, market }) {
            const pricedMarket=withDemoOdds(market,id);
            return {
              id,
              type,
              category: "live",
              kind: "live",
              timing: "live",
              score: Math.round(score),
              eyebrow,
              value,
              title,
              explanation,
              note: `${pricedMarket.label} · WINLINE · ДЕМО-КЭФ ${pricedMarket.odds.toFixed(2)} · промокод HOH`,
              evidence: {
                ...evidence,
                game_pk: game.game_pk,
                state: game.game_state,
                period: game.period_number,
                time_remaining: game.time_remaining,
                score: `${game.away_tri} ${game.away_score}:${game.home_score} ${game.home_tri}`,
              },
              market: pricedMarket,
            };
          }'''
          if old not in s:
              raise SystemExit('live card anchor not found')
          p.write_text(s.replace(old,new,1))

          p = Path('docs/BETTING_INSIGHT_ENGINE.md')
          s = p.read_text()
          marker = 'Odds are never invented. Until Winline market data is connected, `odds` remains null or is entered manually by an operator.'
          replacement = 'Until the real Winline feed is connected, development/demo mode uses deterministic synthetic odds from 1.30 to 9.00. They are always marked `DEMO` / `odds_is_demo=true`; production odds must later come only from Winline or explicit operator input.'
          if marker in s:
              s = s.replace(marker,replacement,1)
          p.write_text(s)
          PY

          node --check cloudflare-worker/src/demo-winline-odds.js
          node --check cloudflare-worker/src/betting-insight-engine.js
          node --check cloudflare-worker/src/live-betting-engine.js
          node --check cloudflare-worker/src/broadcast-dashboard-v2.js
          node --check cloudflare-worker/src/worker-entry.js

          node --input-type=module <<'NODE'
          import { demoOdds } from './cloudflare-worker/src/demo-winline-odds.js';
          import { buildLiveGameSnapshot } from './cloudflare-worker/src/live-betting-engine.js';
          const odds = Array.from({length:1000},(_,i)=>demoOdds('test:'+i));
          const min = Math.min(...odds), max = Math.max(...odds);
          const core = odds.filter(x=>x>=1.30&&x<=2.35).length;
          if (min < 1.30 || max > 9.00) throw new Error('demo odds out of bounds');
          if (core < 760) throw new Error('demo odds not concentrated enough near core range');
          console.log('ODDS_DISTRIBUTION', {min,max,core_pct:core/10});
          const snapshot = await buildLiveGameSnapshot(2024020001);
          if (!snapshot.cards.length) throw new Error('expected real live test cards');
          for (const card of snapshot.cards) {
            if (!Number.isFinite(card.market?.odds)) throw new Error('missing demo odds');
            if (card.market.odds_is_demo !== true) throw new Error('demo marker missing');
            console.log('DEMO_CARD', card.title, card.market.label, card.market.odds, card.note);
          }
          NODE
          git diff --check

      - name: Commit changes
        run: |
          git config user.name 'znamteam-max'
          git config user.email 'znamteam@gmail.com'
          git add cloudflare-worker/src/demo-winline-odds.js cloudflare-worker/src/betting-insight-engine.js cloudflare-worker/src/live-betting-engine.js docs/BETTING_INSIGHT_ENGINE.md
          git commit -m 'Show stable demo Winline odds on insight cards'
          git push origin HEAD:main
