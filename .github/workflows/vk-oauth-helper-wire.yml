name: Wire VK OAuth helper
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/src/vk-oauth-helper.js'
      - '.github/workflows/vk-oauth-helper-wire.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wire helper into Worker
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-worker/src/worker-entry.js')
          s=p.read_text()
          imp='import { handleVkOauthHelper } from "./vk-oauth-helper.js";\n'
          if imp not in s:
              anchor='import { runVkBroadcastMaintenance } from "./telegram-center-vk-maintenance.js";\n'
              assert anchor in s
              s=s.replace(anchor, anchor+imp)
          call='    const vkOauthResponse = handleVkOauthHelper(request, path);\n    if (vkOauthResponse) return vkOauthResponse;\n\n'
          if call not in s:
              anchor='    const path = stripTrailingSlash(url.pathname);\n\n'
              assert anchor in s
              s=s.replace(anchor, anchor+call)
          p.write_text(s)
          PY
      - name: Verify syntax
        run: |
          node --check cloudflare-worker/src/vk-oauth-helper.js
          node --check cloudflare-worker/src/worker-entry.js
          grep -q 'handleVkOauthHelper' cloudflare-worker/src/worker-entry.js
      - name: Worker dry run
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir .validation-build
      - name: Commit wiring
        run: |
          if git diff --quiet; then echo 'Already wired'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-worker/src/worker-entry.js
          git commit -m 'Wire VK OAuth helper route'
          git pull --rebase origin main
          git push
