name: Content Core Paid Create V2 Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/content-core-paid-create-v2-once.yml"

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '9032ec1bd3cb868d89a38453e4bd1a69' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Create clean paid target
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const headers={Authorization:'Bearer '+token,'Content-Type':'application/json'};
          const base='https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database';
          let r=await fetch(base,{headers});
          let d=await r.json();
          if(!r.ok||!d.success) throw new Error(JSON.stringify(d.errors||d));
          let db=(d.result||[]).find(x=>x.name==='rngn-content-core-v2');
          if(!db){
            r=await fetch(base,{method:'POST',headers,body:JSON.stringify({name:'rngn-content-core-v2'})});
            d=await r.json();
            if(!r.ok||!d.success) throw new Error(JSON.stringify(d.errors||d));
            db=d.result;
          }
          console.log('CONTENT_CORE_PAID_D1_V2|'+JSON.stringify({account,name:db.name,uuid:db.uuid,created_at:db.created_at||null}));
          NODE
