name: Content Core Paid Copy Secrets Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/content-core-paid-copy-secrets-once.yml"

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '9032ec1bd3cb868d89a38453e4bd1a69' }}
      SOURCE_CORE: https://rngn-content-core.rngn-znamteam.workers.dev
      BRIDGE_PATH: /internal/migration/paid-secrets-14e8d20fb09a43b610f13c479902d8e2
      BRIDGE_KEY: 85a8cc1bb4d0b451e58f78cd6b72e71377e93eec3a66e8e1fa53380612d60fdc
    steps:
      - uses: actions/checkout@v6
      - name: Copy old runtime secrets into paid shadow Workers
        shell: bash
        run: |
          set -euo pipefail
          copy_to() {
            local worker="$1"
            local payload
            payload="$(jq -nc               --arg apiToken "$CLOUDFLARE_API_TOKEN"               --arg accountId "$CLOUDFLARE_ACCOUNT_ID"               --arg targetWorker "$worker"               '{apiToken:$apiToken,accountId:$accountId,targetWorker:$targetWorker}')"
            curl --fail --silent --show-error               -X POST "$SOURCE_CORE$BRIDGE_PATH"               -H "x-rngn-migration-key: $BRIDGE_KEY"               -H "content-type: application/json"               --data-binary "$payload" > "/tmp/$worker.json"
            jq -e '.ok == true' "/tmp/$worker.json" >/dev/null
            echo "PAID_SECRET_COPY|$worker|$(jq -c '{copied,missing,failed}' "/tmp/$worker.json")"
          }
          copy_to rngn-content-core-paid-shadow
          copy_to rngn-content-dashboard-paid-shadow
      - name: Verify paid secret names
        shell: bash
        run: |
          set -euo pipefail
          for worker in rngn-content-core-paid-shadow rngn-content-dashboard-paid-shadow; do
            URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker/secrets"
            curl --fail --silent --show-error "$URL"               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > "/tmp/$worker-secrets.json"
            jq -e '.success == true' "/tmp/$worker-secrets.json" >/dev/null
            echo "PAID_SECRET_NAMES|$worker|$(jq -c '[.result[].name] | sort' "/tmp/$worker-secrets.json")"
          done
