name: Temporary Broadcast Stage Marker Patch

on:
  push:
    paths:
      - '.github/workflows/_tmp-stage-marker-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Add stage marker diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-worker/src/broadcast-dashboard-v2.js')
          s=p.read_text(encoding='utf-8')

          old='''  if (!env.DB) return jsonResponse({ ok:false, error:"missing_d1_binding" },503);\n  if (!Number.isSafeInteger(gamePk) || gamePk<=0) return jsonResponse({ ok:false,error:"invalid_game_pk" },400);\n  try {\n    const game = await env.DB.prepare(`'''
          new='''  if (!env.DB) return jsonResponse({ ok:false, error:"missing_d1_binding" },503);\n  if (!Number.isSafeInteger(gamePk) || gamePk<=0) return jsonResponse({ ok:false,error:"invalid_game_pk" },400);\n  let routeStage="init";\n  try {\n    routeStage="game_lookup";\n    const game = await env.DB.prepare(`'''
          if old not in s: raise SystemExit('stage start anchor missing')
          s=s.replace(old,new,1)

          old='''    if (!game) return jsonResponse({ ok:false,error:"game_not_found" },404);\n\n    const dataDegradedSections=[];'''
          new='''    if (!game) return jsonResponse({ ok:false,error:"game_not_found" },404);\n\n    routeStage="secondary_reads";\n    const dataDegradedSections=[];'''
          if old not in s: raise SystemExit('secondary anchor missing')
          s=s.replace(old,new,1)

          old='''    let bettingInsights=[];\n    let bettingInsightsDegraded=false;\n    try {\n      bettingInsights=await buildBettingInsights(env.DB,game);'''
          new='''    routeStage="betting";\n    let bettingInsights=[];\n    let bettingInsightsDegraded=false;\n    try {\n      bettingInsights=await buildBettingInsights(env.DB,game);'''
          if old not in s: raise SystemExit('betting anchor missing')
          s=s.replace(old,new,1)

          old='''    return jsonResponse({\n      ok:true,\n      game,'''
          new='''    routeStage="quick_cards";\n    let quickCards=[];\n    try {\n      quickCards=buildQuickCards(game,teamStats,playerStats);\n    } catch (error) {\n      dataDegradedSections.push("quick_cards");\n      console.error("broadcast quick cards degraded", error);\n    }\n\n    routeStage="serialize_response";\n    return jsonResponse({\n      ok:true,\n      game,'''
          if old not in s: raise SystemExit('response anchor missing')
          s=s.replace(old,new,1)

          old='''      data_degraded_sections:dataDegradedSections,\n      quick_cards:buildQuickCards(game,teamStats,playerStats),\n      persisted_cards:persistedCards,\n    });\n  } catch (error) {\n    console.error("broadcast game failed", error);\n    return jsonResponse({ ok:false,error:"broadcast_game_failed" },500);\n  }'''
          new='''      data_degraded_sections:dataDegradedSections,\n      quick_cards:quickCards,\n      persisted_cards:persistedCards,\n    });\n  } catch (error) {\n    console.error(`broadcast game failed at ${routeStage}`, error);\n    const detail=String(error?.message||error||"unknown").slice(0,300);\n    return jsonResponse({ ok:false,error:"broadcast_game_failed",stage:routeStage,detail },500);\n  }'''
          if old not in s: raise SystemExit('catch anchor missing')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
          node --check cloudflare-worker/src/broadcast-dashboard-v2.js
          git diff --check
      - name: Full Worker dry run
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir .stage-marker-build
          test -d .stage-marker-build
      - name: Commit patch
        run: |
          git config user.name 'znamteam-max'
          git config user.email 'znamteam@gmail.com'
          git add cloudflare-worker/src/broadcast-dashboard-v2.js
          git commit -m 'Add Broadcast route stage diagnostics and quick-card isolation'
          git push origin HEAD:main
