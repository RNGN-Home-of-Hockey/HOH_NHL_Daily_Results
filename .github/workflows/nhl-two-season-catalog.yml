name: Build NHL two-season catalog

on:
  push:
    branches: [main]
    paths:
      - 'tools/collect_nhl_two_seasons.py'
      - '.github/workflows/nhl-two-season-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/collect_nhl_two_seasons.py
      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/nhl_games_2024_2026.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build two-season NHL game catalog"
          git push
