name: Stage2 Production Healthcheck

on:
  push:
    paths:
      - '.github/workflows/stage2-prod-healthcheck.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check production endpoints
        env:
          BASE_URL: https://hoh-nhl-daily-results.znamteam-903.workers.dev
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          from collections import Counter

          base=os.environ['BASE_URL'].rstrip('/')
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'HOH-Prod-Healthcheck/1.0','Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      return r.status,json.loads(r.read().decode('utf-8'))
              except urllib.error.HTTPError as e:
                  body=e.read().decode('utf-8','replace')
                  try: payload=json.loads(body)
                  except Exception: payload={'raw':body}
                  return e.code,payload

          status,listing=get('/api/broadcast/games')
          print('LIST',status,json.dumps(listing.get('counts') or {},ensure_ascii=False))
          if status!=200: raise SystemExit('list endpoint failed')
          counts=listing.get('counts') or {}
          if int(counts.get('games') or 0)!=2792: raise SystemExit(f'bad game count {counts}')
          if int(counts.get('teams') or 0)!=32: raise SystemExit(f'bad team count {counts}')

          sample=(listing.get('games') or [])[:12]
          tiers=Counter(); periods=Counter(); degraded=0; categories=Counter(); cards_total=0
          failures=[]
          examples=[]
          for g in sample:
              s,d=get('/api/broadcast/games/'+str(g['game_pk']))
              print('GAME',g['game_pk'],g.get('away_tri'),g.get('home_tri'),'STATUS',s,'DEGRADED',d.get('betting_insights_degraded') if isinstance(d,dict) else None,'CARDS',len(d.get('cards') or []) if isinstance(d,dict) else None)
              if s!=200:
                  failures.append((g['game_pk'],s,d))
                  continue
              degraded += int(bool(d.get('betting_insights_degraded')))
              for c in d.get('cards') or []:
                  cards_total += 1
                  q=c.get('evidence_quality') or {}
                  if q.get('tier'): tiers[str(q['tier'])]+=1
                  m=c.get('market') or {}
                  periods[str(m.get('period') or 'GAME')]+=1
                  categories[str(c.get('category') or c.get('insight_type') or 'unknown')]+=1
                  if len(examples)<12 and (q.get('tier') in ('A','B') or m.get('period')=='REG'):
                      examples.append({'game_pk':g['game_pk'],'tier':q.get('tier'),'category':c.get('category'),'market':m.get('label'),'period':m.get('period'),'support':q.get('independent_support_count')})

          report={'failures':failures,'degraded_games':degraded,'sample_games':len(sample),'cards_total':cards_total,'tiers':dict(tiers),'periods':dict(periods),'categories':dict(categories),'examples':examples}
          print('REPORT',json.dumps(report,ensure_ascii=False,indent=2))
          if failures: raise SystemExit(f'game endpoint failures: {len(failures)}')
          if cards_total==0: raise SystemExit('no cards returned')
          if not tiers: raise SystemExit('evidence tiers missing')
          if periods.get('REG',0)==0: raise SystemExit('no REG cards')
          print('PRODUCTION_HEALTHCHECK_OK')
          PY
