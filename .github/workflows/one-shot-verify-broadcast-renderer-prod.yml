name: One-shot verify broadcast renderer production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-verify-broadcast-renderer-prod.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wait for production renderer layout v3
        run: |
          set -euo pipefail
          url='https://hoh-broadcast-renderer.vercel.app/api/health'
          for i in $(seq 1 24); do
            body="$(curl -fsSL --max-time 10 "$url" || true)"
            echo "POLL $i $body"
            if echo "$body" | grep -q '2026-09-21-layout-v3'; then
              echo 'BROADCAST_RENDERER_PROD_LAYOUT_V3_OK'
              exit 0
            fi
            sleep 5
          done
          echo 'Production renderer did not update to layout v3'
          exit 1
