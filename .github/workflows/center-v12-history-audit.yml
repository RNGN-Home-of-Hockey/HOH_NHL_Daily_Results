name: Audit Center V12 historical ranks

on:
  workflow_dispatch:
  push:
    paths:
      - 'cloudflare-worker/src/telegram-center-v12-polish.js'
      - '.github/workflows/center-v12-history-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Kaprizov 2025/26 history and ranks
        run: |
          node --input-type=module <<'JS'
          import { handleTelegramCenterV12Polish } from './cloudflare-worker/src/telegram-center-v12-polish.js';
          const path='/api/telegram-center-v12/players/8478864/season/20252026';
          const r=await handleTelegramCenterV12Polish(new Request('https://audit.test'+path),{},path);
          const d=await r.json();
          console.log(JSON.stringify(d,null,2));
          if(!r.ok) throw new Error('history endpoint failed');
          if(Number(d.stats?.points||0)<1) throw new Error('historical points missing');
          if(!Number.isInteger(d.ranks?.team?.points_rank)) throw new Error('team points rank missing');
          if(!Number.isInteger(d.ranks?.league?.points_rank)) throw new Error('league points rank missing');
          console.log('CENTER_V12_HISTORY_RANKS_OK',d.ranks);
          JS
