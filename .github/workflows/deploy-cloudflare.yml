name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh Center player salaries"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-cloudflare.yml'
      - 'cloudflare-worker/src/**'
      - 'cloudflare-worker/public/**'
      - 'migrations/**'
      - 'tools/refresh_team_current_snapshots.sql'
      - 'player_salary_2026_27.json'
      - 'ru_full_names.json'
      - 'state/hoh_youtube_media.json'
      - 'wrangler.jsonc'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '9032ec1bd3cb868d89a38453e4bd1a69' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing GitHub secret CLOUDFLARE_API_TOKEN'; exit 2; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing Cloudflare account id'; exit 2; }
          echo 'Cloudflare credentials are configured.'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply pending D1 migrations
        run: npx wrangler d1 migrations apply hoh-data-core --remote
      - name: Refresh current team snapshots
        run: npx wrangler d1 execute hoh-data-core --remote --file=tools/refresh_team_current_snapshots.sql
      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Smoke production D1 and broadcast isolation
        shell: bash
        run: |
          set -euo pipefail
          GAME_A=2999999001
          GAME_B=2999999002
          CARD_A="prod-smoke-a"
          CARD_B="prod-smoke-b"
          SMOKE_KEY="broadcast-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SMOKE_PAYLOAD="ok-${GITHUB_SHA:0:12}"
          cleanup() {
            npx wrangler d1 execute hoh-data-core --remote --command "DELETE FROM games WHERE game_pk IN (${GAME_A},${GAME_B}); DELETE FROM broadcast_d1_smoke WHERE smoke_key='${SMOKE_KEY}';" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup

          npx wrangler d1 execute hoh-data-core --remote --command "INSERT INTO broadcast_d1_smoke(smoke_key,payload,updated_at) VALUES('${SMOKE_KEY}','${SMOKE_PAYLOAD}',CURRENT_TIMESTAMP);"
          READBACK="$(npx wrangler d1 execute hoh-data-core --remote --command "SELECT smoke_key,payload FROM broadcast_d1_smoke WHERE smoke_key='${SMOKE_KEY}';")"
          echo "$READBACK"
          grep -F "${SMOKE_PAYLOAD}" <<<"$READBACK" >/dev/null || { echo "D1 write/read smoke failed"; exit 1; }

          npx wrangler d1 execute hoh-data-core --remote --command "
            INSERT INTO games(game_pk,season_id,game_type,scheduled_start_utc,game_state,home_tri,away_tri,home_score,away_score,last_synced_at)
            VALUES(${GAME_A},'smoke',2,'2000-01-01T00:00:00Z','OFF','BOS','NYR',0,0,CURRENT_TIMESTAMP);
            INSERT INTO games(game_pk,season_id,game_type,scheduled_start_utc,game_state,home_tri,away_tri,home_score,away_score,last_synced_at)
            VALUES(${GAME_B},'smoke',2,'2000-01-01T00:00:00Z','OFF','NYR','BOS',0,0,CURRENT_TIMESTAMP);
            INSERT INTO broadcast_cards(card_id,game_pk,headline_ru,stat_text_ru,odds_is_demo,status,shown_at,created_at,updated_at)
            VALUES('${CARD_A}',${GAME_A},'SMOKE A','ПОБЕДА',0,'shown',CURRENT_TIMESTAMP,CURRENT_TIMESTAMP,CURRENT_TIMESTAMP);
            INSERT INTO broadcast_cards(card_id,game_pk,headline_ru,stat_text_ru,odds_is_demo,status,shown_at,created_at,updated_at)
            VALUES('${CARD_B}',${GAME_B},'SMOKE B','ПОБЕДА',0,'shown',CURRENT_TIMESTAMP,CURRENT_TIMESTAMP,CURRENT_TIMESTAMP);
          "

          GAME_A="$GAME_A" GAME_B="$GAME_B" CARD_A="$CARD_A" CARD_B="$CARD_B" node --input-type=module <<'JS'
          const base='https://hoh-nhl-daily-results.znamteam-903.workers.dev';
          const checks=[
            [process.env.GAME_A,process.env.CARD_A],
            [process.env.GAME_B,process.env.CARD_B],
          ];
          for(const [game,card] of checks){
            let last=null;
            for(let i=0;i<10;i++){
              const r=await fetch(base+'/api/broadcast/state?game='+game,{headers:{accept:'application/json'},cache:'no-store'});
              last=await r.json().catch(()=>({}));
              if(r.ok&&String(last?.on_air?.card_id)===card&&String(last?.on_air?.game_pk)===game)break;
              await new Promise(res=>setTimeout(res,1000));
            }
            if(String(last?.on_air?.card_id)!==card||String(last?.on_air?.game_pk)!==game){
              throw new Error('Per-game production state failed '+game+' '+JSON.stringify(last));
            }
            console.log('BROADCAST_PRODUCTION_ROOM_OK',game,card);
          }
          console.log('D1_WRITE_READ_SMOKE_OK',process.env.GAME_A,process.env.GAME_B);
          console.log('BROADCAST_TWO_GAME_PRODUCTION_SMOKE_OK');
          JS

      - name: Verify advanced broadcast data coverage
        shell: bash
        run: |
          set -euo pipefail
          COVERAGE="$(npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT 'CURRENT_ROWS=' || COUNT(*) AS coverage FROM team_current_snapshots;
            SELECT 'CURRENT_TEAMS=' || COUNT(DISTINCT team_tri) AS coverage FROM team_current_snapshots;
            SELECT 'ADVANCED_ROWS=' || COUNT(*) AS coverage FROM team_game_advanced_features;
            SELECT 'ADVANCED_TEAMS=' || COUNT(DISTINCT team_tri) AS coverage FROM team_game_advanced_features;
          ")"
          echo "$COVERAGE"
          value() {
            local key="$1"
            grep -o "${key}=[0-9][0-9]*" <<<"$COVERAGE" | head -1 | cut -d= -f2
          }
          CURRENT_ROWS="$(value CURRENT_ROWS)"
          CURRENT_TEAMS="$(value CURRENT_TEAMS)"
          ADVANCED_ROWS="$(value ADVANCED_ROWS)"
          ADVANCED_TEAMS="$(value ADVANCED_TEAMS)"
          test -n "$CURRENT_ROWS" -a -n "$CURRENT_TEAMS" -a -n "$ADVANCED_ROWS" -a -n "$ADVANCED_TEAMS" || {
            echo "Could not parse advanced coverage"; exit 1;
          }
          test "$CURRENT_ROWS" -ge 90 || { echo "team_current_snapshots rows too low: $CURRENT_ROWS"; exit 1; }
          test "$CURRENT_TEAMS" -ge 30 || { echo "team_current_snapshots teams too low: $CURRENT_TEAMS"; exit 1; }
          test "$ADVANCED_ROWS" -ge 560 || { echo "team_game_advanced_features rows too low: $ADVANCED_ROWS"; exit 1; }
          test "$ADVANCED_TEAMS" -ge 28 || { echo "team_game_advanced_features teams too low: $ADVANCED_TEAMS"; exit 1; }
          echo "ADVANCED_BROADCAST_DATA_OK current_rows=$CURRENT_ROWS current_teams=$CURRENT_TEAMS advanced_rows=$ADVANCED_ROWS advanced_teams=$ADVANCED_TEAMS"

      - name: Verify production Telegram Center
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          const url='https://hoh-nhl-daily-results.znamteam-903.workers.dev/api/telegram/center/status';
          let r=null,d=null;
          for(let i=0;i<15;i++){
            r=await fetch(url,{headers:{accept:'application/json'},cache:'no-store'});
            d=await r.json().catch(()=>({}));
            console.log('TELEGRAM_CENTER_STATUS_ATTEMPT',i+1,JSON.stringify(d));
            if(r.ok&&d.ok&&d.runtime_marker==='telegram-center-2026-09-24-v24.2'&&d.menu_button_matches_build===true)break;
            await new Promise(res=>setTimeout(res,2000));
          }
          console.log('TELEGRAM_CENTER_STATUS',JSON.stringify(d));
          if(!r?.ok)throw new Error('Telegram Center status HTTP '+String(r?.status));
          if(!d?.ok)throw new Error('Telegram Center unhealthy '+JSON.stringify(d));
          if(d.runtime_marker!=='telegram-center-2026-09-24-v24.2')throw new Error('Unexpected Telegram Center runtime '+String(d.runtime_marker));
          if(!d.center_token_configured||!d.webhook_secret_configured)throw new Error('Telegram Center credentials incomplete');
          if(!d.bot?.ok||!d.bot?.username)throw new Error('Telegram Center bot unavailable');
          if(d.delivery_mode!=='polling')throw new Error('Telegram Center is not in polling mode '+String(d.delivery_mode));
          if(!d.webhook?.ok||String(d.webhook.url||'')!=='')throw new Error('Telegram Center webhook was not disabled '+JSON.stringify(d.webhook));
          if(!d.delivery_setup?.ok||d.delivery_setup?.mode!=='polling')throw new Error('Telegram Center polling setup failed '+JSON.stringify(d.delivery_setup));
          if(!d.commands?.ok||!(d.commands.items||[]).some(x=>x.command==='menu'))throw new Error('Telegram Center commands missing '+JSON.stringify(d.commands));
          if(!d.menu_button?.ok||d.menu_button?.value?.type!=='web_app')throw new Error('Telegram Center menu button missing '+JSON.stringify(d.menu_button));
          if(String(d.menu_button?.value?.web_app?.url||'')!=='https://hoh-nhl-daily-results.znamteam-903.workers.dev/telegram-app-v24?build=24.8.0')throw new Error('Telegram Center menu button is not on exact current build '+JSON.stringify(d.menu_button));
          if(d.menu_button_matches_build!==true)throw new Error('Telegram Center menu build contract failed '+JSON.stringify(d));
          const origin='https://hoh-nhl-daily-results.znamteam-903.workers.dev';
          const browserAssets=['/telegram-app/v9.js','/telegram-app/v15-core.js','/telegram-app/v15-team.js','/telegram-app/v19.js','/telegram-app/v20.js','/telegram-app/v21.js','/telegram-app/v22.js','/telegram-app/v23-player.js','/telegram-app/v24-visual.js'];
          for(const asset of browserAssets){
            const ar=await fetch(origin+asset+'?build=24.8.0',{cache:'no-store'});
            const js=await ar.text();
            if(!ar.ok)throw new Error('Production Center browser asset HTTP '+ar.status+' '+asset);
            try{new Function(js)}catch(e){throw new Error('Production Center browser asset syntax invalid '+asset+': '+e.message)}
            if(asset==='/telegram-app/v15-core.js'&&(!js.includes('.brand,.status{display:none')||!js.includes("t.textContent='Главное'"))){
              throw new Error('Production V15 core behavior markers missing');
            }
          }
          console.log('TELEGRAM_CENTER_BROWSER_BUNDLES_OK',browserAssets.length);
          console.log('TELEGRAM_CENTER_PRODUCTION_SMOKE_OK',JSON.stringify({
            marker:d.runtime_marker,
            bot:d.bot.username,
            delivery_mode:d.delivery_mode,
            webhook:d.webhook.url,
            polling:d.polling||null,
            last_event:d.last_event||null
          }));
          JS

      - name: Verify player notification wave
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          const base='https://hoh-nhl-daily-results.znamteam-903.workers.dev';
          let d=null,r=null;
          for(let i=0;i<15;i++){
            r=await fetch(base+'/api/telegram-center-notifications-v2/status',{cache:'no-store',headers:{accept:'application/json'}});
            d=await r.json().catch(()=>({}));
            console.log('PLAYER_NOTIFICATION_STATUS',i+1,JSON.stringify(d));
            if(r.ok&&d?.ok&&d?.engine==='center-v2'&&d?.enabled===true&&d?.center_token_configured===true)break;
            await new Promise(res=>setTimeout(res,2000));
          }
          if(!r?.ok||!d?.ok)throw new Error('player notification status unhealthy '+JSON.stringify(d));
          if(d.engine!=='center-v2'||d.enabled!==true||d.center_token_configured!==true)throw new Error('player notification engine not enabled '+JSON.stringify(d));
          if(Number(d.delivery_shards)!==5||Number(d.max_sends_per_tick)!==30)throw new Error('notification burst protection missing '+JSON.stringify(d));
          if(d.default_timezone!=='Europe/Moscow'||Number(d.digest_catchup_hours)!==4)throw new Error('digest fallback/catch-up contract missing '+JSON.stringify(d));
          async function waitText(path,check,label){
            let last='';
            for(let i=0;i<15;i++){
              const ar=await fetch(base+path,{cache:'no-store',headers:{'cache-control':'no-cache'}});
              last=await ar.text();
              console.log('PLAYER_NOTIFICATION_ASSET_WAIT',label,i+1,ar.status,last.slice(0,120).replace(/\s+/g,' '));
              if(ar.ok&&check(last))return last;
              await new Promise(res=>setTimeout(res,2000));
            }
            throw new Error(label+' did not reach production');
          }
          const injuryProbe=await fetch('https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/injuries',{headers:{accept:'application/json','user-agent':'HOH-Center-Notification-Smoke/1'},cache:'no-store'});
          if(!injuryProbe.ok)throw new Error('ESPN NHL injury feed HTTP '+injuryProbe.status);
          const injuryJson=await injuryProbe.json().catch(()=>null);
          if(!injuryJson||typeof injuryJson!=='object')throw new Error('ESPN NHL injury feed invalid JSON');
          console.log('PLAYER_NOTIFICATION_INJURY_FEED_OK');
          const gameFollowJs=await waitText('/telegram-app/game-follow.js?build=25.0.1',js=>js.includes('reminder_only')&&js.includes('notify_pregame'),'15-minute reminder UI');
          new Function(gameFollowJs);
          const preferencesJs=await waitText('/telegram-app/preferences.js?build=25.0.1',js=>js.includes('timezone_name')&&js.includes('telegram-center-notifications-v2/me'),'timezone sync UI');
          new Function(preferencesJs);
          const shell=await waitText('/telegram-app-v24?build=24.8.0',html=>html.includes('/telegram-app/game-follow.js?build=25.0.1')&&html.includes('/telegram-app/preferences.js?build=25.0.1'),'canonical notification shell');
          console.log('PLAYER_NOTIFICATION_WAVE_PRODUCTION_OK',JSON.stringify({player_subscriptions:d.player_subscriptions,game_reminders:d.game_reminders,timezone_users:d.timezone_users,timezone_fallback_users:d.timezone_fallback_users,digests_24h:d.digests_24h,player_reports_24h:d.player_reports_24h,reminders_24h:d.reminders_24h}));
          const live=await fetch(base+'/api/winline/live/status',{cache:'no-store',headers:{accept:'application/json'}}).then(async r=>({r,d:await r.json().catch(()=>({}))}));
          if(!live.r.ok||live.d?.ok!==true)throw new Error('Winline live status unhealthy '+JSON.stringify(live.d));
          if(Number(live.d.cadence_target_seconds)!==60||Number(live.d.quote_max_age_seconds)!==90)throw new Error('Winline live cadence contract regressed '+JSON.stringify(live.d));
          if(live.d.candidate_games>0&&live.d.healthy!==true)throw new Error('Winline live feed is stale with live candidates '+JSON.stringify(live.d));
          console.log('WINLINE_LIVE_STATUS_OK',JSON.stringify(live.d));
          JS

      - name: Repair and verify legacy Telegram bot
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          const url='https://hoh-nhl-daily-results.znamteam-903.workers.dev/api/telegram/legacy/status';
          let last=null;
          for(let i=0;i<15;i++){
            const r=await fetch(url,{headers:{accept:'application/json'},cache:'no-store'});
            last=await r.json().catch(()=>({}));
            console.log('LEGACY_TELEGRAM_STATUS',i+1,JSON.stringify(last));
            if(r.ok&&last?.ok&&last?.bot?.username==='hoh_nhl_daily_results_bot'&&
               last?.webhook?.url==='https://hoh-nhl-daily-results.znamteam-903.workers.dev/api/telegram'){
              console.log('LEGACY_TELEGRAM_WEBHOOK_OK',JSON.stringify({
                pending:last.webhook.pending_update_count,
                last_error:last.webhook.last_error_message,
                repaired:last.repair?.repaired||false,
                set_webhook_ok:last.repair?.set_webhook_ok,
                set_webhook_error:last.repair?.set_webhook_error||null
              }));
              process.exit(0);
            }
            await new Promise(res=>setTimeout(res,2000));
          }
          throw new Error('Legacy Telegram bot webhook unhealthy: '+JSON.stringify(last));
          JS

      - name: Verify Telegram Center polling tick
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          const url='https://hoh-nhl-daily-results.znamteam-903.workers.dev/api/telegram/center/status';
          let last=null;
          for(let i=0;i<50;i++){
            const r=await fetch(url,{headers:{accept:'application/json'},cache:'no-store'});
            last=await r.json().catch(()=>({}));
            const at=Date.parse(String(last?.polling?.polled_at||''));
            const fresh=Number.isFinite(at)&&(Date.now()-at)<180000;
            console.log('TELEGRAM_CENTER_POLL_WAIT',i+1,JSON.stringify(last?.polling||null));
            if(r.ok&&last?.delivery_mode==='polling'&&last?.webhook?.url===''&&fresh){
              console.log('TELEGRAM_CENTER_POLLING_TICK_OK',JSON.stringify(last.polling));
              process.exit(0);
            }
            await new Promise(res=>setTimeout(res,2000));
          }
          throw new Error('Telegram Center polling cron did not produce a fresh tick: '+JSON.stringify(last?.polling||null));
          JS

      - name: Verify production VK API
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          BASE='https://hoh-nhl-daily-results.znamteam-903.workers.dev/api/telegram-center-v18/vk'
          echo '=== STATUS ==='
          curl --fail-with-body --retry 5 --retry-delay 2 --max-time 30 "$BASE/status"
          echo
          echo '=== DISCOVERY ==='
          curl --fail-with-body --retry 5 --retry-delay 2 --max-time 60 "$BASE/discovery"
          echo
          echo '=== V19 PRODUCT SMOKE ==='
          node --input-type=module <<'JS'
          const base='https://hoh-nhl-daily-results.znamteam-903.workers.dev';
          const get=async(path,timeout=90000)=>{
            const c=new AbortController(),t=setTimeout(()=>c.abort(),timeout);
            try{
              const r=await fetch(base+path,{headers:{accept:'application/json'}});
              const d=await r.json().catch(()=>({}));
              if(!r.ok)throw new Error(path+' HTTP '+r.status+' '+JSON.stringify(d));
              return d;
            }finally{clearTimeout(t)}
          };
          const status=await get('/api/telegram-center-v19/status',120000);
          if(!status.roster_complete||status.teams_with_roster!==32)throw new Error('rosters incomplete '+JSON.stringify(status.missing_or_short_rosters||status.teams));
          const must=['WSH','BOS','DAL','COL','LAK','MTL','NSH','STL','SEA','TOR','PHI','FLA','UTA'];
          for(const tri of must){
            const d=await get('/api/telegram-center-v17/players?team='+tri+'&limit=250');
            if((d.players||[]).length<15)throw new Error(tri+' roster too short: '+(d.players||[]).length);
            const bad=(d.players||[]).find(p=>!p.player_id||!p.full_name_en||!p.full_name_ru||p.current_team_tri!==tri);
            if(bad)throw new Error(tri+' incomplete player '+JSON.stringify(bad));
            const nhl=await fetch('https://api-web.nhle.com/v1/roster/'+tri+'/current',{headers:{accept:'application/json','user-agent':'HOH-V19-production-smoke'}}).then(async r=>{if(!r.ok)throw new Error('NHL roster '+tri+' HTTP '+r.status);return r.json()});
            const liveCount=['forwards','defensemen','goalies'].reduce((n,k)=>n+(Array.isArray(nhl?.[k])?nhl[k].length:0),0);
            if(liveCount>=15&&(d.players||[]).length!==liveCount)throw new Error(tri+' roster mismatch app='+(d.players||[]).length+' nhl='+liveCount);
            console.log('ROSTER_OK',tri,(d.players||[]).length,'nhl_live',liveCount);
          }
          const sortedPlayers=await get('/api/telegram-center-v7/players?limit=10&sort=points&country=RUS');
          if(sortedPlayers.ok!==true||!Array.isArray(sortedPlayers.players)||sortedPlayers.players.length>10||sortedPlayers.sort!=='points'||sortedPlayers.country!=='RUS')throw new Error('player sort/country production API failed '+JSON.stringify(sortedPlayers).slice(0,500));
          const featured=await get('/api/telegram-center-v19/featured?date=2026-09-23');
          if(featured.ok!==true||!Object.prototype.hasOwnProperty.call(featured,'featured'))throw new Error('featured game production API failed '+JSON.stringify(featured).slice(0,500));
          const ruSearch=await get('/api/telegram-center-v17/players?q='+encodeURIComponent('Овечкин')+'&limit=20');
          const ovi=(ruSearch.players||[]).find(p=>Number(p.player_id)===8471214);
          if(!ovi)throw new Error('Russian player search failed for Ovechkin');
          const player=await get('/api/telegram-center-v17/players/8471214');
          if(!player.player?.full_name_ru||!player.player?.team_logo||!player.player?.primary_country_code)throw new Error('Ovechkin profile metadata incomplete');
          const audio=await get('/api/telegram-center-v11/pronunciation/8471214');
          console.log('PLAYER_OK',player.player.full_name_ru,player.player.primary_country_code,'audio',Boolean(audio.available),'pronunciation',player.player.pronunciation_text||null);
          const winlineStatus=await get('/api/winline/center/status');
          console.log('WINLINE_STATUS',JSON.stringify({events:winlineStatus.events,markets:winlineStatus.markets,active_markets:winlineStatus.active_markets,snapshots:winlineStatus.snapshots,snapshot_games:winlineStatus.snapshot_games,latest_market_update:winlineStatus.latest_market_update}));
          const regular=await get('/api/telegram-center-v19/broadcasts?from=2025-04-01&to=2025-04-07');
          if(!(regular.games||[]).length)throw new Error('regular archive empty');
          const oldVk=(regular.games||[]).find(g=>g.vk?.web_url||g.vk?.app_url);
          if(!oldVk)throw new Error('archive VK deeplink missing in regular smoke window');
          const playoffs=await get('/api/telegram-center-v19/broadcasts?from=2025-05-01&to=2025-05-07');
          const playoff=(playoffs.games||[]).find(g=>g.is_playoff);
          if(!playoff)throw new Error('playoff archive distinction missing');
          const match=await get('/api/telegram-center-v19/games/'+playoff.game_pk);
          if(!match.game?.is_playoff)throw new Error('playoff match detail flag missing');
          console.log('ARCHIVE_OK','regular',regular.games.length,'playoffs',playoffs.games.length,'vk_game',oldVk.game_pk,'playoff_game',playoff.game_pk,'odds_source',match.winline?.source||'none');
          const shell=await fetch(base+'/telegram-app-v24?build=24.8.0',{cache:'no-store'}).then(r=>r.text());
          const legacyUrlShell=await fetch(base+'/telegram-app?build=24.8.0',{cache:'no-store'}).then(r=>r.text());
          if(!shell.includes('HOH_CANONICAL_PLAYER_UI="V24"'))throw new Error('Canonical V24 marker missing from production shell');
          if(!legacyUrlShell.includes('HOH_CANONICAL_PLAYER_UI="V24"'))throw new Error('Legacy /telegram-app URL is not canonical');
          if(!shell.includes('/telegram-app/v19.js?build=24.8.0'))throw new Error('V19 script missing from canonical shell');
          if(!shell.includes('/telegram-app/v23-player.js?build=24.8.0'))throw new Error('V23 player script missing from canonical shell');
          if(!shell.includes('/telegram-app/v24-visual.js?build=24.8.0'))throw new Error('V24 visual layer missing from canonical shell');
