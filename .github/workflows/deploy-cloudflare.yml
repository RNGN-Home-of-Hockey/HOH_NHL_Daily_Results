name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-cloudflare.yml'

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '9032ec1bd3cb868d89a38453e4bd1a69' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing GitHub secret CLOUDFLARE_API_TOKEN'; exit 2; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing Cloudflare account id'; exit 2; }
          echo 'Cloudflare credentials are configured.'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply pending D1 migrations
        run: npx wrangler d1 migrations apply hoh-data-core --remote
      - name: Deploy Worker
        run: npx wrangler deploy
      - name: Verify production VK API
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          URL='https://hoh-nhl-daily-results.znamteam-903.workers.dev/api/telegram-center-v18/vk/status'
          echo "GET $URL"
          curl --fail-with-body --retry 5 --retry-delay 2 --max-time 30 "$URL"
          echo
