name: Stage2 Final Worker Smoke

on:
  push:
    paths:
      - '.github/workflows/stage2-final-worker-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Check Stage 2 modules
        run: |
          node --check cloudflare-worker/src/universal-market-evaluator.js
          node --check cloudflare-worker/src/rolling-league-ranks.js
          node --check cloudflare-worker/src/advanced-market-context.js
          node --check cloudflare-worker/src/insight-portfolio.js
          node --check cloudflare-worker/src/betting-insight-engine.js
          node --check cloudflare-worker/src/broadcast-dashboard-v2.js
          node --check cloudflare-worker/src/worker-entry.js
      - name: Wrangler full bundle dry run
        run: npx wrangler deploy --dry-run --outdir .stage2-build
      - name: Verify bundle
        run: |
          test -d .stage2-build
          find .stage2-build -maxdepth 2 -type f -print
          echo STAGE2_WORKER_BUNDLE_OK
