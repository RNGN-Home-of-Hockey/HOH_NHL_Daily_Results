name: Deploy Broadcast Renderer

on:
  push:
    branches: [main]
    paths:
      - 'vercel-broadcast-renderer/**'
      - '.github/workflows/deploy-broadcast-renderer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-broadcast-renderer-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Vercel credentials status
        id: creds
        shell: bash
        run: |
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            echo "configured=1" >> "$GITHUB_OUTPUT"
            echo "Vercel deploy credential is configured."
          else
            echo "configured=0" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN is not configured; renderer deployment is skipped."
          fi

      - name: Resolve production project
        if: steps.creds.outputs.configured == '1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vercel-broadcast-renderer/.vercel
          code=$(curl -sS -o /tmp/vercel-project.json -w '%{http_code}'             -H "Authorization: Bearer $VERCEL_TOKEN"             "https://api.vercel.com/v9/projects/hoh-broadcast-renderer")
          test "$code" = "200" || { echo "Cannot access Vercel project hoh-broadcast-renderer (HTTP $code)"; cat /tmp/vercel-project.json; exit 2; }
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('/tmp/vercel-project.json','utf8'));
          if(!p.id||!p.accountId)throw new Error('Vercel project response missing id/accountId');
          fs.writeFileSync('vercel-broadcast-renderer/.vercel/project.json',JSON.stringify({projectId:p.id,orgId:p.accountId}));
          console.log('Resolved Vercel project:',p.name,p.id,p.accountId);
          JS

      - name: Pull production settings
        if: steps.creds.outputs.configured == '1'
        working-directory: vercel-broadcast-renderer
        run: npx vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Prepare bundled TTF font
        if: steps.creds.outputs.configured == '1'
        working-directory: vercel-broadcast-renderer
        run: |
          python3 -m pip install --quiet fonttools
          curl -fsSL --retry 3 --retry-delay 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/sofiasanscondensed/SofiaSansCondensed-Italic%5Bwght%5D.ttf' -o /tmp/sofia-sans-condensed-variable.ttf
          python3 -m fontTools.varLib.instancer /tmp/sofia-sans-condensed-variable.ttf wght=700 --output assets/sofia-sans-condensed-italic.ttf
          test -s assets/sofia-sans-condensed-italic.ttf
          file assets/sofia-sans-condensed-italic.ttf

      - name: Build renderer
        if: steps.creds.outputs.configured == '1'
        working-directory: vercel-broadcast-renderer
        run: npx vercel@latest build --prod --token "$VERCEL_TOKEN"

      - name: Deploy renderer
        if: steps.creds.outputs.configured == '1'
        working-directory: vercel-broadcast-renderer
        run: npx vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN"

      - name: Verify production version
        if: steps.creds.outputs.configured == '1'
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            body="$(curl -fsSL --max-time 10 https://hoh-broadcast-renderer.vercel.app/api/health || true)"
            echo "health: $body"
            if echo "$body" | grep -q '2026-09-21-layout-v6-user-template'; then
              echo "BROADCAST_RENDERER_PRODUCTION_OK"
              break
            fi
            if [ "$i" = "24" ]; then
              echo "Production renderer did not report layout v6"
              exit 1
            fi
            sleep 5
          done

      - name: Verify production Cyrillic render
        if: steps.creds.outputs.configured == '1'
        shell: bash
        run: |
          set -euo pipefail
          http="$(curl -sS --max-time 20 -o /tmp/hoh-card.png -w '%{http_code}' \
            -X POST 'https://hoh-broadcast-renderer.vercel.app/api/render-card' \
            -H 'Content-Type: application/json' \
            --data '{"team":"FLA","team_name":"ФЛОРИДА","fact":"ФЛОРИДА ЗАКРЫЛА ФОРУ +1,5 В 96 ИЗ ПОСЛЕДНИХ 140 МАТЧЕЙ","market":"ФОРА +1,5 ГОЛА","odds":1.40,"stake":1000}')"
          echo "render_http=$http"
          test "$http" = "200"
          test -s /tmp/hoh-card.png
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const b=fs.readFileSync('/tmp/hoh-card.png');
          if(b.length<1000)throw new Error('rendered PNG too small: '+b.length);
          if(b.subarray(1,4).toString('ascii')!=='PNG')throw new Error('rendered output is not PNG');
          const width=b.readUInt32BE(16),height=b.readUInt32BE(20);
          if(width!==820||height!==211)throw new Error('unexpected PNG size '+width+'x'+height);
          console.log('BROADCAST_RENDER_CYRILLIC_SMOKE_OK',JSON.stringify({bytes:b.length,width,height}));
          JS
