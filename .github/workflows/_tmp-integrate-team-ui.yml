name: Temporary integrate Team Center UI
on:
  push:
    paths:
      - '.github/workflows/_tmp-integrate-team-ui.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch Control Center and Mini App
        run: |
          python - <<'PY'
          from pathlib import Path

          # Control Center: add a first-class Team Center link without rewriting the app shell.
          p=Path('cloudflare-worker/src/control-center.js')
          s=p.read_text()
          old='<a href="/broadcast">Broadcast Stats</a><button class="navbtn" data-tab="players">Игроки</button>'
          new='<a href="/broadcast">Broadcast Stats</a><a href="/teams">Team Center</a><button class="navbtn" data-tab="players">Игроки</button>'
          if old not in s:
              raise SystemExit('control nav anchor missing')
          p.write_text(s.replace(old,new,1))

          # Telegram Mini App: add a Teams tab backed by compact current snapshots.
          p=Path('cloudflare-worker/src/telegram-mini-app.js')
          s=p.read_text()
          old="const state={bootstrap:null,date:new Date().toISOString().slice(0,10),games:[],team:'',query:'',players:[],tab:'games'};"
          new="const state={bootstrap:null,date:new Date().toISOString().slice(0,10),games:[],team:'',query:'',players:[],teamsData:[],teamWindow:20,tab:'games'};"
          if old not in s: raise SystemExit('mini state anchor missing')
          s=s.replace(old,new,1)

          anchor="  async function toggleFollow(type,key,remove){"
          block=r'''  async function loadTeamRankings(){setBusy('#content','Загружаю команды…');try{const d=await api('/api/telegram-app/teams?window='+state.teamWindow);state.teamsData=d.teams||[];renderTeamRankings()}catch(e){$('#content').innerHTML='<div class="empty">Рейтинг команд появится после ночного compact sync.</div>'}}
  function renderTeamRankings(){const c=$('#content');if(!state.teamsData.length){c.innerHTML='<div class="empty">Нет данных по командам</div>';return}c.innerHTML='<div class="teamcards">'+state.teamsData.map(t=>`<button class="tcard" data-teamcard="${esc(t.team_tri)}"><div class="tclub">${t.logo_url?`<img src="${esc(t.logo_url)}" alt="">`:`<span class="tri">${esc(t.team_tri)}</span>`}<div><b>${esc(t.name_ru||t.name_en||t.team_tri)}</b><small>${esc(t.team_tri)} · ${state.teamWindow} матчей</small></div><strong>#${t.rank_goal_diff??'—'}</strong></div><div class="tnums"><span><b>${num(t.gf_pg,2)}</b><small>GF/м · #${t.rank_gf??'—'}</small></span><span><b>${num(t.ga_pg,2)}</b><small>GA/м · #${t.rank_ga??'—'}</small></span><span><b>${num(t.xgf_pct_5v5,1)}%</b><small>xGF · #${t.rank_xgf_pct_5v5??'—'}</small></span></div></button>`).join('')+'</div>';document.querySelectorAll('[data-teamcard]').forEach(b=>b.onclick=()=>openTeam(b.dataset.teamcard))}
  async function openTeam(tri){const overlay=$('#overlay');overlay.classList.add('open');$('#detail').innerHTML='<div class="empty">Загружаю команду…</div>';try{const d=await api('/api/telegram-app/teams/'+tri);const t=d.team;const snap=(d.snapshots||[]).find(r=>Number(r.window_games)===state.teamWindow)||(d.snapshots||[]).slice(-1)[0]||{};const follow=state.bootstrap?.follows?.some(f=>f.subject_type==='team'&&String(f.subject_key)===String(tri));$('#detail').innerHTML=`<div class="detailtop"><div><span class="state">${esc(tri)} · ${state.teamWindow} МАТЧЕЙ</span><h2>${esc(t.name_ru||t.name_en||tri)}</h2><p>текущая форма · league rank · advanced 5v5</p></div><button class="x" id="close">×</button></div><button class="follow ${follow?'on':''}" id="follow">${follow?'✓ Вы подписаны на команду':'＋ Подписаться на команду'}</button><div class="teammetrics"><span><b>${num(snap.gf_pg,2)}</b><small>GF/м · #${snap.rank_gf??'—'}</small></span><span><b>${num(snap.ga_pg,2)}</b><small>GA/м · #${snap.rank_ga??'—'}</small></span><span><b>${num(snap.xgf_pct_5v5,1)}%</b><small>xGF · #${snap.rank_xgf_pct_5v5??'—'}</small></span><span><b>${num(snap.corsi_pct,1)}%</b><small>Corsi · #${snap.rank_corsi??'—'}</small></span></div><h3>Лидеры · 20 матчей</h3><div class="players">${(d.skaters||[]).map(p=>`<button class="playerline" data-player="${p.player_id}"><span>${esc(p.full_name_ru||p.full_name_en)}</span><b>${num(p.points_pg,2)} очк/м · ${num(p.goals_pg,2)} гол/м</b></button>`).join('')||'<div class="empty">Игроки появятся после compact sync</div>'}</div><h3>Вратари</h3><div class="roll">${(d.goalies||[]).map(p=>`<div><b>${esc(p.full_name_ru||p.full_name_en)}</b><span>${num(Number(p.save_pct)*100,1)}% SV · ${p.wins}W</span></div>`).join('')||'<div class="empty">Нет данных</div>'}</div>`;$('#close').onclick=()=>overlay.classList.remove('open');$('#follow').onclick=()=>toggleFollow('team',tri,follow);document.querySelectorAll('[data-player]').forEach(b=>b.onclick=()=>openPlayer(Number(b.dataset.player)))}catch(e){$('#detail').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
'''
          if anchor not in s: raise SystemExit('mini follow anchor missing')
          s=s.replace(anchor,block+anchor,1)

          old="state.bootstrap.follows=d.follows||[];if(type==='player')openPlayer(Number(key))"
          new="state.bootstrap.follows=d.follows||[];if(type==='player')openPlayer(Number(key));if(type==='team')openTeam(String(key))"
          if old not in s: raise SystemExit('toggle follow refresh anchor missing')
          s=s.replace(old,new,1)

          old="function setTab(tab){state.tab=tab;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#filters').style.display=tab==='players'?'grid':'none';$('#datebar').style.display=tab==='games'?'flex':'none';if(tab==='games')renderGames();if(tab==='players')loadPlayers();if(tab==='follows')showFollows()}"
          new="function setTab(tab){state.tab=tab;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#filters').style.display=tab==='players'?'grid':'none';$('#datebar').style.display=tab==='games'?'flex':'none';if(tab==='games')renderGames();if(tab==='teams')loadTeamRankings();if(tab==='players')loadPlayers();if(tab==='follows')showFollows()}"
          if old not in s: raise SystemExit('mini tab anchor missing')
          s=s.replace(old,new,1)

          old='.tabs{display:grid;grid-template-columns:repeat(3,1fr);'
          new='.tabs{display:grid;grid-template-columns:repeat(4,1fr);'
          if old not in s: raise SystemExit('tabs css anchor missing')
          s=s.replace(old,new,1)

          css_anchor='.empty{padding:28px 14px;text-align:center;color:#75757d;font-size:12px}'
          css_add=r'''.empty{padding:28px 14px;text-align:center;color:#75757d;font-size:12px}.teamcards{display:grid;gap:8px}.tcard{width:100%;border:1px solid var(--line);background:#141416;color:#fff;border-radius:15px;padding:12px;text-align:left}.tclub{display:flex;align-items:center;gap:9px}.tclub img{width:34px;height:34px;object-fit:contain}.tclub div{display:flex;flex-direction:column;gap:3px;min-width:0}.tclub b{font-size:12px}.tclub small{font-size:8px;color:#707078}.tclub strong{margin-left:auto;color:var(--lav);font-size:16px}.tnums,.teammetrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}.tnums span,.teammetrics span{display:flex;flex-direction:column;border-top:1px solid #242429;padding-top:8px}.tnums b,.teammetrics b{font-size:14px}.tnums small,.teammetrics small{font-size:7px;color:#696970;margin-top:3px}.teammetrics{grid-template-columns:repeat(2,1fr);margin:15px 0}.teammetrics span{border:1px solid #29292e;border-radius:10px;padding:10px}.teammetrics b{font-size:18px}'''
          if css_anchor not in s: raise SystemExit('team css anchor missing')
          s=s.replace(css_anchor,css_add,1)

          old='<div class="tabs"><button class="tab active" data-tab="games">Матчи</button><button class="tab" data-tab="players">Игроки</button><button class="tab" data-tab="follows">Подписки</button></div>'
          new='<div class="tabs"><button class="tab active" data-tab="games">Матчи</button><button class="tab" data-tab="teams">Команды</button><button class="tab" data-tab="players">Игроки</button><button class="tab" data-tab="follows">Подписки</button></div>'
          if old not in s: raise SystemExit('tabs html anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          node --check cloudflare-worker/src/control-center.js
          node --check cloudflare-worker/src/telegram-mini-app.js
          node --check cloudflare-worker/src/team-current-ui.js
          node --check cloudflare-worker/src/team-current-routes.js
          node --check cloudflare-worker/src/worker-entry.js
          git diff --check
      - name: Worker dry run
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir .team-ui-build
      - name: Commit UI integration
        run: |
          git config user.name 'znamteam-max'
          git config user.email 'znamteam@gmail.com'
          git add cloudflare-worker/src/control-center.js cloudflare-worker/src/telegram-mini-app.js
          git commit -m 'Add Team Center to Control and Telegram Mini App'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
