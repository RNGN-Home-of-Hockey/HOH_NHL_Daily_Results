name: Validate Feature Layer

on:
  push:
    paths:
      - '.github/workflows/validate-feature-layer.yml'
      - 'scripts/patch_feature_layer.py'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply integration patch
        run: python scripts/patch_feature_layer.py
      - name: Syntax checks
        run: |
          node --check cloudflare-worker/src/team-game-features.js
          node --check cloudflare-worker/src/feature-market-insights.js
          node --check cloudflare-worker/src/data-core-backfill.js
          node --check cloudflare-worker/src/betting-insight-engine.js
          node --check cloudflare-worker/src/index.js
          node --check cloudflare-worker/src/worker-entry.js
          git diff --check
      - name: Validate migration math in SQLite
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db = sqlite3.connect(':memory:')
          db.row_factory = sqlite3.Row
          for name in ['0001_hoh_data_core.sql','0002_importer_hardening.sql','0003_backfill_jobs.sql']:
              db.executescript(Path('migrations', name).read_text())

          db.executemany(
              "INSERT INTO teams(tri_code,name_en) VALUES(?,?)",
              [('BUF','Buffalo Sabres'),('NJD','New Jersey Devils')],
          )
          db.execute("""
              INSERT INTO games(game_pk,season_id,game_type,scheduled_start_utc,game_state,home_tri,away_tri,home_score,away_score,current_period,period_type)
              VALUES(2024029999,'20242025',2,'2024-10-10T23:00:00Z','FINAL','BUF','NJD',3,1,3,'REG')
          """)
          db.executemany(
              "INSERT INTO period_scores(game_pk,period_number,period_type,home_goals,away_goals) VALUES(2024029999,?,'REG',?,?)",
              [(1,1,0),(2,1,1),(3,1,0)],
          )
          events = [
              ('2024029999:1',1,'goal','BUF',1),
              ('2024029999:2',2,'shot-on-goal','BUF',1),
              ('2024029999:3',3,'shot-on-goal','NJD',1),
              # NHL eventOwnerTeamId on blocked-shot is the blocking team.
              # NJD blocking means the attempt belongs to BUF for Corsi.
              ('2024029999:4',4,'blocked-shot','NJD',1),
              ('2024029999:5',5,'missed-shot','BUF',1),
          ]
          db.executemany(
              "INSERT INTO game_events(event_key,game_pk,event_id,sort_order,event_type,period_number,period_type,team_tri) VALUES(?,2024029999,?,?,?,?,'REG',?)",
              [(key, sort, sort, typ, period, tri) for key,sort,typ,tri,period in events],
          )
          db.executemany(
              """INSERT INTO team_game_stats(game_pk,team_tri,is_home,goals,shots,hits,pim,power_play_goals)
                 VALUES(2024029999,?,?,?,?,?,?,?)""",
              [('BUF',1,3,30,20,4,1),('NJD',0,1,20,18,6,0)],
          )

          db.executescript(Path('migrations/0004_team_game_features.sql').read_text())
          rows = db.execute("SELECT * FROM team_game_features ORDER BY team_tri").fetchall()
          assert len(rows) == 2, len(rows)
          by = {r['team_tri']: r for r in rows}
          buf = by['BUF']; njd = by['NJD']
          assert buf['final_goal_diff'] == 2
          assert buf['regulation_result'] == 'W'
          assert buf['first_goal_for'] == 1 and njd['first_goal_for'] == 0
          assert buf['corsi_for'] == 4 and buf['corsi_against'] == 1, (buf['corsi_for'],buf['corsi_against'])
          assert buf['fenwick_for'] == 3 and buf['fenwick_against'] == 1
          assert round(buf['corsi_for_pct'], 1) == 80.0
          assert buf['p1_shots_for'] == 2 and buf['p1_shots_against'] == 1
          print('FEATURE_TEST_OK', {
              'BUF_CF': buf['corsi_for'], 'BUF_CA': buf['corsi_against'],
              'BUF_CF%': buf['corsi_for_pct'], 'BUF_FF': buf['fenwick_for'],
              'BUF_FF%': buf['fenwick_for_pct'], 'rows': len(rows)
          })
          PY
      - name: Commit integrated code
        run: |
          git config user.name 'znamteam-max'
          git config user.email 'znamteam@gmail.com'
          git add cloudflare-worker/src/data-core-backfill.js cloudflare-worker/src/betting-insight-engine.js cloudflare-worker/src/index.js
          git commit -m 'Integrate materialized features into backfill and insights'
          git push origin HEAD:main
