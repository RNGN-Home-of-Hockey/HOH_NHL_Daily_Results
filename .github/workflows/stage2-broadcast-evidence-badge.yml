name: Stage2 Broadcast Evidence Badge

on:
  push:
    paths:
      - '.github/workflows/stage2-broadcast-evidence-badge.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Add evidence badge to compact cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-worker/src/broadcast-dashboard-v2.js')
          s=p.read_text(encoding='utf-8')
          old="""function broadcastCardHtml(c,large=false){const odds=Number(c.market?.odds),market=c.market?.label||'Рынок Winline',demo=c.market?.odds_is_demo===true;return `<div class=\"aircard ${large?'large':''}\"><div class=\"factrow\"><div class=\"signaleyebrow\">${esc(c.eyebrow||'HOH INSIGHT')}${demo?'<span class=\"demotag\">DEMO</span>':''}</div><div class=\"signaltitle\">${esc(c.title||c.value||'')}</div></div><div class=\"betline\"><div class=\"winlinebrand\"><img src=\"/broadcast/winline-logo.png\" alt=\"Winline\"></div><div class=\"betmarket\">${esc(market)}</div><div class=\"oddsbox\">${Number.isFinite(odds)?odds.toFixed(2):'—'}</div></div></div>`}"""
          new="""function broadcastCardHtml(c,large=false){const odds=Number(c.market?.odds),market=c.market?.label||'Рынок Winline',demo=c.market?.odds_is_demo===true,q=c.evidence_quality||{},tier=String(q.tier||''),support=Number(q.independent_support_count||c.evidence?.independent_support_count||0),quality=tier&&tier!=='LIVE'?`<span class=\"qualitytag q${esc(tier)}\" title=\"Сила доказательств, не вероятность\">${esc(tier)}${support>0?' · +'+support:''}</span>`:'';return `<div class=\"aircard ${large?'large':''}\"><div class=\"factrow\"><div class=\"signaleyebrow\">${esc(c.eyebrow||'HOH INSIGHT')}${quality}${demo?'<span class=\"demotag\">DEMO</span>':''}</div><div class=\"signaltitle\">${esc(c.title||c.value||'')}</div></div><div class=\"betline\"><div class=\"winlinebrand\"><img src=\"/broadcast/winline-logo.png\" alt=\"Winline\"></div><div class=\"betmarket\">${esc(market)}</div><div class=\"oddsbox\">${Number.isFinite(odds)?odds.toFixed(2):'—'}</div></div></div>`}"""
          if old not in s:
              raise SystemExit('broadcastCardHtml anchor missing')
          s=s.replace(old,new,1)
          css='.demotag{flex:0 0 auto;font-size:7px;letter-spacing:.08em;color:#ff8b62;border:1px solid rgba(255,90,31,.45);border-radius:4px;padding:2px 4px}'
          add=css+'.qualitytag{flex:0 0 auto;font-size:7px;letter-spacing:.06em;border:1px solid #3a3a40;border-radius:4px;padding:2px 4px;color:#aaa}.qualitytag.qA{color:var(--green);border-color:rgba(131,230,177,.45)}.qualitytag.qB{color:var(--lav);border-color:rgba(200,183,255,.38)}.qualitytag.qC{color:#777}'
          if css not in s:
              raise SystemExit('demotag CSS anchor missing')
          s=s.replace(css,add,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check cloudflare-worker/src/broadcast-dashboard-v2.js
          git diff --check
      - name: Verify badge source and Worker bundle
        run: |
          grep -q 'qualitytag q' cloudflare-worker/src/broadcast-dashboard-v2.js
          grep -q 'Сила доказательств, не вероятность' cloudflare-worker/src/broadcast-dashboard-v2.js
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir .stage2-badge-build
          test -d .stage2-badge-build
          echo STAGE2_EVIDENCE_BADGE_OK
      - name: Commit badge
        run: |
          git config user.name 'znamteam-max'
          git config user.email 'znamteam@gmail.com'
          git add cloudflare-worker/src/broadcast-dashboard-v2.js
          git commit -m 'Show evidence tier on Broadcast cards'
          git push origin HEAD:main
