name: One-shot inspect broadcast template

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-inspect-broadcast-template.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Inspect repo and live template
        shell: bash
        run: |
          set -euo pipefail
          f='vercel-broadcast-renderer/assets/card-template.webp'
          echo "REPO_SIZE=$(wc -c < "$f")"
          file "$f" || true
          xxd -l 32 "$f" || true
          curl -fsSL --retry 3 'https://hoh-nhl-daily-results.znamteam-903.workers.dev/broadcast/card-template.webp' -o /tmp/live.webp
          echo "LIVE_SIZE=$(wc -c < /tmp/live.webp)"
          file /tmp/live.webp || true
          xxd -l 32 /tmp/live.webp || true
          python3 - <<'PY'
          from PIL import Image
          for p in ['vercel-broadcast-renderer/assets/card-template.webp','/tmp/live.webp']:
              try:
                  im=Image.open(p); print('PIL_OK',p,im.size,im.format)
              except Exception as e:
                  print('PIL_ERR',p,repr(e))
          PY
