name: Sync NBA Winline Line

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-nba-winline.yml'
      - 'tools/sync_winline_nba.js'
      - 'migrations/0046_nba_winline_live_markets.sql'
      - 'migrations/0047_nba_winline_seed_20261007.sql'

permissions:
  contents: read

concurrency:
  group: nba-winline-sync
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '9032ec1bd3cb868d89a38453e4bd1a69' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure Winline tables exist
        run: npx wrangler d1 execute hoh-data-core --remote --file=migrations/0046_nba_winline_live_markets.sql

      - name: Seed last verified Winline snapshot if empty
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute hoh-data-core --remote --command "SELECT COUNT(*) AS c FROM nba_winline_events" --json > /tmp/winline-count.json
          COUNT=$(python - <<'PY'
          import json
          d=json.load(open('/tmp/winline-count.json'))
          rows=(d[0].get('results') or []) if isinstance(d,list) and d else []
          print(int(rows[0].get('c',0)) if rows else 0)
          PY
          )
          echo "Current Winline events in D1: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            npx wrangler d1 execute hoh-data-core --remote --file=migrations/0047_nba_winline_seed_20261007.sql
          fi

      - name: Install Winline browser client
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -n "$CHROME" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$CHROME" >> "$GITHUB_ENV"
            echo "Using system Chrome: $CHROME"
          else
            npx playwright install --with-deps chromium
          fi

      - name: Refresh from live Winline line
        id: refresh
        shell: bash
        run: |
          set +e
          node tools/sync_winline_nba.js
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ] && [ -s winline_sync.sql ]; then
            npx wrangler d1 execute hoh-data-core --remote --file=winline_sync.sql
            echo "live_refresh=ok" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Live Winline refresh unavailable; preserving the last verified snapshot in D1"
            echo "live_refresh=fallback" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Winline line in D1
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute hoh-data-core --remote --command "SELECT source,fetched_at,event_count,market_count,player_props_count,status,note FROM nba_winline_sync WHERE source='winline'; SELECT COUNT(*) AS events FROM nba_winline_events; SELECT COUNT(*) AS markets FROM nba_winline_markets;" --json > /tmp/verify.json
          cat /tmp/verify.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/verify.json'))
          groups=d if isinstance(d,list) else []
          flat=[]
          for g in groups:
              flat.extend(g.get('results') or [])
          event_counts=[int(x.get('events',-1)) for x in flat if 'events' in x]
          market_counts=[int(x.get('markets',-1)) for x in flat if 'markets' in x]
          assert event_counts and event_counts[-1] >= 1, flat
          assert market_counts and market_counts[-1] >= 20, flat
          PY
