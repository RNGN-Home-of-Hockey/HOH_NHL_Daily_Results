name: Audit unmatched VK games

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vk-unmatched-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '9032ec1bd3cb868d89a38453e4bd1a69' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Summary
        run: |
          npx wrangler d1 execute hoh-data-core --remote --command "
          SELECT CAST(g.season_id AS TEXT) season_id,substr(g.scheduled_start_utc,1,7) month,g.game_type,
                 COUNT(*) unmatched
          FROM games g LEFT JOIN game_vk_broadcasts m ON m.game_pk=g.game_pk
          WHERE CAST(g.season_id AS TEXT) IN ('20242025','20252026')
            AND g.game_type IN (2,3) AND m.game_pk IS NULL
          GROUP BY 1,2,3 ORDER BY 1,2,3;"
      - name: Unmatched games with nearby same-team VK candidates
        run: |
          npx wrangler d1 execute hoh-data-core --remote --command "
          WITH u AS (
            SELECT g.game_pk,g.season_id,g.game_type,g.scheduled_start_utc,g.away_tri,g.home_tri
            FROM games g LEFT JOIN game_vk_broadcasts m ON m.game_pk=g.game_pk
            WHERE CAST(g.season_id AS TEXT) IN ('20242025','20252026')
              AND g.game_type IN (2,3) AND m.game_pk IS NULL
          )
          SELECT u.game_pk,u.season_id,u.game_type,u.scheduled_start_utc,u.away_tri,u.home_tri,
                 b.source_key,b.title,b.scheduled_at,b.published_at,
                 ROUND(ABS((julianday(COALESCE(b.scheduled_at,b.published_at))-julianday(u.scheduled_start_utc))*24),2) delta_hours
          FROM u
          LEFT JOIN vk_broadcasts b
            ON ((b.parsed_home_tri=u.home_tri AND b.parsed_away_tri=u.away_tri)
             OR (b.parsed_home_tri=u.away_tri AND b.parsed_away_tri=u.home_tri))
           AND ABS(julianday(COALESCE(b.scheduled_at,b.published_at))-julianday(u.scheduled_start_utc)) <= 3
          ORDER BY u.scheduled_start_utc,u.game_pk,delta_hours
          LIMIT 1000;"
      - name: Unmatched counts by team
        run: |
          npx wrangler d1 execute hoh-data-core --remote --command "
          WITH u AS (
            SELECT g.home_tri,g.away_tri
            FROM games g LEFT JOIN game_vk_broadcasts m ON m.game_pk=g.game_pk
            WHERE CAST(g.season_id AS TEXT) IN ('20242025','20252026')
              AND g.game_type IN (2,3) AND m.game_pk IS NULL
          ), teams AS (
            SELECT home_tri tri FROM u UNION ALL SELECT away_tri tri FROM u
          )
          SELECT tri,COUNT(*) unmatched_games FROM teams GROUP BY tri ORDER BY unmatched_games DESC,tri;"
      - name: Raw Rangers Islanders VK titles
        run: |
          npx wrangler d1 execute hoh-data-core --remote --command "
          SELECT source_key,title,scheduled_at,published_at,parsed_home_tri,parsed_away_tri
          FROM vk_broadcasts
          WHERE (title LIKE '%Рейндж%' OR title LIKE '%рейндж%' OR title LIKE '%Айленд%' OR title LIKE '%айленд%')
            AND COALESCE(scheduled_at,published_at) >= '2025-09-01'
          ORDER BY COALESCE(scheduled_at,published_at) ASC
          LIMIT 500;"
      - name: Unmatched games only
        run: |
          npx wrangler d1 execute hoh-data-core --remote --command "
          SELECT g.game_pk,g.season_id,g.game_type,g.scheduled_start_utc,g.away_tri,g.home_tri
          FROM games g LEFT JOIN game_vk_broadcasts m ON m.game_pk=g.game_pk
          WHERE CAST(g.season_id AS TEXT) IN ('20242025','20252026')
            AND g.game_type IN (2,3) AND m.game_pk IS NULL
          ORDER BY g.scheduled_start_utc,g.game_pk;"
