name: Apply HOH Live Center stage 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hoh-live-center-stage2-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Fix HOH Live Center stage 2 patcher'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply patch
        run: python3 tools/apply_live_center_stage2_patch.py
      - name: Validate targeted Live Center tests
        run: |
          set -euo pipefail
          node --check cloudflare-worker/src/nhl-live-score-maintenance.js
          node --check cloudflare-worker/src/live-betting-engine.js
          node --check cloudflare-worker/src/broadcast-dashboard-v2.js
          node --check cloudflare-worker/src/broadcast-operator.js
          node --check cloudflare-worker/src/worker-entry.js
          node tests/validate_live_center_stage2.mjs
          node tests/validate_broadcast_operator.mjs
          node tests/validate_broadcast_multi_match_state.mjs
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name 'HOH Live Center bot'
          git config user.email 'actions@users.noreply.github.com'
          git add cloudflare-worker/src/nhl-live-score-maintenance.js cloudflare-worker/src/worker-entry.js cloudflare-worker/src/live-betting-engine.js cloudflare-worker/src/broadcast-dashboard-v2.js cloudflare-worker/src/broadcast-operator.js tests/validate_live_center_stage2.mjs .github/workflows/validate-product.yml docs/BROADCAST_CONTROL_ROOM_V2_PLAN.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Improve Live Center score, cards and overlay reliability'
          git push origin HEAD:main
