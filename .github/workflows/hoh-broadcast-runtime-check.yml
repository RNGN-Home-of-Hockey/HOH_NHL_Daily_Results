name: HOH Broadcast Runtime Check

on:
  push:
    paths:
      - '.github/workflows/hoh-broadcast-runtime-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate generated browser JS
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { handleBroadcastRequest } from './cloudflare-worker/src/broadcast-dashboard-v2.js';
          const request = new Request('https://example.test/broadcast/app.js');
          const response = await handleBroadcastRequest(request, {}, '/broadcast/app.js');
          if (!response || response.status !== 200) throw new Error('app.js route did not return 200');
          const body = await response.text();
          await import('node:fs/promises').then(fs => fs.writeFile('/tmp/broadcast-app.js', body));
          console.log('APP_JS_BYTES', body.length);
          console.log(body.slice(0, 120));
          NODE
          node --check /tmp/broadcast-app.js
          echo GENERATED_APP_JS_OK
