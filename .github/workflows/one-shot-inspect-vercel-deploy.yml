name: One-shot inspect Vercel deploy credentials

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-inspect-vercel-deploy.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check configured deploy credentials
        shell: bash
        run: |
          if [ -n "${VERCEL_TOKEN:-}" ]; then echo "VERCEL_TOKEN_CONFIGURED=yes"; else echo "VERCEL_TOKEN_CONFIGURED=no"; fi
          if [ -n "${VERCEL_ORG_ID:-}" ]; then echo "VERCEL_ORG_ID_CONFIGURED=yes"; else echo "VERCEL_ORG_ID_CONFIGURED=no"; fi
          if [ -n "${VERCEL_PROJECT_ID:-}" ]; then echo "VERCEL_PROJECT_ID_CONFIGURED=yes"; else echo "VERCEL_PROJECT_ID_CONFIGURED=no"; fi
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            code=$(curl -sS -o /tmp/project.json -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/hoh-broadcast-renderer" || true)
            echo "VERCEL_PROJECT_LOOKUP_HTTP=$code"
            if [ "$code" = "200" ]; then
              node -e 'const p=require("/tmp/project.json"); console.log("VERCEL_PROJECT_FOUND=yes"); console.log("VERCEL_PROJECT_NAME="+(p.name||"")); console.log("VERCEL_PROJECT_ACCOUNT="+(p.accountId||"")); console.log("VERCEL_PROJECT_ID="+(p.id||""));'
            else
              echo "VERCEL_PROJECT_FOUND=no"
            fi
          fi
