name: Audit Winline Market Coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-winline-market-coverage.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '9032ec1bd3cb868d89a38453e4bd1a69' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Current Winline inventory
        run: |
          set -euo pipefail
          echo '=== ACTIVE INVENTORY ==='
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT
              COUNT(*) active_selections,
              COUNT(DISTINCT m.winline_event_id) events,
              COUNT(DISTINCT m.market_type) market_type_keys
            FROM winline_markets m
            WHERE m.active=1 AND m.odds IS NOT NULL;
          "
          echo '=== EVENT MATCHING ==='
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT
              COUNT(*) events_total,
              SUM(CASE WHEN game_pk IS NOT NULL THEN 1 ELSE 0 END) matched_games,
              SUM(CASE WHEN game_pk IS NULL THEN 1 ELSE 0 END) unmatched_events,
              MIN(starts_at) first_start,
              MAX(starts_at) last_start,
              MAX(updated_at) latest_event_update
            FROM winline_events;
          "
          echo '=== ACTIVE EVENTS ==='
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT e.winline_event_id,e.game_pk,e.starts_at,e.status,
                   COUNT(CASE WHEN m.active=1 AND m.odds IS NOT NULL THEN 1 END) active_selections,
                   MAX(m.updated_at) latest_market_update
            FROM winline_events e
            LEFT JOIN winline_markets m ON m.winline_event_id=e.winline_event_id
            GROUP BY e.winline_event_id,e.game_pk,e.starts_at,e.status
            HAVING active_selections>0
            ORDER BY datetime(e.starts_at) ASC
            LIMIT 60;
          "
          echo '=== MARKET TYPES ==='
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT m.market_type,COUNT(*) selections,COUNT(DISTINCT m.winline_event_id) events
            FROM winline_markets m
            WHERE m.active=1 AND m.odds IS NOT NULL
            GROUP BY m.market_type
            ORDER BY selections DESC,market_type ASC
            LIMIT 120;
          "
          echo '=== FREETEXT FAMILIES ==='
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT
              COALESCE(json_extract(m.raw_json,'$.freetext'),'') freetext,
              COUNT(*) selections,
              COUNT(DISTINCT m.winline_event_id) events
            FROM winline_markets m
            WHERE m.active=1 AND m.odds IS NOT NULL
            GROUP BY freetext
            ORDER BY selections DESC,freetext ASC
            LIMIT 120;
          "
          echo '=== SAMPLE FUTURE EVENT 2026020001 ==='
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT m.winline_market_id,m.market_type,m.subject_key,m.outcome_name,m.odds,
                   json_extract(m.raw_json,'$.freetext') freetext,
                   json_extract(m.raw_json,'$.value') line_value
            FROM winline_markets m
            JOIN winline_events e ON e.winline_event_id=m.winline_event_id
            WHERE e.game_pk=2026020001 AND m.active=1 AND m.odds IS NOT NULL
            ORDER BY m.market_type,m.winline_market_id;
          "
          echo '=== LIVE FREETEXT FAMILIES ==='
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT
              COALESCE(json_extract(m.raw_json,'$.freetext'),'') freetext,
              COUNT(*) selections
            FROM winline_markets m
            WHERE m.active=1 AND m.odds IS NOT NULL AND m.is_live=1
            GROUP BY freetext
            ORDER BY selections DESC,freetext ASC
            LIMIT 80;
          "

      - name: Incident audit game 2026010021
        run: |
          set -euo pipefail
          GAME=2026010021
          echo '=== INCIDENT GAME ==='
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT game_pk,season_id,game_type,scheduled_start_utc,game_state,home_tri,away_tri,home_score,away_score,last_synced_at
            FROM games WHERE game_pk=$GAME;
          "
          echo '=== INCIDENT WINLINE EVENTS ==='
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT winline_event_id,game_pk,status,starts_at,updated_at,deeplink,raw_json
            FROM winline_events WHERE game_pk=$GAME ORDER BY updated_at;
          "
          echo '=== INCIDENT CURRENT MARKET STATE ==='
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT is_live,active,COUNT(*) selections,COUNT(DISTINCT market_type) market_types,
                   MIN(updated_at) oldest_update,MAX(updated_at) newest_update
            FROM winline_markets
            WHERE winline_event_id IN (SELECT winline_event_id FROM winline_events WHERE game_pk=$GAME)
            GROUP BY is_live,active ORDER BY is_live,active;
          "
          echo '=== INCIDENT LIVE MARKET FAMILIES ==='
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT market_type,COALESCE(json_extract(raw_json,'$.freetext'),'') freetext,
                   COUNT(*) selections,SUM(CASE WHEN active=1 THEN 1 ELSE 0 END) active_selections,
                   MIN(updated_at) first_update,MAX(updated_at) last_update
            FROM winline_markets
            WHERE winline_event_id IN (SELECT winline_event_id FROM winline_events WHERE game_pk=$GAME)
              AND is_live=1
            GROUP BY market_type,freetext
            ORDER BY datetime(last_update) ASC,market_type ASC;
          "
          echo '=== INCIDENT SNAPSHOT RANGE ==='
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT is_live,COUNT(*) snapshots,COUNT(DISTINCT winline_market_id) markets,
                   MIN(captured_at) first_at,MAX(captured_at) last_at
            FROM winline_market_snapshots
            WHERE game_pk=$GAME
            GROUP BY is_live ORDER BY is_live;
          "
          echo '=== INCIDENT LIVE SNAPSHOTS BY MINUTE ==='
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT strftime('%Y-%m-%d %H:%M',captured_at) minute,
                   COUNT(*) rows,COUNT(DISTINCT winline_market_id) markets,
                   ROUND(MIN(odds),3) min_odds,ROUND(MAX(odds),3) max_odds
            FROM winline_market_snapshots
            WHERE game_pk=$GAME AND is_live=1
            GROUP BY minute ORDER BY minute;
          "
          echo '=== INCIDENT BROADCAST INSIGHT HISTORY ==='
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT market_type,period,subject,side,line,first_odds,latest_odds,
                   first_seen_at,last_seen_at,seen_count,top_for_air_seen
            FROM broadcast_insight_history
            WHERE game_pk=$GAME
            ORDER BY datetime(last_seen_at),market_type;
          "
          echo '=== INCIDENT WINLINE LIFECYCLE ==='
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT market_type,subject_key,outcome_name,opening_odds,closing_odds,
                   opening_at,closing_at,min_odds,max_odds,snapshot_count
            FROM winline_market_lifecycle
            WHERE game_pk=$GAME
            ORDER BY datetime(closing_at),market_type;
          "
          echo '=== LATEST LIVE FEED META ==='
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT meta_key,meta_value,updated_at FROM data_core_meta
            WHERE meta_key='winline_live_feed_sync_state';
          "

      - name: Incident production API probes
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          const base='https://hoh-nhl-daily-results.znamteam-903.workers.dev';
          for(const p of ['/api/winline/live/status','/api/broadcast/games/2026010021','/api/broadcast/live/2026010021']){
            try{
              const r=await fetch(base+p,{headers:{accept:'application/json'},cache:'no-store'});
              const text=await r.text();
              console.log('PROBE',p,'HTTP',r.status,text.slice(0,30000));
            }catch(e){console.log('PROBE_ERROR',p,String(e?.stack||e));}
          }
          JS
