name: Audit Winline Market Coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-winline-market-coverage.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '9032ec1bd3cb868d89a38453e4bd1a69' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Current Winline inventory
        run: |
          set -euo pipefail
          echo '=== ACTIVE INVENTORY ==='
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT
              COUNT(*) active_selections,
              COUNT(DISTINCT m.winline_event_id) events,
              COUNT(DISTINCT m.market_type) market_type_keys
            FROM winline_markets m
            WHERE m.active=1 AND m.odds IS NOT NULL;
          "
          echo '=== EVENT MATCHING ==='
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT
              COUNT(*) events_total,
              SUM(CASE WHEN game_pk IS NOT NULL THEN 1 ELSE 0 END) matched_games,
              SUM(CASE WHEN game_pk IS NULL THEN 1 ELSE 0 END) unmatched_events,
              MIN(starts_at) first_start,
              MAX(starts_at) last_start,
              MAX(updated_at) latest_event_update
            FROM winline_events;
          "
          echo '=== ACTIVE EVENTS ==='
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT e.winline_event_id,e.game_pk,e.starts_at,e.status,
                   COUNT(CASE WHEN m.active=1 AND m.odds IS NOT NULL THEN 1 END) active_selections,
                   MAX(m.updated_at) latest_market_update
            FROM winline_events e
            LEFT JOIN winline_markets m ON m.winline_event_id=e.winline_event_id
            GROUP BY e.winline_event_id,e.game_pk,e.starts_at,e.status
            HAVING active_selections>0
            ORDER BY datetime(e.starts_at) ASC
            LIMIT 60;
          "
          echo '=== MARKET TYPES ==='
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT m.market_type,COUNT(*) selections,COUNT(DISTINCT m.winline_event_id) events
            FROM winline_markets m
            WHERE m.active=1 AND m.odds IS NOT NULL
            GROUP BY m.market_type
            ORDER BY selections DESC,market_type ASC
            LIMIT 120;
          "
          echo '=== FREETEXT FAMILIES ==='
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT
              COALESCE(json_extract(m.raw_json,'$.freetext'),'') freetext,
              COUNT(*) selections,
              COUNT(DISTINCT m.winline_event_id) events
            FROM winline_markets m
            WHERE m.active=1 AND m.odds IS NOT NULL
            GROUP BY freetext
            ORDER BY selections DESC,freetext ASC
            LIMIT 120;
          "
          echo '=== SAMPLE FUTURE EVENT 2026020001 ==='
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT m.winline_market_id,m.market_type,m.subject_key,m.outcome_name,m.odds,
                   json_extract(m.raw_json,'$.freetext') freetext,
                   json_extract(m.raw_json,'$.value') line_value
            FROM winline_markets m
            JOIN winline_events e ON e.winline_event_id=m.winline_event_id
            WHERE e.game_pk=2026020001 AND m.active=1 AND m.odds IS NOT NULL
            ORDER BY m.market_type,m.winline_market_id;
          "
          echo '=== LIVE FREETEXT FAMILIES ==='
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT
              COALESCE(json_extract(m.raw_json,'$.freetext'),'') freetext,
              COUNT(*) selections
            FROM winline_markets m
            WHERE m.active=1 AND m.odds IS NOT NULL AND m.is_live=1
            GROUP BY freetext
            ORDER BY selections DESC,freetext ASC
            LIMIT 80;
          "
