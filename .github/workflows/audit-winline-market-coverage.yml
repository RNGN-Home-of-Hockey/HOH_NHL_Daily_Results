name: Audit Winline Market Coverage

on:
  workflow_dispatch:
    inputs:
      game_pk:
        description: Optional NHL gamePk for a focused Winline audit
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-winline-market-coverage.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '9032ec1bd3cb868d89a38453e4bd1a69' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Current Winline inventory
        run: |
          set -euo pipefail
          echo '=== ACTIVE INVENTORY ==='
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT COUNT(*) active_selections,
                   COUNT(DISTINCT m.winline_event_id) events,
                   COUNT(DISTINCT m.market_type) market_type_keys
            FROM winline_markets m
            WHERE m.active=1 AND m.odds IS NOT NULL;
          "
          echo '=== EVENT MATCHING ==='
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT COUNT(*) events_total,
                   SUM(CASE WHEN game_pk IS NOT NULL THEN 1 ELSE 0 END) matched_games,
                   SUM(CASE WHEN game_pk IS NULL THEN 1 ELSE 0 END) unmatched_events,
                   MAX(updated_at) latest_event_update
            FROM winline_events;
          "
          echo '=== LIVE INVENTORY ==='
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT COUNT(*) active_live_selections,
                   COUNT(DISTINCT e.game_pk) games,
                   MIN(m.updated_at) oldest_update,
                   MAX(m.updated_at) newest_update
            FROM winline_markets m
            JOIN winline_events e ON e.winline_event_id=m.winline_event_id
            WHERE m.active=1 AND m.odds IS NOT NULL AND m.is_live=1;
          "
          echo '=== LATEST LIVE FEED STATE ==='
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT meta_value,updated_at FROM data_core_meta
            WHERE meta_key='winline_live_feed_sync_state';
          "

      - name: Focused game audit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.game_pk != '' }}
        env:
          GAME_PK: ${{ inputs.game_pk }}
        run: |
          set -euo pipefail
          [[ "$GAME_PK" =~ ^[0-9]+$ ]] || { echo 'game_pk must be numeric'; exit 1; }
          echo '=== GAME ==='
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT game_pk,scheduled_start_utc,game_state,away_tri,home_tri,away_score,home_score,last_synced_at
            FROM games WHERE game_pk=$GAME_PK;
          "
          echo '=== WINLINE EVENTS AND MARKETS ==='
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT e.winline_event_id,e.status,e.starts_at,e.updated_at,
                   SUM(CASE WHEN m.is_live=0 AND m.active=1 THEN 1 ELSE 0 END) active_pregame,
                   SUM(CASE WHEN m.is_live=1 AND m.active=1 THEN 1 ELSE 0 END) active_live,
                   MIN(CASE WHEN m.is_live=1 THEN m.updated_at END) first_live_update,
                   MAX(CASE WHEN m.is_live=1 THEN m.updated_at END) last_live_update
            FROM winline_events e
            LEFT JOIN winline_markets m ON m.winline_event_id=e.winline_event_id
            WHERE e.game_pk=$GAME_PK
            GROUP BY e.winline_event_id,e.status,e.starts_at,e.updated_at
            ORDER BY e.updated_at;
          "
          echo '=== SNAPSHOT RANGE ==='
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT is_live,COUNT(*) snapshots,COUNT(DISTINCT winline_market_id) markets,
                   MIN(captured_at) first_at,MAX(captured_at) last_at
            FROM winline_market_snapshots WHERE game_pk=$GAME_PK
            GROUP BY is_live ORDER BY is_live;
          "

      - name: Production live health
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          const url='https://hoh-nhl-daily-results.znamteam-903.workers.dev/api/winline/live/status';
          const r=await fetch(url,{headers:{accept:'application/json'},cache:'no-store'});
          const body=await r.text();
          console.log('HTTP',r.status,body);
          if(!r.ok)process.exit(1);
          JS
