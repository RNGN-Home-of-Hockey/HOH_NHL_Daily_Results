name: Temporary apply validated league rank fix
on:
  push:
    paths:
      - '.github/workflows/_tmp-current-team-snapshot-test.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch rank numbering and smoke test
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/build_compact_snapshots.py')
          s=p.read_text()
          old='return {team: i + 1 for i, (team, _) in enumerate(vals, 1)}'
          new='return {team: i for i, (team, _) in enumerate(vals, 1)}'
          if old in s:
              p.write_text(s.replace(old,new,1))
          elif new not in s:
              raise SystemExit('rank function anchor missing')
          PY
          python -m py_compile tools/build_compact_snapshots.py tools/build_current_team_snapshots.py
          python - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          import build_compact_snapshots as m
          x={'AAA':{'v':3},'BBB':{'v':2},'CCC':{'v':1}}
          assert m.ranks(x,'v')=={'AAA':1,'BBB':2,'CCC':3}
          assert m.ranks(x,'v',True)=={'CCC':1,'BBB':2,'AAA':3}
          print('RANKS_OK')
          PY
      - name: Commit rank fix
        run: |
          git config user.name 'znamteam-max'
          git config user.email 'znamteam@gmail.com'
          git add tools/build_compact_snapshots.py
          if git diff --cached --quiet; then
            echo 'Rank fix already present.'
          else
            git commit -m 'Fix league rank numbering in compact snapshots'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
