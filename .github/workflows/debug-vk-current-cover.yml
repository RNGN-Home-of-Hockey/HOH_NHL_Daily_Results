name: Debug VK Current Covers

on:
  push:
    branches:
      - debug/vk-current-cover-20260930
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - name: Inspect Sep 30 PIT PHI VK rows
        run: |
          npx wrangler d1 execute hoh-data-core --remote --command "
          SELECT game_pk,scheduled_start_utc,home_tri,away_tri,game_state
          FROM games
          WHERE ((home_tri='PIT' AND away_tri='PHI') OR (home_tri='PHI' AND away_tri='PIT'))
            AND scheduled_start_utc BETWEEN '2026-09-29T00:00:00Z' AND '2026-10-02T23:59:59Z';

          SELECT m.game_pk,m.source_key,m.match_method,m.match_confidence,
                 b.title,b.scheduled_at,b.published_at,b.status,b.thumbnail_url,b.duration_seconds,
                 b.parsed_home_tri,b.parsed_away_tri,b.web_url,b.raw_json
          FROM game_vk_broadcasts m
          JOIN vk_broadcasts b ON b.source_key=m.source_key
          WHERE m.game_pk IN (
            SELECT game_pk FROM games
            WHERE ((home_tri='PIT' AND away_tri='PHI') OR (home_tri='PHI' AND away_tri='PIT'))
              AND scheduled_start_utc BETWEEN '2026-09-29T00:00:00Z' AND '2026-10-02T23:59:59Z'
          );

          SELECT source_key,title,scheduled_at,published_at,status,thumbnail_url,duration_seconds,
                 parsed_home_tri,parsed_away_tri,web_url,raw_json
          FROM vk_broadcasts
          WHERE (
            (parsed_home_tri IN ('PIT','PHI') AND parsed_away_tri IN ('PIT','PHI'))
            OR title LIKE '%Филадельф%'
            OR title LIKE '%Питтсбург%'
            OR title LIKE '%Philadelphia%'
            OR title LIKE '%Pittsburgh%'
          )
            AND COALESCE(scheduled_at,published_at) BETWEEN '2026-09-29T00:00:00Z' AND '2026-10-03T23:59:59Z'
          ORDER BY COALESCE(scheduled_at,published_at) ASC, updated_at DESC;
          "
