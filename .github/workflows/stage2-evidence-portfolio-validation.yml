name: Stage2 Evidence Portfolio Validation

on:
  push:
    paths:
      - '.github/workflows/stage2-evidence-portfolio-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Portfolio quality tests
        run: |
          node --check cloudflare-worker/src/insight-portfolio.js
          node --input-type=module <<'NODE'
          import { selectInsightPortfolio, exactMarketKey } from './cloudflare-worker/src/insight-portfolio.js';
          const mk=(id,category,score,market,evidence={window:20})=>({id,category,score,market,evidence,timing:'pregame',kind:'history',title:id,explanation:id});
          const market={type:'team_total',subject:'CAR',side:'over',line:2.5,label:'CAR ИТБ 2.5'};

          if(exactMarketKey(market)!=='team_total:GAME:CAR:over:2.5') throw new Error(`period-aware key wrong: ${exactMarketKey(market)}`);

          const direct=mk('direct','market_evaluator',88,market);
          const rank=mk('rank','league_rank',95,market);
          const one=selectInsightPortfolio([rank,direct],12);
          if(one.length!==1) throw new Error('exact market did not consolidate');
          if(one[0].category!=='market_evaluator') throw new Error(`context incorrectly became primary: ${one[0].category}`);
          if(one[0].score!==88) throw new Error(`source score mutated: ${one[0].score}`);
          if(one[0].evidence_quality?.tier!=='B') throw new Error(`expected B tier: ${JSON.stringify(one[0].evidence_quality)}`);
          if(one[0].evidence?.independent_support_count!==1) throw new Error('support count wrong');

          const venue=mk('venue','venue_split',84,market,{window:20});
          const h2h=mk('h2h','h2h_market',82,market,{window:10});
          const two=selectInsightPortfolio([direct,rank,venue,h2h],12);
          if(two[0].evidence_quality?.tier!=='A') throw new Error(`expected A tier: ${JSON.stringify(two[0].evidence_quality)}`);
          if(two[0].evidence?.independent_support_count!==3) throw new Error(`expected 3 supports: ${two[0].evidence?.independent_support_count}`);
          if(two[0].portfolio_score<=two[0].score) throw new Error('portfolio score did not reflect evidence strength');

          const contextOnly=selectInsightPortfolio([
            mk('rank-only','league_rank',93,{type:'handicap',subject:'CAR',side:'CAR',line:-1.5,label:'CAR -1.5'}),
          ],12);
          if(contextOnly.length!==1||contextOnly[0].evidence_quality?.tier!=='C') throw new Error('context-only tier wrong');
          if(contextOnly[0].portfolio_score>=contextOnly[0].score) throw new Error('context-only penalty missing');

          const broad=selectInsightPortfolio([
            mk('broad','market_evaluator',90,{type:'team_total',subject:'CAR',side:'over',line:1.5,label:'CAR ИТБ 1.5'}),
          ],12)[0];
          const central=selectInsightPortfolio([
            mk('central','market_evaluator',90,{type:'team_total',subject:'CAR',side:'over',line:2.5,label:'CAR ИТБ 2.5'}),
          ],12)[0];
          if(broad.evidence_quality?.market_utility_penalty!==-5) throw new Error('broad line penalty missing');
          if(!(central.portfolio_score>broad.portfolio_score)) throw new Error('central line should outrank equally strong broad line');

          const live={id:'live',category:'live',score:70,timing:'live',kind:'live',market:{type:'next_goal_team',subject:'CAR',side:'CAR',label:'Следующий гол CAR'},evidence:{}};
          const mixed=selectInsightPortfolio([live,...two],12);
          if(mixed[0].id!=='live'||mixed[0].evidence_quality?.tier!=='LIVE') throw new Error('live priority lost');
          console.log('EVIDENCE_PORTFOLIO_OK',JSON.stringify({B:one[0],A:two[0],context:contextOnly[0],broad:broad.evidence_quality},null,2));
          NODE
      - name: Full Worker dry run
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir .stage2-evidence-build
          test -d .stage2-evidence-build
          echo STAGE2_EVIDENCE_WORKER_OK
