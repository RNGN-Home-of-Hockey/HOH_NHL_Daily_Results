name: Temporary web and Telegram MVP validation
on:
  push:
    paths:
      - '.github/workflows/_tmp-web-telegram-mvp-validate.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: JS syntax
        run: |
          node --check cloudflare-worker/src/telegram-mini-app.js
          node --check cloudflare-worker/src/control-center.js
          node --check cloudflare-worker/src/telegram-product-bot.js
          node --check cloudflare-worker/src/worker-entry.js
      - name: Migration chain
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db=sqlite3.connect(':memory:')
          for path in sorted(Path('migrations').glob('*.sql')):
              db.executescript(path.read_text())
              print('MIGRATION_OK',path.name)
          expected={'pregame_team_snapshots','player_rolling_snapshots','player_opponent_splits','goalie_rolling_snapshots','goalie_opponent_splits','subscriptions','telegram_users'}
          got={r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert expected <= got, expected-got
          print('MIGRATION_CHAIN_OK')
          PY
      - name: Route contracts
        run: |
          node --input-type=module <<'JS'
          import { handleTelegramMiniAppRequest } from './cloudflare-worker/src/telegram-mini-app.js';
          import { handleControlCenterRequest } from './cloudflare-worker/src/control-center.js';
          import { handleTelegramProductBotRequest } from './cloudflare-worker/src/telegram-product-bot.js';
          let r=await handleTelegramMiniAppRequest(new Request('https://x/telegram-app'),{},'/telegram-app');
          if(!r || r.status!==200 || !(await r.text()).includes('NHL LIVE')) throw new Error('mini app shell failed');
          r=await handleControlCenterRequest(new Request('https://x/control'),{},'/control');
          if(!r || r.status!==200 || !(await r.text()).includes('HOH NHL Data Platform')) throw new Error('control shell failed');
          const secret='test-secret';
          const req=new Request('https://x/api/telegram',{method:'POST',headers:{'x-telegram-bot-api-secret-token':secret,'content-type':'application/json'},body:JSON.stringify({message:{chat:{id:-100,type:'supergroup'},text:'/start'}})});
          const delegated=await handleTelegramProductBotRequest(req,{TELEGRAM_WEBHOOK_VERIFY_SECRET:secret},'/api/telegram');
          if(delegated!==null) throw new Error('group Telegram update was intercepted');
          console.log('ROUTE_CONTRACTS_OK');
          JS
      - name: Worker dry run
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir .web-telegram-build
