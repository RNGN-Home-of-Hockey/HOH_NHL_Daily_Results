name: Stage2 Support Diagnostic

on:
  push:
    paths:
      - '.github/workflows/stage2-support-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect supporting signal categories
        env:
          BASE_URL: https://hoh-nhl-daily-results.znamteam-903.workers.dev
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from collections import Counter, defaultdict
          base=os.environ['BASE_URL'].rstrip('/')
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'HOH-Stage2-Support-Diagnostic/1.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=45) as r:
                  return json.loads(r.read().decode('utf-8'))
          listing=get('/api/broadcast/games')
          games=(listing.get('games') or [])[:24]
          primary=Counter(); support=Counter(); pairs=Counter(); samples=[]
          for g in games:
              d=get('/api/broadcast/games/'+str(g['game_pk']))
              for c in d.get('cards') or []:
                  cat=c.get('category') or c.get('insight_type') or 'unknown'
                  primary[cat]+=1
                  sigs=(c.get('evidence') or {}).get('supporting_signals') or []
                  for s in sigs:
                      scat=s.get('category') or s.get('insight_type') or 'unknown'
                      support[scat]+=1
                      pairs[(cat,scat)]+=1
                      if scat in {'advanced_context','h2h_split'} and len(samples)<20:
                          samples.append({
                            'game_pk':g.get('game_pk'),
                            'match':f"{g.get('away_tri')}-{g.get('home_tri')}",
                            'market':(c.get('market') or {}).get('label'),
                            'primary':cat,
                            'support':scat,
                            'support_title':s.get('title'),
                            'score':c.get('score')
                          })
          print('PRIMARY',json.dumps(primary,ensure_ascii=False,indent=2))
          print('SUPPORT',json.dumps(support,ensure_ascii=False,indent=2))
          print('PAIRS',json.dumps({f'{a}<-{b}':n for (a,b),n in pairs.items()},ensure_ascii=False,indent=2))
          print('ADV_H2H_SAMPLES',json.dumps(samples,ensure_ascii=False,indent=2))
          print('STAGE2_SUPPORT_DIAGNOSTIC_OK')
          PY
