name: Stage2 Production Smoke

on:
  push:
    paths:
      - '.github/workflows/stage2-production-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Validate production Data Core and Stage 2 cards
        env:
          BASE_URL: https://hoh-nhl-daily-results.znamteam-903.workers.dev
        run: |
          python - <<'PY'
          import json, os, urllib.request
          base=os.environ['BASE_URL'].rstrip('/')
          def get(path):
              req=urllib.request.Request(base+path, headers={'User-Agent':'HOH-Stage2-Production-Smoke/1.0','Accept':'application/json'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  body=r.read().decode('utf-8')
                  if r.status != 200:
                      raise SystemExit(f'HTTP {r.status} {path}: {body[:500]}')
                  return json.loads(body)
          games=get('/api/broadcast/games')
          print('COUNTS', json.dumps(games.get('counts'), ensure_ascii=False))
          if not games.get('ok'):
              raise SystemExit('broadcast games returned ok=false')
          if int((games.get('counts') or {}).get('games') or 0) < 2700:
              raise SystemExit(f"remote game count unexpectedly low: {games.get('counts')}")
          rows=games.get('games') or []
          if not rows:
              raise SystemExit('no broadcast games returned')

          # Try up to the 12 latest games so one sparse/control record does not distort the smoke.
          reports=[]
          best=None
          for g in rows[:12]:
              detail=get('/api/broadcast/games/'+str(g['game_pk']))
              cards=detail.get('cards') or []
              cats={}
              for c in cards:
                  cat=c.get('category') or c.get('insight_type') or 'unknown'
                  cats[cat]=cats.get(cat,0)+1
              report={
                  'game_pk':g['game_pk'],
                  'match':f"{g.get('away_tri')}-{g.get('home_tri')}",
                  'cards':len(cards),
                  'categories':cats,
                  'markets':[{
                      'label':(c.get('market') or {}).get('label'),
                      'category':c.get('category'),
                      'score':c.get('score'),
                      'support':(c.get('evidence') or {}).get('independent_support_count',0),
                      'demo':(c.get('market') or {}).get('odds_is_demo')
                  } for c in cards[:12]],
              }
              reports.append(report)
              if cards and (best is None or len(cats)>len(best['categories'])):
                  best=report
          print('LATEST_REPORTS', json.dumps(reports, ensure_ascii=False, indent=2))
          if best is None:
              raise SystemExit('no Stage 2/history cards on latest 12 games')
          print('BEST_REPORT', json.dumps(best, ensure_ascii=False, indent=2))
          # Require at least one new Stage 2 family on real production data.
          new_families={'market_evaluator','league_rank','advanced_context','venue_split','h2h_split'}
          found=set(best['categories']).intersection(new_families)
          if not found:
              # Search all reports before failing.
              found=set()
              for r in reports:
                  found.update(set(r['categories']).intersection(new_families))
          if not found:
              raise SystemExit('production cards contain no new Stage 2 categories')
          print('STAGE2_PRODUCTION_OK families=', sorted(found))
          PY
