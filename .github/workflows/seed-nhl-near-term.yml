name: Seed NHL Near-Term Schedule

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seed-nhl-near-term.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '9032ec1bd3cb868d89a38453e4bd1a69' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build official near-term NHL schedule SQL
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const q=v=>v===null||v===undefined?'NULL':"'"+String(v).replaceAll("'","''")+"'";
          const num=v=>Number.isFinite(Number(v))?String(Number(v)):'NULL';
          const today=new Date();
          const games=new Map();
          for(let offset=0;offset<=14;offset++){
            const day=new Date(today.getTime()+offset*86400000).toISOString().slice(0,10);
            const r=await fetch('https://api-web.nhle.com/v1/schedule/'+day,{headers:{accept:'application/json','user-agent':'HOH-near-term-seed'}});
            if(!r.ok){console.log('SCHEDULE_HTTP',day,r.status);continue}
            const d=await r.json();
            for(const w of d.gameWeek||[])for(const g of w.games||[])if(g?.id)games.set(Number(g.id),g);
          }
          const sql=['PRAGMA foreign_keys = ON;'];
          let preseason=0,regular=0,playoffs=0;
          for(const g of games.values()){
            const gt=Number(g.gameType);
            if(![1,2,3].includes(gt))continue;
            if(gt===1)preseason++; else if(gt===2)regular++; else playoffs++;
            const pk=Number(g.id),home=g.homeTeam?.abbrev,away=g.awayTeam?.abbrev;
            if(!pk||!home||!away||!g.startTimeUTC)continue;
            sql.push(`INSERT INTO games(game_pk,season_id,game_type,scheduled_start_utc,game_state,home_tri,away_tri,home_score,away_score,current_period,period_type,venue_name,last_synced_at)
              VALUES(${pk},${q(String(g.season||''))},${gt},${q(g.startTimeUTC)},${q(String(g.gameState||'FUT').toUpperCase())},${q(home)},${q(away)},${Number.isFinite(Number(g.homeTeam?.score))?Number(g.homeTeam.score):0},${Number.isFinite(Number(g.awayTeam?.score))?Number(g.awayTeam.score):0},${num(g.periodDescriptor?.number)},${q(g.periodDescriptor?.periodType||g.gameOutcome?.lastPeriodType||null)},${q(g.venue?.default||g.venue?.en||null)},CURRENT_TIMESTAMP)
              ON CONFLICT(game_pk) DO UPDATE SET season_id=excluded.season_id,game_type=excluded.game_type,scheduled_start_utc=excluded.scheduled_start_utc,game_state=excluded.game_state,home_tri=excluded.home_tri,away_tri=excluded.away_tri,home_score=COALESCE(excluded.home_score,games.home_score),away_score=COALESCE(excluded.away_score,games.away_score),current_period=COALESCE(excluded.current_period,games.current_period),period_type=COALESCE(excluded.period_type,games.period_type),venue_name=COALESCE(excluded.venue_name,games.venue_name),last_synced_at=CURRENT_TIMESTAMP;`);
          }
          fs.writeFileSync('/tmp/nhl-near-term.sql',sql.join('\n'));
          console.log('NEAR_TERM_BUILD',JSON.stringify({games:games.size,preseason,regular,playoffs,sql_bytes:fs.statSync('/tmp/nhl-near-term.sql').size}));
          JS
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Seed remote D1
        run: npx wrangler d1 execute hoh-data-core --remote --file=/tmp/nhl-near-term.sql
      - name: Verify upcoming preseason
        run: |
          npx wrangler d1 execute hoh-data-core --remote --command "SELECT game_pk,game_type,scheduled_start_utc,away_tri,home_tri,game_state FROM games WHERE game_type=1 AND datetime(scheduled_start_utc)>=datetime('now') ORDER BY datetime(scheduled_start_utc) ASC LIMIT 25;"

# retry with non-null future scores 2026-09-19

      - name: Verify broadcast API order
        run: |
          node --input-type=module <<'JS'
          const url='https://hoh-nhl-daily-results.znamteam-903.workers.dev/api/broadcast/games';
          const r=await fetch(url,{headers:{accept:'application/json'}});
          if(!r.ok)throw new Error('Broadcast API HTTP '+r.status);
          const d=await r.json();
          console.log('BROADCAST_FIRST_GAMES',JSON.stringify((d.games||[]).slice(0,20).map(g=>({
            game_pk:g.game_pk,game_type:g.game_type,start:g.scheduled_start_utc,away:g.away_tri,home:g.home_tri,state:g.game_state
          }))));
          const first=(d.games||[])[0];
          if(!first)throw new Error('No upcoming games');
          if(Number(first.game_type)!==1)throw new Error('First upcoming game is not preseason: '+JSON.stringify(first));
          JS
# verify broadcast preseason visibility 2026-09-19
