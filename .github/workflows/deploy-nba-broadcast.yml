name: Deploy NBA Broadcast Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-nba-broadcast.yml'
      - 'wrangler.nba.jsonc'
      - 'nba-worker/**'

permissions:
  contents: read

concurrency:
  group: nba-broadcast-worker-deploy
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '9032ec1bd3cb868d89a38453e4bd1a69' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 2; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 2; }
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Deploy standalone NBA Worker
        run: npx wrangler deploy --config wrangler.nba.jsonc
      - name: Smoke test NBA server
        shell: bash
        run: |
          set -euo pipefail
          base='https://rngn-nba-broadcast.znamteam-903.workers.dev'
          for attempt in 1 2 3 4 5; do
            if curl -fsS "$base/api/health" -o /tmp/health.json; then break; fi
            sleep $((attempt * 3))
          done
          cat /tmp/health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get('ok') is True, d
          assert int(d.get('games') or 0) > 6000, d
          assert int(d.get('player_rows') or 0) > 120000, d
          PY
          curl -fsS "$base/api/cards?season=2025-26&window=10" -o /tmp/cards.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/cards.json'))
          assert d.get('ok') is True, d
          cards=d.get('cards') or []
          assert len(cards) >= 6, d
          print('cards:', len(cards))
          for c in cards[:6]:
            print(c['player_name'], c['market'], f"{c['hits']}/{c['sample']}")
          PY
