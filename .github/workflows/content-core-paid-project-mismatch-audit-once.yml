name: Content Core Paid Project Mismatch Audit Once
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/content-core-paid-project-mismatch-audit-once.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.RNGN_CF_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: f7f0376bf1c44c4e3cef4a24adf1b66a
      DB_ID: abb8a6f2-e9e0-4f6d-b5f5-cbf808a0c2eb
    steps:
      - uses: actions/checkout@v6
      - name: Audit cross-project publication canonicals
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$DB_ID/query"
          query() {
            local sql="$1" out="$2"
            curl --fail --silent --show-error "$API"               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H "Content-Type: application/json"               -d "$(jq -nc --arg sql "$sql" '{sql:$sql}')" > "$out"
            jq -e '.success == true' "$out" >/dev/null
          }
          query "SELECT a.project_id AS account_project,v.project_id AS video_project,COUNT(*) AS publications,COUNT(DISTINCT v.id) AS videos FROM publications p JOIN social_accounts a ON a.id=p.account_id JOIN videos v ON v.id=p.video_id WHERE a.project_id<>v.project_id GROUP BY a.project_id,v.project_id ORDER BY publications DESC;" /tmp/groups.json
          jq -c '.result[0].results[]' /tmp/groups.json | while read -r row; do echo "PROJECT_MISMATCH|$row"; done
          query "SELECT COUNT(*) AS mismatched_publications,COUNT(DISTINCT p.video_id) AS affected_videos FROM publications p JOIN social_accounts a ON a.id=p.account_id JOIN videos v ON v.id=p.video_id WHERE a.project_id<>v.project_id;" /tmp/totals.json
          echo "PROJECT_MISMATCH_TOTAL|$(jq -c '.result[0].results[0]' /tmp/totals.json)"
          query "SELECT v.id,v.project_id,COUNT(DISTINCT a.project_id) AS account_projects,GROUP_CONCAT(DISTINCT a.project_id) AS projects,COUNT(*) AS publications FROM videos v JOIN publications p ON p.video_id=v.id JOIN social_accounts a ON a.id=p.account_id GROUP BY v.id,v.project_id HAVING COUNT(DISTINCT a.project_id)>1 ORDER BY publications DESC LIMIT 50;" /tmp/mixed.json
          jq -c '.result[0].results[]' /tmp/mixed.json | while read -r row; do echo "MIXED_CANONICAL|$row"; done
          query "SELECT COUNT(DISTINCT va.id) AS assets,COUNT(DISTINCT va.video_id) AS videos_with_assets FROM video_assets va WHERE va.video_id IN (SELECT DISTINCT v.id FROM videos v JOIN publications p ON p.video_id=v.id JOIN social_accounts a ON a.id=p.account_id WHERE a.project_id<>v.project_id);" /tmp/assets.json
          echo "PROJECT_MISMATCH_ASSETS|$(jq -c '.result[0].results[0]' /tmp/assets.json)"

