name: Audit User Request Status

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-user-request-status.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '9032ec1bd3cb868d89a38453e4bd1a69' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Audit active player salary and number gaps
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const base='https://hoh-nhl-daily-results.znamteam-903.workers.dev';
          const teams=['ANA','BOS','BUF','CGY','CAR','CHI','COL','CBJ','DAL','DET','EDM','FLA','LAK','MIN','MTL','NSH','NJD','NYI','NYR','OTT','PHI','PIT','SJS','SEA','STL','TBL','TOR','UTA','VAN','VGK','WSH','WPG'];
          const byId=new Map();
          for(const tri of teams){
            const r=await fetch(base+'/api/telegram-center-v17/players?team='+tri+'&limit=350',{cache:'no-store'});
            const d=await r.json();if(!r.ok)throw new Error(tri+' '+r.status+' '+JSON.stringify(d).slice(0,200));
            for(const p of d.players||[])byId.set(String(p.player_id),p);
          }
          const rows=[...byId.values()];
          const noSalary=rows.filter(p=>!Number(p.salary_aav));
          const noNumber=rows.filter(p=>p.sweater_number===null||p.sweater_number===undefined||p.sweater_number==='');
          console.log('PLAYER_COVERAGE',JSON.stringify({
            players:rows.length,
            salary:rows.length-noSalary.length,
            missing_salary:noSalary.length,
            number:rows.length-noNumber.length,
            missing_number:noNumber.length
          }));
          console.log('MISSING_SALARY',JSON.stringify(noSalary.map(p=>({id:p.player_id,name:p.full_name_en,team:p.current_team_tri,pos:p.position_code,number:p.sweater_number})).slice(0,120)));
          console.log('MISSING_NUMBER',JSON.stringify(noNumber.map(p=>({id:p.player_id,name:p.full_name_en,team:p.current_team_tri,pos:p.position_code,salary:p.salary_aav})).slice(0,120)));
          JS

      - name: Audit D1 status
        run: |
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT
              COUNT(*) active_players,
              SUM(CASE WHEN m.primary_country_code IS NOT NULL AND TRIM(m.primary_country_code)<>'' THEN 1 ELSE 0 END) country,
              SUM(CASE WHEN m.birth_date IS NOT NULL AND TRIM(m.birth_date)<>'' THEN 1 ELSE 0 END) birth_date,
              SUM(CASE WHEN p.current_team_tri IS NOT NULL AND TRIM(p.current_team_tri)<>'' THEN 1 ELSE 0 END) team,
              SUM(CASE WHEN p.position_code IS NOT NULL AND TRIM(p.position_code)<>'' THEN 1 ELSE 0 END) position,
              SUM(CASE WHEN p.sweater_number IS NOT NULL THEN 1 ELSE 0 END) number,
              SUM(CASE WHEN m.height_cm IS NOT NULL THEN 1 ELSE 0 END) height,
              SUM(CASE WHEN m.weight_kg IS NOT NULL THEN 1 ELSE 0 END) weight,
              SUM(CASE WHEN m.height_cm IS NOT NULL AND m.weight_kg IS NOT NULL THEN 1 ELSE 0 END) physical_complete
            FROM players p LEFT JOIN player_profile_meta m ON m.player_id=p.player_id
            WHERE COALESCE(p.active,1)=1;

            SELECT
              COUNT(DISTINCT e.player_id) exact_players_with_news,
              COUNT(*) exact_links
            FROM sports_player_news_exact e;

            SELECT
              COUNT(*) player_sources,
              SUM(CASE WHEN backfill_done=1 THEN 1 ELSE 0 END) source_backfill_done,
              SUM(CASE WHEN last_error IS NOT NULL AND TRIM(last_error)<>'' THEN 1 ELSE 0 END) source_errors
            FROM sports_player_sources;

            SELECT
              CASE
                WHEN last_error LIKE '%404%' THEN '404'
                WHEN last_error LIKE '%403%' THEN '403'
                WHEN last_error LIKE '%429%' THEN '429'
                WHEN last_error IS NULL OR TRIM(last_error)='' THEN 'none'
                ELSE substr(last_error,1,80)
              END error_group,
              COUNT(*) count
            FROM sports_player_sources
            GROUP BY error_group
            ORDER BY count DESC
            LIMIT 12;

            SELECT s.player_id,p.full_name_en,p.full_name_ru,s.sports_slug,s.source_url,s.last_error
            FROM sports_player_sources s JOIN players p ON p.player_id=s.player_id
            WHERE s.last_error IS NOT NULL AND TRIM(s.last_error)<>''
            ORDER BY s.player_id ASC LIMIT 20;

            SELECT
              COUNT(*) mapped_games,
              SUM(CASE WHEN v.duration_seconds<3600 THEN 1 ELSE 0 END) short_mapped,
              SUM(CASE WHEN LOWER(v.title) LIKE '%хайлайт%' OR LOWER(v.title) LIKE '%highlight%' OR LOWER(v.title) LIKE '%обзор матча%' OR LOWER(v.title) LIKE '%лучшие моменты%' THEN 1 ELSE 0 END) title_highlight_mapped
            FROM game_vk_broadcasts m JOIN vk_broadcasts v ON v.source_key=m.source_key;

            SELECT meta_key,meta_value,updated_at
            FROM data_core_meta
            WHERE meta_key IN ('hoh_vk_video_backfill_algo','hoh_vk_video_backfill_offset','hoh_vk_video_backfill_done','sports_ru_exact_recent_cursor')
            ORDER BY meta_key;

            SELECT g.season_id,
                   COUNT(*) games,
                   COUNT(DISTINCT CASE WHEN o.game_pk IS NOT NULL THEN g.game_pk END) historical_odds_games,
                   COUNT(DISTINCT CASE WHEN b.game_pk IS NOT NULL THEN g.game_pk END) vk_games,
                   COUNT(DISTINCT CASE WHEN b.game_pk IS NOT NULL AND o.game_pk IS NULL THEN g.game_pk END) vk_without_historical_odds
            FROM games g
            LEFT JOIN historical_odds_closing o
              ON o.game_pk=g.game_pk AND o.market_key='regular_time_1x2' AND o.source='user_excel_consensus_2seasons'
            LEFT JOIN game_vk_broadcasts b ON b.game_pk=g.game_pk
            WHERE g.game_type IN (2,3)
            GROUP BY g.season_id
            ORDER BY g.season_id;

            SELECT source,market_key,COUNT(DISTINCT game_pk) games,COUNT(*) rows
            FROM historical_odds_closing
            GROUP BY source,market_key
            ORDER BY games DESC;

            SELECT COUNT(*) future_winline_events,
                   SUM(CASE WHEN we.deeplink IS NOT NULL AND TRIM(we.deeplink)<>'' THEN 1 ELSE 0 END) with_deeplink
            FROM winline_events we
            JOIN games g ON g.game_pk=we.game_pk
            WHERE UPPER(COALESCE(g.game_state,'')) NOT IN ('FINAL','OFF');

            SELECT COUNT(*) user_profiles,
                   SUM(CASE WHEN no_spoilers=1 THEN 1 ELSE 0 END) no_spoilers_enabled,
                   SUM(CASE WHEN display_username IS NOT NULL AND TRIM(display_username)<>'' THEN 1 ELSE 0 END) with_nickname,
                   SUM(CASE WHEN avatar_base64 IS NOT NULL AND avatar_base64<>'' THEN 1 ELSE 0 END) with_avatar
            FROM app_user_profiles;
          "
