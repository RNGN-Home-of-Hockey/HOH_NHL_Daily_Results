name: Temporary Low Read Stage2

on:
  push:
    paths:
      - 'tools/_tmp_patch_low_read_stage2.py'
      - '.github/workflows/_tmp-low-read-stage2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch and validate
        run: |
          python tools/_tmp_patch_low_read_stage2.py
          node --check cloudflare-worker/src/betting-insight-engine.js
          node --check cloudflare-worker/src/broadcast-dashboard-v2.js
          git diff --check
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir .low-read-build
      - name: Commit patch
        run: |
          git config user.name 'znamteam-max'
          git config user.email 'znamteam@gmail.com'
          git add cloudflare-worker/src/betting-insight-engine.js cloudflare-worker/src/broadcast-dashboard-v2.js
          git commit -m 'Use low-read Stage 2 profile on D1 Free'
          git push origin HEAD:main
