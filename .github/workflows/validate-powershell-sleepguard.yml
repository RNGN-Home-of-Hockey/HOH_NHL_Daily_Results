name: Validate PowerShell Sleep Guard

on:
  push:
    paths:
      - '.github/workflows/validate-powershell-sleepguard.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows PowerShell 5.1 UInt32 conversion
        shell: powershell
        run: |
          $ES_CONTINUOUS = [Convert]::ToUInt32('80000000', 16)
          $ES_SYSTEM_REQUIRED = [Convert]::ToUInt32('00000001', 16)
          $combined = $ES_CONTINUOUS -bor $ES_SYSTEM_REQUIRED
          if ($ES_CONTINUOUS -ne 2147483648) { throw "Bad ES_CONTINUOUS: $ES_CONTINUOUS" }
          if ($combined -ne 2147483649) { throw "Bad combined flags: $combined" }
          Write-Host "POWERSHELL_SLEEP_GUARD_OK $ES_CONTINUOUS $combined"
      - name: Validate downloader syntax
        shell: powershell
        run: python -m py_compile tools\bulk_history_download.py
