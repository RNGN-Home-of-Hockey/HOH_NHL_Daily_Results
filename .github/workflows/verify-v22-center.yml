name: Verify V22 Center
# V24.5.0 rotating background + news refresh verification



on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-v22-center.yml'
      - 'cloudflare-worker/src/telegram-center-v22-ui.js'
      - 'cloudflare-worker/src/telegram-center-v23-player-ui.js'
      - 'cloudflare-worker/src/telegram-center-v24-visual-ui.js'
      - 'cloudflare-worker/public/telegram-app/goalie-bg.webp'
      - 'cloudflare-worker/src/telegram-product-bot.js'
      - 'cloudflare-worker/src/telegram-center-v22-profiles.js'
      - 'cloudflare-worker/src/telegram-center-v21-spoilers-ui.js'
      - 'cloudflare-worker/src/telegram-center-roster-maintenance.js'
      - 'cloudflare-worker/src/telegram-center-v17-player-data.js'
      - 'cloudflare-worker/src/telegram-center-v19-ui.js'
      - 'cloudflare-worker/src/telegram-center-v20-ui.js'
      - 'cloudflare-worker/src/telegram-center-v20-news.js'
      - 'cloudflare-worker/src/telegram-center-v15-team-ui.js'
      - 'cloudflare-worker/src/telegram-center-v15-player-data.js'
      - 'cloudflare-worker/src/telegram-center-vk-maintenance.js'
      - 'cloudflare-worker/src/team-current-routes.js'
      - 'migrations/0028_user_profiles_and_exact_player_news.sql'
      - 'migrations/0030_user_profile_no_spoilers.sql'
      - 'migrations/0031_player_profile_physical.sql'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for Worker deploy
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          const url='https://hoh-nhl-daily-results.znamteam-903.workers.dev/telegram-app-v24?build=24.5.0';
          for(let i=0;i<60;i++){
            const r=await fetch(url,{cache:'no-store'});
            const body=await r.text().catch(()=>'');
            const build=String(r.headers.get('x-hoh-mini-app-build')||'');
            console.log('CENTER_DEPLOY_WAIT',i+1,r.status,build);
            if(r.ok&&build==='24.5.0'&&body.includes('HOH_MINI_APP_BUILD="24.5.0"'))process.exit(0);
            await new Promise(resolve=>setTimeout(resolve,2000));
          }
          throw new Error('V24.5.0 did not reach production before verification');
          JS
      - name: Verify production V22 contracts
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          const base='https://hoh-nhl-daily-results.znamteam-903.workers.dev';
          async function raw(path,opts={}){const r=await fetch(base+path,{cache:'no-store',...opts});return {r,t:await r.text()}}
          async function text(path){const {r,t}=await raw(path);if(!r.ok)throw new Error(path+' HTTP '+r.status);return t}
          async function json(path){const {r,t}=await raw(path);if(!r.ok)throw new Error(path+' HTTP '+r.status+' '+t.slice(0,300));return JSON.parse(t)}

          const shell=await text('/telegram-app-v24?build=24.5.0');
          const oldUrlShell=await text('/telegram-app?build=24.5.0');
          if(!shell.includes('HOH_CANONICAL_PLAYER_UI="V24"'))throw new Error('canonical shell marker missing');
          if(!shell.includes('<span class="v8">V24.5.0</span>'))throw new Error('canonical shell visible build badge is not V24.5.0');
          if(shell.includes('<span class="v8">V8</span>'))throw new Error('canonical shell leaked stale V8 badge');
          const browserAssets=['/telegram-app/v9.js','/telegram-app/v15-core.js','/telegram-app/v15-team.js','/telegram-app/v19.js','/telegram-app/v20.js','/telegram-app/v21.js','/telegram-app/v22.js','/telegram-app/v23-player.js','/telegram-app/v24-visual.js'];
          for(const asset of browserAssets){
            const js=await text(asset+'?build=24.5.0');
            try{new Function(js)}catch(e){throw new Error('production browser asset syntax invalid '+asset+': '+e.message)}
            if(asset==='/telegram-app/v15-core.js'&&(!js.includes('.brand,.status{display:none')||!js.includes("t.textContent='Главное'"))){
              throw new Error('production V15 core behavior markers missing');
            }
          }
          if(!oldUrlShell.includes('HOH_CANONICAL_PLAYER_UI="V24"'))throw new Error('/telegram-app is not canonical V24');
          for(const x of ['/telegram-app/v21.js?build=24.5.0','/telegram-app/v22.js?build=24.5.0','/telegram-app/v23-player.js?build=24.5.0','/telegram-app/v24-visual.js?build=24.5.0'])if(!shell.includes(x))throw new Error('canonical shell missing '+x);
          for(const x of ['/telegram-app/v9-polish.js','/telegram-app/v12.js','/telegram-app/v15-player.js','/telegram-app/v16.js','/telegram-app/v17.js','/telegram-app/v18.js']){
            if(shell.includes(x))throw new Error('legacy player script present in canonical shell '+x);
            if(oldUrlShell.includes(x))throw new Error('legacy player script present at old URL '+x);
          }
          const bundled=false;
          if(bundled){
            const runtime=await text('/telegram-app/runtime-v23.js');
            for(const x of ['HOHV15','HOHSetNoSpoilers','HOHEnsureCommentIdentity','openGameV19','СВЕЖЕЕ В НХЛ'])if(!runtime.includes(x))throw new Error('runtime bundle missing '+x);
          }

          const v22=await text('/telegram-app/v22.js');
          for(const x of ['v22NavRow','v22BackRow','HOHEnsureCommentIdentity','v22OpenProfile','avatar_data_url','normalizePlayers','v15GameRich','legacyGame','v22_no_spoilers','Любимая команда','HOHSetNoSpoilers','data-v15-player',"top='4px'"])if(!v22.includes(x))throw new Error('V22 missing '+x);
          const visual=await text('/telegram-app/v24-visual.js');
          if(visual.includes('--hoh-bg-player')||visual.includes('background=1&v='))throw new Error('V24 dynamic headshot background leaked into production');
          for(const x of ['goalie-bg.webp','--hoh-glass-light','backdrop-filter','V24.2 complete visual audit','V24.3 score/odds/Winline regression fixes','V24.5 stable hockey silhouette + immutable Winline asset','white-space:nowrap','min-width:max-content','v19Cal','v20News','v22ProfileCard','v23Audio','right:74px','top:calc(50% - 6px)','z-index:7','width:18px','font-size:10px'])if(!visual.includes(x))throw new Error('V24.4 visual layer missing '+x);
          const bg=await raw('/telegram-app/goalie-bg.webp?build=24.5.0');
          if(!bg.r.ok)throw new Error('goalie background HTTP '+bg.r.status);
          if(!String(bg.r.headers.get('content-type')||'').includes('image/webp'))throw new Error('goalie background content-type '+bg.r.headers.get('content-type'));
          const v22nav=await text('/telegram-app/v22.js');
          for(const x of ['v22SettingsToggle','grid-template-columns:repeat(4,minmax(0,1fr))','Мои и настройки',"body.theme_mode||'light'",'H.decorateHomeOdds'])if(!v22nav.includes(x))throw new Error('V22 navigation/settings missing '+x);
          const v23player=await text('/telegram-app/v23-player.js');
          for(const x of ['/broadcast/winline-logo.png?asset=canonical-1','v23RecTeam','v23RecTrend','Ставка WINLINE','font:italic 950',"a.join('<br>')"])if(!v23player.includes(x))throw new Error('V23 player UX missing '+x);
          const v15core=await text('/telegram-app/v15-core.js');
          if(!v15core.includes("localStorage.getItem('hoh-center-theme')||'light'"))throw new Error('light theme is not default');
          const v19=await text('/telegram-app/v19.js');
          for(const x of ['/broadcast/winline-logo.png','v19WinlineLogo','video_fallback','data-v19-link'])if(!v19.includes(x))throw new Error('V19 match UI regression fix missing '+x);
          const fixedLogo=await raw('/broadcast/winline-logo.png');
          if(!fixedLogo.r.ok||!String(fixedLogo.r.headers.get('content-type')||'').includes('image/png'))throw new Error('fixed Winline logo unavailable');
          const v15logo=await text('/telegram-app/v15-core.js');
          if(!v15logo.includes('/broadcast/winline-logo.png'))throw new Error('V15 Winline logo is not fixed image');
          const playerLogo=await text('/telegram-app/v23-player.js');
          if(!playerLogo.includes('/broadcast/winline-logo.png'))throw new Error('player Winline logo is not fixed image');
          const archiveFallback=await json('/api/telegram-center-v19/broadcasts?from=2026-09-23&to=2026-09-25');
          const completedNoVk=(archiveFallback.games||[]).find(g=>['FINAL','OFF'].includes(String(g.game_state||'').toUpperCase())&&!g.vk);
          if(completedNoVk){
            const detail=await json('/api/telegram-center-v19/games/'+completedNoVk.game_pk);
            if(!detail.broadcast&&!detail.video_fallback)throw new Error('completed game has no video fallback '+completedNoVk.game_pk);
            if(detail.video_fallback&&!String(detail.video_fallback.web_url||'').includes('youtube.com/'))throw new Error('fallback is not NHL YouTube '+JSON.stringify(detail.video_fallback));
          }
          const bgPlayers=await json('/api/telegram-center-v17/players?limit=60&background=1&v='+Date.now());
          const bgPool=(bgPlayers.players||[]).filter(p=>p?.headshot&&p?.current_team_tri).sort((a,b)=>Number(b.salary_aav||0)-Number(a.salary_aav||0)).slice(0,30);
          if(bgPool.length<20)throw new Error('background player pool too small '+bgPool.length);
          console.log('BACKGROUND_POOL_OK',bgPool.length,bgPool.slice(0,3).map(x=>x.full_name_en).join(', '));
          const v23=await text('/telegram-app/v23-player.js');
          for(const x of ['lockCanonicalPlayer','capturePlayerClick','blockedLegacyOpenPlayer','HOH_CANONICAL_PLAYER_UI','COUNTRY_GRADIENT','rankVisual','v23RankLeagueTop','v23RecOdds','data-v23-rec-market','Все показатели','goals_per_60','shot_attempts_per_60','v23LastCover','grid-template-columns:repeat(4,minmax(0,1fr))','Вся статистика игрока','v23Country','Контракт 2026/27','renderFullStats','power_play_points'])if(!v23.includes(x))throw new Error('V23 player UI missing '+x);
          if(v23.includes('По умолчанию открывается последний сезон'))throw new Error('player profile still contains explanatory season note');
          if(v23.includes('ближайший вариант по силе сигнала'))throw new Error('player Winline card still contains explanatory footer');
          const v21=await text('/telegram-app/v21.js');
          if(v21.includes("textContent='V21'"))throw new Error('V21 still stamps old version into UI');

          // v19 already loaded above for match-media regression checks
          for(const x of ['v19LastGameRich','v19OddsMatch','v19TeamVk','TEAM_RU','mountPlayerTeamOdds','v19MetaSecond','Контракт 2026/27','finishType','v19ThumbTeams','Вся статистика игрока','ПЛЕЙ-ОФФ'])if(!v19.includes(x))throw new Error('V19 upgrade missing '+x);
          const v12=await text('/telegram-app/v12.js');
          for(const x of ['installSeasons','injectMedia','decoratePhotoAndHeader'])if(!v12.includes(x))throw new Error('V12 frontend missing '+x);
          const media=await json('/api/telegram-center-v12/media?v='+Date.now());
          const freshNews=(media.items||[]).find(x=>x.kind==='news');
          if(!freshNews)throw new Error('V12 media missing NEWS');
          if(!/youtube\.com\/watch\?v=/.test(String(freshNews.url||'')))throw new Error('NEWS url is not YouTube watch URL');
          if(!/i\.ytimg\.com\/vi\//.test(String(freshNews.thumb||'')))throw new Error('NEWS thumbnail is not YouTube thumbnail');
          if(String(freshNews.url||'').includes('mjDYO1uaw7E'))throw new Error('NEWS is still pinned to obsolete launch episode');
          if(!/news|ньюс/i.test(String(freshNews.title||'')))throw new Error('Latest media item is not HOH NEWS '+freshNews.title);
          if(!['youtube_live','repository_cache'].includes(String(media.source||'')))throw new Error('Unexpected media source '+media.source);
          const seasonStats=await json('/api/telegram-center-v12/players/8479318/season/20252026');
          const ss=seasonStats.stats||{};
          for(const k of ['games_played','goals','assists','points','shots','power_play_points','shooting_pct','avg_toi_seconds','goals_per_60','assists_per_60','points_per_60','shots_per_60'])if(!(k in ss))throw new Error('V12 season stats missing '+k);
          for(const x of ['mediaRefreshInstalled','visibilitychange','120000'])if(!v15core.includes(x))throw new Error('V15 core media refresh missing '+x);
          for(const x of ['overflow-x:hidden','v15MineMeta','v15MineCountry','v15MineSalary','.v15Light .gameCard'])if(!v15core.includes(x))throw new Error('V15 core layout/light/mine missing '+x);
          const v9=await text('/telegram-app/v9.js');
          if(!v9.includes("badge=b.querySelector('.orangeText')"))throw new Error('V9 player localizer does not preserve country badge');
          for(const x of ['homeMediaAllowed','purgeMediaOffHome','document.getElementById(\'view\')!==view'])if(!v9.includes(x))throw new Error('V9 home-only media guard missing '+x);
          for(const x of ['homeMediaAllowed','purgeMediaOffHome','V15.view()!==root'])if(!v15core.includes(x))throw new Error('V15 home-only media guard missing '+x);
          if(v9.includes('<span class="orangeText" style="font-size:10px">RU</span>'))throw new Error('V9 still hardcodes RU for all players');
          const v15team=await text('/telegram-app/v15-team.js');
          for(const x of ['cupText','v15SeriesSpoiler','Финал Кубка Стэнли','v15OddsMatch','nextOdds'])if(!v15team.includes(x))throw new Error('team UI upgrade missing '+x);
          for(const x of ['v15SeriesSpoiler','HOHSetNoSpoilers','hoh-spoilers-change'])if(!v21.includes(x))throw new Error('spoiler contract missing '+x);

          const leoLast=await json('/api/telegram-center-v18/players/8484153/last-game');
          if(!leoLast.game)throw new Error('Leo Carlsson last appearance missing');
          if(!leoLast.game.vk?.web_url&&!leoLast.game.vk?.app_url)throw new Error('Leo Carlsson last playoff appearance has no VK broadcast link '+JSON.stringify(leoLast.game));
          const leoRec=await json('/api/telegram-center-v17/players/8484153/recommendation');
          if(leoRec.ok!==true)throw new Error('Leo Carlsson recommendation endpoint failed '+JSON.stringify(leoRec));
          if(leoRec.recommendation){
            const m=leoRec.recommendation.market||{};
            if(!(Number(m.odds)>1)||!m.live||!m.market_id)throw new Error('player recommendation is not a real Winline market '+JSON.stringify(leoRec));
          }
          const dahlinSearch=await json('/api/telegram-center-v17/players?q='+encodeURIComponent('Rasmus Dahlin')+'&limit=20');
          const dahlinHit=(dahlinSearch.players||[]).find(x=>String(x.full_name_en||'').toLowerCase()==='rasmus dahlin');
          if(!dahlinHit)throw new Error('Rasmus Dahlin search missing');
          const dahlin=await json('/api/telegram-center-v17/players/'+dahlinHit.player_id);
          if(String(dahlin.player?.primary_country_code||'').toUpperCase()!=='SWE')throw new Error('Dahlin country metadata is not SWE '+JSON.stringify(dahlin.player));
          const matthews=await json('/api/telegram-center-v17/players/8479318');
          for(const k of ['primary_country_code','birth_date','height_cm','weight_kg','team_logo','salary_aav'])if(!matthews.player?.[k])throw new Error('Matthews profile missing '+k);
          if(matthews.player.current_team_tri!=='TOR')throw new Error('Matthews team mismatch '+matthews.player.current_team_tri);
          const rosenSearch=await json('/api/telegram-center-v17/players?q='+encodeURIComponent('Isak Rosen')+'&limit=20');
          const rosen=(rosenSearch.players||[]).find(x=>String(x.full_name_en||'').toLowerCase().includes('isak rosen'));
          if(rosen){
            const rp=await json('/api/telegram-center-v17/players/'+rosen.player_id);
            for(const k of ['primary_country_code','birth_date','height_cm','weight_kg','team_logo'])if(!rp.player?.[k])throw new Error('Rosen profile missing '+k);
          }

          const v20=await text('/telegram-app/v20.js');
          for(const x of ['limit=15','v20NewsExtra','v20More','v20CommentAvatar','width:22px!important','HOHEnsureCommentIdentity','.v20NewsExtra{display:none}','source_badge','HOME_NEWS_REFRESH_MS','setInterval','visibilitychange','mountHomeNews(true)'])if(!v20.includes(x))throw new Error('V20 upgrade missing '+x);
          if(v20.includes("H.openPlayer=async function(id){await oldPlayer(id);await mountPlayerNews"))throw new Error('player news still mounted');

          const news=await json('/api/telegram-center-v20/news/home?limit=15&v='+Date.now());
          if(Number(news.refresh_interval_ms)!==600000)throw new Error('home news refresh interval mismatch '+JSON.stringify(news));
          console.log('V20_NEWS_SYNC',JSON.stringify(news.sync||null));
          if((news.news||[]).length<15)throw new Error('home news <15');
          const latestNewsMs=Math.max(...(news.news||[]).map(x=>Date.parse(String(x.published_at||x.created_at||''))).filter(Number.isFinite));
          if(!Number.isFinite(latestNewsMs)||Date.now()-latestNewsMs>30*60*60*1000)throw new Error('home news content stale latest='+String(news.news?.[0]?.published_at||news.news?.[0]?.created_at)+' title='+String(news.news?.[0]?.title||''));
          console.log('V20_LATEST_NEWS',new Date(latestNewsMs).toISOString(),String(news.news?.[0]?.title||''));
          const newsStatusFresh=await json('/api/telegram-center-v20/news/status');
          const lastSyncAt=Date.parse(String(newsStatusFresh.last_home_sync?.at||''));
          if(!Number.isFinite(lastSyncAt)||Date.now()-lastSyncAt>20*60*1000)throw new Error('home news sync stale '+JSON.stringify(newsStatusFresh.last_home_sync));
          const ovi=await json('/api/telegram-center-v20/players/8471214/news?limit=100');
          if(!(ovi.news||[]).length)throw new Error('exact Ovechkin news empty');

          const unauth=await raw('/api/telegram-center-v22/me');
          if(unauth.r.status!==401)throw new Error('profile API must require Telegram auth, got '+unauth.r.status);
          const centerStatus=await json('/api/telegram/center/status');
          if(String(centerStatus.mini_app_url||'')!=='https://hoh-nhl-daily-results.znamteam-903.workers.dev/telegram-app-v24?build=24.5.0')throw new Error('Center mini app URL is not exact current build '+centerStatus.mini_app_url);
          if(String(centerStatus.menu_button?.value?.web_app?.url||'')!==centerStatus.mini_app_url)throw new Error('Telegram menu button build mismatch '+JSON.stringify(centerStatus.menu_button));
          if(centerStatus.menu_button_matches_build!==true)throw new Error('Telegram menu build contract false '+JSON.stringify(centerStatus));

          const status=await json('/api/telegram-center-v19/status');
          if(status.backfill?.done===false)throw new Error('VK full backfill incomplete');
          console.log('V22_PRODUCTION_OK',JSON.stringify({home_news:news.news.length,ovechkin_exact_news:ovi.news.length,vk_mapped:status.mapped_games,vk_unmapped:status.unmapped_games}));
          JS
