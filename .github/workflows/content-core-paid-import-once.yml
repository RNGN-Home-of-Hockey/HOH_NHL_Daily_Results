name: Content Core Paid Import Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/content-core-paid-import-once.yml"

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '9032ec1bd3cb868d89a38453e4bd1a69' }}
      TARGET_DATABASE_ID: eeaf01ce-1a33-4d45-8cbe-fd7ae95ae507
      SOURCE_EXPORT_URL: "https://1ad59b064bfa3690063414a9906129e4.r2.cloudflarestorage.com/d1-sqlio-outgoing-prod/ffde1744-d9f1-4afc-afc1-77f020a8f0ce-0000209c-00000000-000050ef-a41b9b56f836ae555ff5cf479408d5e3.sql?X-Amz-Expires=3600&X-Amz-Date=20260923T104639Z&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=f591b8dcd0794c54409cf0613171d42b%2F20260923%2Fauto%2Fs3%2Faws4_request&X-Amz-SignedHeaders=host&X-Amz-Signature=43e5bab3babefb5ee809e37f283e247a0d944aa1c2d96ba7b1e8f753eb6735f1"
    steps:
      - uses: actions/checkout@v6
      - name: Download exported Content Core SQL
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$SOURCE_EXPORT_URL" -o /tmp/content-core.sql
          test -s /tmp/content-core.sql
          echo "CONTENT_CORE_EXPORT_BYTES|$(wc -c < /tmp/content-core.sql)"
          echo "CONTENT_CORE_EXPORT_MD5|$(md5sum /tmp/content-core.sql | awk '{print $1}')"
      - name: Import into paid D1
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$TARGET_DATABASE_ID/import"
          ETAG="$(md5sum /tmp/content-core.sql | awk '{print $1}')"
          INIT="$(curl --fail --silent --show-error "$API"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             -d "{\"action\":\"init\",\"etag\":\"$ETAG\"}")"
          echo "$INIT" | jq -e '.success == true' >/dev/null
          UPLOAD_URL="$(echo "$INIT" | jq -r '.result.upload_url')"
          FILENAME="$(echo "$INIT" | jq -r '.result.filename')"
          test -n "$UPLOAD_URL" -a "$UPLOAD_URL" != "null"
          test -n "$FILENAME" -a "$FILENAME" != "null"

          curl --fail --silent --show-error -X PUT --upload-file /tmp/content-core.sql "$UPLOAD_URL" -o /dev/null

          INGEST="$(curl --fail --silent --show-error "$API"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             -d "{\"action\":\"ingest\",\"etag\":\"$ETAG\",\"filename\":\"$FILENAME\"}")"
          echo "$INGEST" | jq -e '.success == true' >/dev/null
          BOOKMARK="$(echo "$INGEST" | jq -r '.result.at_bookmark')"
          test -n "$BOOKMARK" -a "$BOOKMARK" != "null"

          for _ in $(seq 1 600); do
            POLL="$(curl --fail --silent --show-error "$API"               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H "Content-Type: application/json"               -d "{\"action\":\"poll\",\"current_bookmark\":\"$BOOKMARK\"}")"
            STATUS="$(echo "$POLL" | jq -r '.result.status // empty')"
            SUCCESS="$(echo "$POLL" | jq -r '.result.success // false')"
            ERROR="$(echo "$POLL" | jq -r '.result.error // empty')"
            echo "CONTENT_CORE_PAID_IMPORT_STATUS|$(echo "$POLL" | jq -c '{status:.result.status,success:.result.success,error:.result.error,messages:.result.messages}')"
            if [ "$STATUS" = "complete" ]; then
              echo "CONTENT_CORE_PAID_IMPORT|$(echo "$POLL" | jq -c '{status:.result.status,success:.result.success,bookmark:.result.at_bookmark,final_bookmark:.result.result.final_bookmark,meta:.result.result.meta,num_queries:.result.result.num_queries}')"
              exit 0
            fi
            if [ "$STATUS" = "error" ]; then
              echo "$POLL"
              exit 1
            fi
            # D1_RESET_DO is a transient phase while D1 swaps the imported database.
            # Keep polling; stopping here can cancel a large import.
            sleep 2
          done
          echo "Import polling timed out" >&2
          exit 1
      - name: Verify target table counts
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$TARGET_DATABASE_ID/query"
          SQL="SELECT (SELECT COUNT(*) FROM projects) AS projects,(SELECT COUNT(*) FROM social_accounts) AS accounts,(SELECT COUNT(*) FROM videos) AS videos,(SELECT COUNT(*) FROM publications) AS publications,(SELECT COUNT(*) FROM metric_snapshots) AS metric_snapshots,(SELECT COUNT(*) FROM publication_latest_metrics) AS latest_metrics;"
          RESULT="$(curl --fail --silent --show-error "$API"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             -d "$(jq -nc --arg sql "$SQL" '{sql:$sql}')")"
          echo "$RESULT" | jq -e '.success == true' >/dev/null
          echo "CONTENT_CORE_PAID_COUNTS|$(echo "$RESULT" | jq -c '.result[0].results[0]')"
