name: Temporary final compact chunk schema test
on:
  push:
    paths:
      - '.github/workflows/_tmp-final-chunk-schema-test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute every supplemental chunk family against D1-like schema
        run: |
          python - <<'PY'
          import importlib.util, sqlite3, tempfile
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('m','tools/build_compact_snapshots.py')
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          local=sqlite3.connect(':memory:'); local.row_factory=sqlite3.Row
          local.executescript('''CREATE TABLE games(game_pk INTEGER PRIMARY KEY,season_id TEXT,game_type INTEGER,scheduled_start_utc TEXT,home_tri TEXT,away_tri TEXT); CREATE TABLE team_game_features(game_pk INTEGER,team_tri TEXT,scheduled_start_utc TEXT); CREATE TABLE team_game_advanced_features(game_pk INTEGER,team_tri TEXT);''')
          m.create_local_schema(local)
          local.execute("INSERT INTO players_compact_local VALUES(1,'Test','Player','Test Player','AAA','C',9,NULL,1,'2026-06-01T00:00:00Z',42)")
          local.execute("INSERT INTO player_rolling_snapshots_local VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)",(1,'AAA','C','20','2026-06-01T00:00:00Z',20,10,15,25,70,10,4,6,8,24000,2,10,15,8,.5,.75,1.25,3.5,1200,'NOW'))
          local.execute("INSERT INTO player_opponent_splits_local VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)",(1,'AAA','BBB','2Y',8,4,6,10,30,4,7,3,.5,.75,1.25,3.75,'2026-05-01T00:00:00Z','NOW'))
          local.execute("INSERT INTO goalie_rolling_snapshots_local VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)",(1,'AAA','20','2026-06-01T00:00:00Z',20,20,12,6,2,600,640,40,600/640,2,2,72000,3600,'NOW'))
          local.execute("INSERT INTO goalie_opponent_splits_local VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)",(1,'AAA','BBB','2Y',8,8,5,2,1,240,256,16,240/256,2,1,'2026-05-01T00:00:00Z','NOW'))
          cols=[r[1] for r in local.execute('PRAGMA table_info(pregame_team_snapshots_local)')]
          row={c:None for c in cols}
          row.update(game_pk=42,team_tri='AAA',opponent_tri='BBB',window_games=20,sample_size=20,league_teams=32,gf_pg=3.2,ga_pg=2.6,goal_diff_pg=.6,total_pg=5.8,corsi_pct=52,fenwick_pct=51,p2_diff_pg=.2,rank_gf=5,rank_ga=8,rank_goal_diff=6,rank_total=18,rank_corsi=7,rank_fenwick=9,rank_p2_diff=10,advanced_sample_size=20,advanced_league_teams=32,xgf_pct_5v5=53,xgf60_5v5=3,xga60_5v5=2.5,corsi_pct_5v5=52,fenwick_pct_5v5=51,pdo_5v5=100,gsax_5v5=.3,rank_xgf_pct_5v5=6,rank_xgf60_5v5=5,rank_xga60_5v5=8,rank_corsi_pct_5v5=7,rank_fenwick_pct_5v5=9,computed_at='NOW')
          local.execute('INSERT INTO pregame_team_snapshots_local('+','.join(cols)+') VALUES('+','.join('?' for _ in cols)+')',[row[c] for c in cols])
          local.commit()

          with tempfile.TemporaryDirectory() as td:
              m.CHUNK_ROOT=Path(td)
              counts,chunks=m.export_supplemental_chunks(local)
              names=[p.name for p in sorted(Path(td).glob('*.sql'))]
              for prefix in ('070_players','080_team_snapshots','090_player_rolling','100_player_opponents','110_goalie_rolling','120_goalie_opponents'):
                  assert any(n.startswith(prefix) for n in names),(prefix,names)
              prod=sqlite3.connect(':memory:')
              prod.executescript('''
              PRAGMA foreign_keys=ON;
              CREATE TABLE teams(tri_code TEXT PRIMARY KEY,nhl_team_id INTEGER,franchise_id INTEGER,name_en TEXT NOT NULL,name_ru TEXT,location_en TEXT,active INTEGER NOT NULL DEFAULT 1,logo_url TEXT,updated_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP);
              INSERT INTO teams(tri_code,name_en) VALUES('AAA','AAA'),('BBB','BBB');
              CREATE TABLE players(player_id INTEGER PRIMARY KEY,first_name_en TEXT,last_name_en TEXT,full_name_en TEXT NOT NULL,full_name_ru TEXT,current_team_tri TEXT,position_code TEXT,sweater_number INTEGER,shoots_catches TEXT,active INTEGER NOT NULL DEFAULT 1,updated_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,FOREIGN KEY(current_team_tri) REFERENCES teams(tri_code));
              CREATE TABLE games(game_pk INTEGER PRIMARY KEY,season_id TEXT,game_type INTEGER,scheduled_start_utc TEXT,game_state TEXT,home_tri TEXT,away_tri TEXT,home_score INTEGER,away_score INTEGER,current_period INTEGER,period_type TEXT,venue_name TEXT,last_synced_at TEXT DEFAULT CURRENT_TIMESTAMP);
              INSERT INTO games(game_pk,season_id,game_type,scheduled_start_utc,game_state,home_tri,away_tri,home_score,away_score) VALUES(42,'20252026',2,'2026-06-02T00:00:00Z','OFF','BBB','AAA',2,3);
              ''')
              prod.executescript(Path('migrations/0006_compact_snapshots_players.sql').read_text())
              for path in sorted(Path(td).glob('*.sql')):
                  prod.executescript(path.read_text())
              expected={'players':1,'pregame_team_snapshots':1,'player_rolling_snapshots':1,'player_opponent_splits':1,'goalie_rolling_snapshots':1,'goalie_opponent_splits':1}
              got={t:prod.execute(f'SELECT COUNT(*) FROM {t}').fetchone()[0] for t in expected}
              assert got==expected,(got,expected,names)
              print('ALL_SUPPLEMENTAL_CHUNK_FAMILIES_OK',counts,chunks,got)
          PY
