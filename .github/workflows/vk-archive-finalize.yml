name: Finalize VK archive sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vk-archive-finalize.yml'
      - 'tools/finalize_vk_archive.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch VK matcher and audit status
        run: python tools/finalize_vk_archive.py
      - name: JavaScript syntax
        run: |
          node --check cloudflare-worker/src/telegram-center-vk-maintenance.js
          node --check cloudflare-worker/src/telegram-center-v18-vk-data.js
          node --check cloudflare-worker/src/worker-entry.js
      - name: Migration chain
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db=sqlite3.connect(':memory:')
          for path in sorted(Path('migrations').glob('*.sql')):
              db.executescript(path.read_text(encoding='utf-8'))
              print('MIGRATION_OK',path.name)
          games=db.execute("SELECT COUNT(*) FROM games WHERE season_id IN ('20242025','20252026') AND game_type IN (2,3)").fetchone()[0]
          assert games==2792,games
          print('VK_MIGRATION_CHAIN_OK',games)
          PY
      - name: Worker dry run
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir .validation-build
      - name: Commit finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-worker/src/telegram-center-vk-maintenance.js cloudflare-worker/src/telegram-center-v18-vk-data.js
          if git diff --cached --quiet; then echo 'Already finalized'; exit 0; fi
          git commit -m "Finalize VK archive sync and coverage audit"
          git pull --rebase origin main
          git push
