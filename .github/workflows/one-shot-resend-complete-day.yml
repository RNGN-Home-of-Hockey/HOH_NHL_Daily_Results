name: One-shot resend complete full day

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-resend-complete-day.yml'

permissions:
  contents: read
  actions: read

jobs:
  resend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - name: Recover target chat
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/oldrun
          curl -fsSL -L             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/35601216338/logs"             -o /tmp/oldrun/logs.zip
          unzip -oq /tmp/oldrun/logs.zip -d /tmp/oldrun/logs
          target_chat=$(grep -RhoE 'TARGET_CHAT_ID: -?[0-9]+' /tmp/oldrun/logs | tail -1 | awk '{print $2}')
          test -n "$target_chat"
          echo "::add-mask::$target_chat"
          echo "TELEGRAM_TARGET_CHAT_ID=$target_chat" >> "$GITHUB_ENV"
      - name: Send corrected full day
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TARGET_CHAT_ID: ${{ env.TELEGRAM_TARGET_CHAT_ID }}
          FULL_DAY_MENU: "1"
          TARGET_DATE: "2026-09-20"
          SPORTSRU_ON_DEMAND_ENABLED: "1"
          TELEGRAM_INTERACTIVE_ENABLED: "0"
          DEBUG_VERBOSE: "0"
          DRY_RUN: "0"
        run: python nhl_single_result_bot.py
