name: Wire renewable VK auth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vk-refresh-wire.yml'
      - 'cloudflare-worker/src/telegram-center-vk-auth.js'
      - 'cloudflare-worker/src/telegram-center-vk-maintenance-v2.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wire refresh auth and expose refresh credentials locally
        run: |
          python - <<'PY'
          from pathlib import Path

          worker=Path('cloudflare-worker/src/worker-entry.js')
          s=worker.read_text(encoding='utf-8')
          old='import { runVkBroadcastMaintenance } from "./telegram-center-vk-maintenance.js";'
          new='import { runVkBroadcastMaintenance } from "./telegram-center-vk-maintenance-v2.js";'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise RuntimeError('VK maintenance import anchor not found')
          worker.write_text(s,encoding='utf-8')

          helper=Path('cloudflare-worker/src/vk-oauth-helper.js')
          h=helper.read_text(encoding='utf-8')
          old_html='''<div class="ok" id="ok"><p><b>Access token получен.</b> Скопируй его и вставь в терминал после команды <code>npx wrangler secret put VK_ACCESS_TOKEN</code>.</p><textarea class="token" id="token" readonly></textarea><button class="btn copy" id="copy">Скопировать токен</button><div class="note">Не отправляй токен в чат, почту или Telegram.</div></div>'''
          new_html='''<div class="ok" id="ok"><p><b>VK ID авторизация получена.</b> Для постоянной автоматической синхронизации нужны refresh token и device ID. Все значения остаются только в этом браузере.</p><div class="field">Access token</div><textarea class="token" id="token" readonly></textarea><button class="btn copy" id="copy">Скопировать access token</button><div class="field">Refresh token</div><textarea class="token" id="refresh" readonly></textarea><button class="btn copy" id="copyRefresh">Скопировать refresh token</button><div class="field">Device ID</div><textarea class="token small" id="device" readonly></textarea><button class="btn copy" id="copyDevice">Скопировать device ID</button><div class="note">Не отправляй эти значения в чат, почту или Telegram. Refresh token будет использоваться Worker только для автоматического обновления короткоживущего access token.</div></div>'''
          if old_html in h:
              h=h.replace(old_html,new_html,1)
          elif 'id="copyRefresh"' not in h:
              raise RuntimeError('OAuth helper HTML anchor not found')

          old_css='.btn{width:100%;margin-top:12px;padding:14px 18px;border:0;border-radius:13px;font-weight:700;cursor:pointer}.copy{background:#fff;color:#111}.status'
          new_css='.btn{width:100%;margin-top:12px;padding:14px 18px;border:0;border-radius:13px;font-weight:700;cursor:pointer}.copy{background:#fff;color:#111}.field{font-size:12px;font-weight:800;margin:16px 0 6px;color:#c9d0df}.token.small{min-height:54px}.status'
          if old_css in h:
              h=h.replace(old_css,new_css,1)

          old_js='''            const token = data && data.access_token;
            if(!token) throw new Error('VK ID не вернул access_token');
            document.getElementById('auth').style.display='none';
            document.getElementById('ok').style.display='block';
            document.getElementById('token').value=token;'''
          new_js='''            const token = data && data.access_token;
            const refresh = data && data.refresh_token;
            const device = payload.device_id || (data && data.device_id) || '';
            if(!token) throw new Error('VK ID не вернул access_token');
            if(!refresh) throw new Error('VK ID не вернул refresh_token');
            if(!device) throw new Error('VK ID не вернул device_id');
            document.getElementById('auth').style.display='none';
            document.getElementById('ok').style.display='block';
            document.getElementById('token').value=token;
            document.getElementById('refresh').value=refresh;
            document.getElementById('device').value=device;'''
          if old_js in h:
              h=h.replace(old_js,new_js,1)
          elif 'document.getElementById(\'refresh\').value=refresh' not in h:
              raise RuntimeError('OAuth helper exchange anchor not found')

          old_copy='''  document.getElementById('copy').onclick=async function(){
    const token=document.getElementById('token').value;
    await navigator.clipboard.writeText(token);
    this.textContent='Скопировано';
  };'''
          new_copy='''  function bindCopy(buttonId,valueId){
    document.getElementById(buttonId).onclick=async function(){
      const value=document.getElementById(valueId).value;
      await navigator.clipboard.writeText(value);
      this.textContent='Скопировано';
    };
  }
  bindCopy('copy','token');
  bindCopy('copyRefresh','refresh');
  bindCopy('copyDevice','device');'''
          if old_copy in h:
              h=h.replace(old_copy,new_copy,1)
          elif "bindCopy('copyRefresh','refresh')" not in h:
              raise RuntimeError('OAuth helper copy anchor not found')
          helper.write_text(h,encoding='utf-8')
          PY
      - name: Verify syntax
        run: |
          node --check cloudflare-worker/src/telegram-center-vk-auth.js
          node --check cloudflare-worker/src/telegram-center-vk-maintenance-v2.js
          node --check cloudflare-worker/src/vk-oauth-helper.js
          node --check cloudflare-worker/src/worker-entry.js
          grep -q 'telegram-center-vk-maintenance-v2.js' cloudflare-worker/src/worker-entry.js
          grep -q 'copyRefresh' cloudflare-worker/src/vk-oauth-helper.js
      - name: Commit wiring
        run: |
          if git diff --quiet; then echo 'Already wired'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-worker/src/worker-entry.js cloudflare-worker/src/vk-oauth-helper.js
          git commit -m 'Wire renewable VK authorization'
          git pull --rebase origin main
          git push
