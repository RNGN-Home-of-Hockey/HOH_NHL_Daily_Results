name: Patch Warehouse V2

on:
  push:
    paths:
      - '.github/workflows/patch-warehouse-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch builder
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/build_local_warehouse.py')
          s=p.read_text(encoding='utf-8')
          old='''    periods=[]\n    for (pn,pt),(hg,ag,_) in sorted(period_goals.items()):\n        periods.append({"game_pk":game_pk,"period_number":pn,"period_type":pt,"home_goals":hg,"away_goals":ag})\n'''
          new='''    # Always materialize regulation periods, including scoreless 0:0 periods.\n    periods=[\n        {"game_pk":game_pk,"period_number":pn,"period_type":"REG","home_goals":p[pn][0],"away_goals":p[pn][1]}\n        for pn in (1,2,3)\n    ]\n    for (pn,pt),(hg,ag,_) in sorted(period_goals.items()):\n        if pn > 3 and pt != "SO":\n            periods.append({"game_pk":game_pk,"period_number":pn,"period_type":pt,"home_goals":hg,"away_goals":ag})\n'''
          if old not in s: raise SystemExit('period anchor missing')
          s=s.replace(old,new,1)
          old2='''def write_multirow_sql(path,table,cols,rows,conflict_cols,update_cols=None):\n    if not rows: return\n    values=',\\n'.join('('+','.join(sql_value(r[c]) for c in cols)+')' for r in rows)\n    if update_cols is None: update_cols=[c for c in cols if c not in conflict_cols]\n    conflict=','.join(conflict_cols)\n    update=','.join(f"{c}=excluded.{c}" for c in update_cols)\n    path.write_text(f"INSERT INTO {table} ({','.join(cols)}) VALUES\\n{values}\\nON CONFLICT({conflict}) DO UPDATE SET {update};\\n",encoding='utf-8')\n\n\ndef export_table(db,table,conflict_cols,prefix,batch=200,exclude=()):\n'''
          new2='''def write_multirow_sql(path,table,cols,rows,conflict_cols,update_cols=None):\n    if not rows: return\n    values=',\\n'.join('('+','.join(sql_value(r[c]) for c in cols)+')' for r in rows)\n    if update_cols is None: update_cols=[c for c in cols if c not in conflict_cols]\n    conflict=','.join(conflict_cols)\n    action=("DO UPDATE SET "+','.join(f"{c}=excluded.{c}" for c in update_cols)) if update_cols else "DO NOTHING"\n    path.write_text(f"INSERT INTO {table} ({','.join(cols)}) VALUES\\n{values}\\nON CONFLICT({conflict}) {action};\\n",encoding='utf-8')\n\n\ndef export_table(db,table,conflict_cols,prefix,batch=200,exclude=(),update_cols=None):\n'''
          if old2 not in s: raise SystemExit('sql writer anchor missing')
          s=s.replace(old2,new2,1)
          old3='''        write_multirow_sql(CHUNK_ROOT/f"{prefix}_{idx//batch:04d}.sql",table,cols,rows[idx:idx+batch],conflict_cols)\n'''
          new3='''        write_multirow_sql(CHUNK_ROOT/f"{prefix}_{idx//batch:04d}.sql",table,cols,rows[idx:idx+batch],conflict_cols,update_cols)\n'''
          if old3 not in s: raise SystemExit('export call anchor missing')
          s=s.replace(old3,new3,1)
          old4="    counts['teams']=export_table(db,'teams',['tri_code'],'010_teams',100)\n"
          new4="    counts['teams']=export_table(db,'teams',['tri_code'],'010_teams',100,update_cols=[])\n"
          if old4 not in s: raise SystemExit('teams export anchor missing')
          s=s.replace(old4,new4,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile tools/build_local_warehouse.py
          git diff --check
      - name: Real NHL smoke build
        run: |
          mkdir -p local-data/nhl-history/games/20242025/2024020001
          echo '{"ok":true}' > local-data/nhl-history/complete.json
          python - <<'PY'
          import json,urllib.request
          from pathlib import Path
          d=Path('local-data/nhl-history/games/20242025/2024020001')
          for ep,name in [('boxscore','boxscore.json'),('play-by-play','play-by-play.json')]:
              with urllib.request.urlopen('https://api-web.nhle.com/v1/gamecenter/2024020001/'+ep,timeout=30) as r: x=json.load(r)
              (d/name).write_text(json.dumps(x),encoding='utf-8')
          PY
          python tools/build_local_warehouse.py
          python - <<'PY'
          import sqlite3
          db=sqlite3.connect('local-data/warehouse/hoh_history.sqlite')
          assert db.execute('select count(*) from period_scores where game_pk=2024020001 and period_number in (1,2,3)').fetchone()[0]==3
          team_sql=open(next(__import__('pathlib').Path('local-data/warehouse/d1-chunks').glob('010_teams*.sql')),encoding='utf-8').read()
          assert 'DO NOTHING' in team_sql
          print('WAREHOUSE_V2_OK')
          PY
      - name: Commit
        run: |
          git config user.name 'znamteam-max'
          git config user.email 'znamteam@gmail.com'
          git add tools/build_local_warehouse.py
          git commit -m 'Harden compact warehouse period and team exports'
          git push origin HEAD:main
