name: Validate Broadcast Renderer

on:
  push:
    branches: [main]
    paths:
      - 'vercel-broadcast-renderer/**'
      - '.github/workflows/validate-broadcast-renderer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vercel-broadcast-renderer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm test
