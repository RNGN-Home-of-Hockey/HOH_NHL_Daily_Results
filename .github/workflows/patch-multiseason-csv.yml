name: Patch Multi-season CSV

on:
  push:
    paths:
      - '.github/workflows/patch-multiseason-csv.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch builder
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/build_local_warehouse.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('- local-data/hockeystats/2025-26/teams/*.csv  (optional manual 5v5 source)', '- local-data/hockeystats/<season>/teams/*.csv  (optional manual 5v5 sources)')
          old='CSV_ROOT = ROOT / "local-data" / "hockeystats" / "2025-26" / "teams"'
          new='CSV_ROOT = ROOT / "local-data" / "hockeystats"'
          if old not in s: raise SystemExit('CSV_ROOT anchor missing')
          s=s.replace(old,new,1)
          old2="    files=sorted(CSV_ROOT.glob('*.csv')); inserted=0; matched_files=0; unmatched=[]"
          new2="    files=sorted(CSV_ROOT.glob('*/teams/*.csv')); inserted=0; matched_files=0; unmatched=[]"
          if old2 not in s: raise SystemExit('CSV glob anchor missing')
          s=s.replace(old2,new2,1)
          old3='"game_pk":g[\'game_pk\'],"team_tri":team,"season_id":g[\'season\'],"source":"manual_hockeystats_csv",'
          new3='"game_pk":g[\'game_pk\'],"team_tri":team,"season_id":g[\'season\'],"source":f"manual_hockeystats_csv_{path.parent.parent.name}",'
          if old3 not in s: raise SystemExit('source anchor missing')
          s=s.replace(old3,new3,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile tools/build_local_warehouse.py
          grep -F "glob('*/teams/*.csv')" tools/build_local_warehouse.py
          git diff --check
      - name: Commit
        run: |
          git config user.name 'znamteam-max'
          git config user.email 'znamteam@gmail.com'
          git add tools/build_local_warehouse.py
          git commit -m 'Read HockeyStats CSVs from multiple seasons'
          git push origin HEAD:main
