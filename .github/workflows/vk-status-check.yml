name: Check VK archive status

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vk-status-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch production status
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://hoh-nhl-daily-results.znamteam-903.workers.dev/api/telegram-center-v18/vk'
          echo '=== STATUS ==='
          curl --fail-with-body --retry 3 --retry-delay 2 --max-time 30 "$BASE/status"
          echo
          echo '=== DISCOVERY ==='
          curl --fail-with-body --retry 3 --retry-delay 2 --max-time 60 "$BASE/discovery"
          echo
