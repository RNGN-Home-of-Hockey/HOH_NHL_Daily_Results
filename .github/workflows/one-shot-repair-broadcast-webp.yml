name: One-shot repair broadcast WebP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-repair-broadcast-webp.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Decode existing template with libwebp
        working-directory: vercel-broadcast-renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          webpinfo assets/card-template.webp || true
          dwebp assets/card-template.webp -o /tmp/card-template.png
          file /tmp/card-template.png
          ls -l /tmp/card-template.png
          cwebp -lossless -q 100 /tmp/card-template.png -o /tmp/card-template-fixed.webp
          webpinfo /tmp/card-template-fixed.webp
