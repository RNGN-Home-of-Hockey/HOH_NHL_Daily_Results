name: Stage2 Normalize Legacy Markets

on:
  push:
    paths:
      - '.github/workflows/stage2-normalize-legacy-markets.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Normalize legacy feature market contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-worker/src/feature-market-insights.js')
          s=p.read_text(encoding='utf-8')
          replacements={
            'market: { type: "team_total_2_5", subject: team, side: isOver ? "over" : "under", line: 2.5,': 'market: { type: "team_total", subject: team, side: isOver ? "over" : "under", line: 2.5,',
            'market: { type: "team_total_2_5", subject: team, side: "over", line: 2.5,': 'market: { type: "team_total", subject: team, side: "over", line: 2.5,',
            'market: { type: "game_total_5_5", subject: null, side, line: 5.5,': 'market: { type: "game_total", subject: null, side, line: 5.5,',
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'anchor missing: {old}')
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          node --check cloudflare-worker/src/feature-market-insights.js
          git diff --check
      - name: Verify legacy/new exact-market consolidation
        run: |
          node --input-type=module <<'NODE'
          import { selectInsightPortfolio, exactMarketKey } from './cloudflare-worker/src/insight-portfolio.js';
          const legacy={id:'legacy',category:'feature',score:82,timing:'pregame',kind:'history',title:'legacy',evidence:{sample_size:10},market:{type:'game_total',subject:null,side:'over',line:5.5,label:'ТБ 5.5'}};
          const modern={id:'modern',category:'market_evaluator',score:88,timing:'pregame',kind:'history',title:'modern',evidence:{window:20},market:{type:'game_total',subject:null,side:'over',line:5.5,label:'ТБ 5.5'}};
          if(exactMarketKey(legacy.market)!==exactMarketKey(modern.market)) throw new Error('normalized exact key mismatch');
          const out=selectInsightPortfolio([legacy,modern],12);
          if(out.length!==1) throw new Error(`duplicate exact market survived: ${out.length}`);
          if((out[0].evidence?.independent_support_count||0)!==1) throw new Error('legacy support was not consolidated');
          console.log('LEGACY_MARKET_CONTRACT_OK', out[0].market.label, out[0].score, out[0].evidence.independent_support_count);
          NODE
      - name: Full Worker dry run
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir .stage2-contract-build
          test -d .stage2-contract-build
          echo STAGE2_CONTRACT_WORKER_OK
      - name: Commit normalization
        run: |
          git config user.name 'znamteam-max'
          git config user.email 'znamteam@gmail.com'
          git add cloudflare-worker/src/feature-market-insights.js
          git commit -m 'Normalize legacy feature market contracts'
          git push origin HEAD:main
