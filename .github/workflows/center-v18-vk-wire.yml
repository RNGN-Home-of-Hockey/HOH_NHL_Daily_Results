name: Wire Center V18 VK

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/src/telegram-center-v18-vk-data.js'
      - 'cloudflare-worker/src/telegram-center-v18-vk-ui.js'
      - 'cloudflare-worker/src/telegram-center-vk-maintenance.js'
      - 'migrations/0016_vk_game_broadcasts.sql'
      - '.github/workflows/center-v18-vk-wire.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wire V18 data UI and scheduled sync
        run: |
          python <<'PY'
          from pathlib import Path

          routes=Path('cloudflare-worker/src/team-current-routes.js')
          s=routes.read_text(encoding='utf-8')
          imp_anchor='import { handleTelegramCenterV17Hotfix } from "./telegram-center-v17-hotfix.js";\n'
          imps=(
            'import { handleTelegramCenterV18VkData } from "./telegram-center-v18-vk-data.js";\n'
            'import { handleTelegramCenterV18VkUi } from "./telegram-center-v18-vk-ui.js";\n'
          )
          if 'handleTelegramCenterV18VkData' not in s:
            if imp_anchor not in s: raise RuntimeError('V17 import anchor missing')
            s=s.replace(imp_anchor,imp_anchor+imps,1)

          route_anchor=(
            '  const centerV17HotfixResponse = handleTelegramCenterV17Hotfix(request, path);\n'
            '  if (centerV17HotfixResponse) return centerV17HotfixResponse;\n'
          )
          add=(
            '\n  const centerV18VkDataResponse = await handleTelegramCenterV18VkData(request.clone(), env, path);\n'
            '  if (centerV18VkDataResponse) return centerV18VkDataResponse;\n'
            '  const centerV18VkUiResponse = handleTelegramCenterV18VkUi(request, path);\n'
            '  if (centerV18VkUiResponse) return centerV18VkUiResponse;\n'
          )
          if 'centerV18VkDataResponse' not in s:
            if route_anchor not in s: raise RuntimeError('V17 route anchor missing')
            s=s.replace(route_anchor,route_anchor+add,1)

          if '/telegram-app/v18.js' not in s:
            line='      if (!body.includes(\'/telegram-app/v17.js\')) body = body.replace(\'</body>\', \'<script src="/telegram-app/v17.js"></script></body>\');\n'
            # Existing source uses double-quoted JS strings. Find by content instead of exact quote style.
            lines=s.splitlines(True);inserted=False
            for i,x in enumerate(lines):
              if '/telegram-app/v17.js' in x and 'body.includes' in x:
                indent=x[:len(x)-len(x.lstrip())]
                lines.insert(i+1,indent+'if (!body.includes(\'/telegram-app/v18.js\')) body = body.replace(\'</body>\', \'<script src="/telegram-app/v18.js"></script></body>\');\n')
                inserted=True;break
            if not inserted: raise RuntimeError('V17 HTML injection anchor missing')
            s=''.join(lines)
          routes.write_text(s,encoding='utf-8')

          team=Path('cloudflare-worker/src/telegram-center-v15-team-ui.js')
          t=team.read_text(encoding='utf-8')
          old='return \'<div class="v15Game"><div class="dt">\'+H.esc(timeText(g.scheduled_start_utc))'
          new='return \'<div class="v15Game" data-game="\'+H.esc(g.game_pk||g.id||\'\')+\'"><div class="dt">\'+H.esc(timeText(g.scheduled_start_utc))'
          if 'data-game="\'+H.esc(g.game_pk||g.id' not in t:
            if old not in t: raise RuntimeError('v15 gameCard anchor missing')
            t=t.replace(old,new,1)
          team.write_text(t,encoding='utf-8')

          worker=Path('cloudflare-worker/src/worker-entry.js')
          w=worker.read_text(encoding='utf-8')
          wi='import { runCenterNameMaintenance } from "./telegram-center-name-maintenance.js";\n'
          if 'runVkBroadcastMaintenance' not in w:
            if wi not in w: raise RuntimeError('worker import anchor missing')
            w=w.replace(wi,wi+'import { runVkBroadcastMaintenance } from "./telegram-center-vk-maintenance.js";\n',1)
          # VK maintenance has a dedicated */2 cron branch in worker-entry.js.
          # Do not wire a second copy into the general scheduled branch.
          worker.write_text(w,encoding='utf-8')
          PY
      - name: Verify syntax and wiring
        run: |
          node --check cloudflare-worker/src/telegram-center-v18-vk-data.js
          node --check cloudflare-worker/src/telegram-center-v18-vk-ui.js
          node --check cloudflare-worker/src/telegram-center-vk-maintenance.js
          node --check cloudflare-worker/src/telegram-center-v15-team-ui.js
          node --check cloudflare-worker/src/team-current-routes.js
          node --check cloudflare-worker/src/worker-entry.js
          grep -q 'handleTelegramCenterV18VkData' cloudflare-worker/src/team-current-routes.js
          grep -q '/telegram-app/v18.js' cloudflare-worker/src/team-current-routes.js
          grep -q 'runVkBroadcastMaintenance' cloudflare-worker/src/worker-entry.js
          grep -q 'data-game=' cloudflare-worker/src/telegram-center-v15-team-ui.js
      - name: Worker dry run
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir .validation-build
      - name: Commit wiring safely
        run: |
          if git diff --quiet; then echo "Already wired"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-worker/src/team-current-routes.js cloudflare-worker/src/telegram-center-v15-team-ui.js cloudflare-worker/src/worker-entry.js
          git commit -m "Wire Center V18 VK broadcasts"
          git pull --rebase origin main
          git push
