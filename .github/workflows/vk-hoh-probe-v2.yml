name: Probe HOH VK records v2

on:
  push:
    branches: [main]
    paths:
      - 'tools/probe_vk_hoh_v2.py'
      - '.github/workflows/vk-hoh-probe-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/probe_vk_hoh_v2.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/vk_hoh_probe_v2.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Capture HOH VK records probe v2"
          git push
