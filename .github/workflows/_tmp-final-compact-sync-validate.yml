name: Temporary final compact sync validation
on:
  push:
    paths:
      - '.github/workflows/_tmp-final-compact-sync-validate.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 5.1 parse and contract checks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $files=@('tools\run_compact_snapshot_sync.ps1','tools\upload_compact_snapshots_d1.ps1')
          foreach($f in $files){
            $text=Get-Content $f -Raw
            [void][scriptblock]::Create($text)
            Write-Host "PARSE_OK $f"
          }
          $sync=Get-Content 'tools\run_compact_snapshot_sync.ps1' -Raw
          if($sync -notmatch '2026-09-12T00:05:00Z'){ throw 'quota reset guard missing' }
          if($sync -notmatch "@\('wrangler','deploy'\)"){ throw 'automatic deploy missing' }
          if($sync -notmatch '85000'){ throw 'D1 write safety ceiling missing' }
          Write-Host 'SYNC_CONTRACT_OK'
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Full Worker dry run
        run: |
          node --check cloudflare-worker/src/snapshot-market-context.js
          node --check cloudflare-worker/src/player-market-insights.js
          node --check cloudflare-worker/src/betting-insight-engine.js
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir .final-compact-build
