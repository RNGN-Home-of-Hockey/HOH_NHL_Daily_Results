name: Stage2 Market Evaluator Integration

on:
  push:
    paths:
      - '.github/workflows/stage2-market-evaluator-integration.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Integrate evaluator
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-worker/src/betting-insight-engine.js')
          s=p.read_text(encoding='utf-8')
          imp='import { buildUniversalMarketInsights } from "./universal-market-evaluator.js";\n'
          if imp not in s:
              anchor='import { buildFeatureMarketInsights } from "./feature-market-insights.js";\n'
              if anchor not in s: raise SystemExit('import anchor missing')
              s=s.replace(anchor,anchor+imp,1)
          call='  const universalMarketInsights = await buildUniversalMarketInsights(db, game);\n'
          if call not in s:
              anchor='  const featureInsights = await buildFeatureMarketInsights(db, game);\n'
              if anchor not in s: raise SystemExit('call anchor missing')
              s=s.replace(anchor,anchor+call,1)
          push='  insights.push(...universalMarketInsights);\n'
          if push not in s:
              anchor='  insights.push(...featureInsights);\n'
              if anchor not in s: raise SystemExit('push anchor missing')
              s=s.replace(anchor,push+anchor,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check cloudflare-worker/src/universal-market-evaluator.js
          node --check cloudflare-worker/src/betting-insight-engine.js
          git diff --check
      - name: Pure evaluator tests
        run: |
          node --input-type=module <<'NODE'
          import { evaluateUniversalMarketRows } from './cloudflare-worker/src/universal-market-evaluator.js';

          const game={game_pk:999,away_tri:'CAR',home_tri:'NYR',scheduled_start_utc:'2026-01-01T00:00:00Z'};
          const makeRows=(team,opp,opts={})=>Array.from({length:20},(_,i)=>({
            game_pk:1000+i,
            opponent_tri:opp,
            total_goals: opts.total ?? 7,
            final_goals_for: opts.gf ?? 4,
            final_goals_against: opts.ga ?? 3,
            final_goal_diff: opts.diff ?? 2,
          }));
          const car=makeRows('CAR','NYR',{total:7,gf:4,ga:3,diff:2});
          const nyr=makeRows('NYR','CAR',{total:7,gf:3,ga:4,diff:-1});
          const cards=evaluateUniversalMarketRows(game,{CAR:car,NYR:nyr});
          if(!cards.length) throw new Error('no cards');
          const gameTotal=cards.find(c=>c.market.type==='game_total' && c.market.line===5.5 && c.market.side==='over');
          if(!gameTotal) throw new Error('missing game total 5.5 over');
          if(gameTotal.evidence.window!==20) throw new Error(`expected window 20, got ${gameTotal.evidence.window}`);
          const confluence=cards.find(c=>c.market.type==='team_total' && c.market.subject==='CAR' && c.market.line===2.5 && c.market.side==='over' && c.insight_type.includes('confluence'));
          if(!confluence) throw new Error('missing CAR team-total confluence');
          const handicap=cards.find(c=>c.market.type==='handicap' && c.market.subject==='CAR');
          if(!handicap) throw new Error('missing CAR handicap');
          if(handicap.evidence.window!==20) throw new Error('handicap did not prefer longer stable sample');
          console.log('MARKET_EVALUATOR_OK', cards.map(c=>({market:c.market.label,score:c.score,window:c.evidence.window,type:c.insight_type})));
          NODE
      - name: Commit integration
        run: |
          git config user.name 'znamteam-max'
          git config user.email 'znamteam@gmail.com'
          git add cloudflare-worker/src/betting-insight-engine.js
          if git diff --cached --quiet; then
            echo 'No integration changes needed'
          else
            git commit -m 'Integrate universal market evaluator into betting insights'
            git push origin HEAD:main
          fi
