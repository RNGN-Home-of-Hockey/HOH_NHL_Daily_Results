name: Temporary Broadcast Deploy

on:
  push:
    paths:
      - '.github/workflows/temporary-deploy-broadcast.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo 'CLOUDFLARE_API_TOKEN is not configured in GitHub Actions.'
            exit 2
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '9032ec1bd3cb868d89a38453e4bd1a69'
        run: npx wrangler deploy
