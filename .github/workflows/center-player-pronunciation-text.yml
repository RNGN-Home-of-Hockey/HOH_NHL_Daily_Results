name: Refresh Center player pronunciation text

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/build_center_player_pronunciation_text_from_nhl_pdf.py'
      - '.github/workflows/center-player-pronunciation-text.yml'
  schedule:
    - cron: '37 5 * * 1'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check requests pypdf
      - name: Build official NHL pronunciation text cache
        run: python tools/build_center_player_pronunciation_text_from_nhl_pdf.py --out state/center_player_pronunciation_text_nhl.json
      - name: Validate cache
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('state/center_player_pronunciation_text_nhl.json').read_text(encoding='utf-8'))
          matched=int(p.get('matched') or 0); roster=int(p.get('roster_players') or 0)
          print({'matched':matched,'roster':roster,'unresolved':len(p.get('unresolved') or [])})
          if matched < 500:
              raise SystemExit(f'refusing weak NHL pronunciation text cache: {matched}')
          PY
      - name: Commit refreshed cache
        run: |
          if [ -z "$(git status --porcelain -- state/center_player_pronunciation_text_nhl.json)" ]; then
            echo "No pronunciation text changes"
            exit 0
          fi
          git config user.name "HOH Center Bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/center_player_pronunciation_text_nhl.json
          git commit -m "Refresh official NHL pronunciation text"
          git pull --rebase origin main
          git push origin HEAD:main
