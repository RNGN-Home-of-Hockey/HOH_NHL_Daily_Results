name: Validate HOH product

on:
  pull_request:
    paths:
      - 'nhl_single_result_bot.py'
      - 'ru_full_names.json'
      - '.github/workflows/center-player-meta.yml'
      - '.github/workflows/nhl-single-results.yml'
      - 'cloudflare-worker/**'
      - 'vercel-broadcast-renderer/**'
      - 'migrations/**'
      - 'tools/**'
      - 'tests/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/validate-product.yml'
  push:
    branches: [main]
    paths:
      - 'nhl_single_result_bot.py'
      - 'ru_full_names.json'
      - '.github/workflows/center-player-meta.yml'
      - '.github/workflows/nhl-single-results.yml'
      - 'cloudflare-worker/**'
      - 'vercel-broadcast-renderer/**'
      - 'migrations/**'
      - 'tools/**'
      - 'tests/**'
      - 'state/center_player_pronunciations_eliteprospects.json'
      - 'state/hoh_youtube_media.json'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/validate-product.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-hoh-product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: JavaScript syntax
        run: |
          set -e
          for file in cloudflare-worker/src/*.js tests/*.mjs; do
            node --check "$file"
          done

      - name: Python syntax and rank invariant
        run: |
          python -m pip install --disable-pip-version-check -q requests beautifulsoup4
          python -m py_compile nhl_single_result_bot.py tools/build_center_player_meta_from_sports_ru.py tools/build_compact_snapshots.py tools/build_current_team_snapshots.py tools/build_data_core_meta.py tools/build_center_player_pronunciations_from_eliteprospects.py tools/build_hoh_youtube_media.py tools/analyze_center_player_name_fit.py
          python tests/test_sportsru_name_resolution.py
          python - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          import build_compact_snapshots as compact
          sample = {
              'AAA': {'metric': 9.0},
              'BBB': {'metric': 5.0},
              'CCC': {'metric': 1.0},
          }
          assert compact.ranks(sample, 'metric') == {'AAA': 1, 'BBB': 2, 'CCC': 3}
          assert compact.ranks(sample, 'metric', True) == {'CCC': 1, 'BBB': 2, 'AAA': 3}
          print('RANK_INVARIANT_OK')
          PY

      - name: Migration chain
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          for path in sorted(Path('migrations').glob('*.sql')):
              db.executescript(path.read_text(encoding='utf-8'))
              print('MIGRATION_OK', path.name)
          expected = {
              'pregame_team_snapshots','player_rolling_snapshots','player_opponent_splits',
              'goalie_rolling_snapshots','goalie_opponent_splits','team_current_snapshots',
              'live_notification_cursors','data_core_meta','subscriptions','notification_log',
              'sports_news','sports_news_players','sports_news_comments','sports_player_sources',
              'postgame_ingestion_status','winline_market_lifecycle','broadcast_insight_history'
          }
          got = {r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          missing = expected - got
          assert not missing, missing
          print('MIGRATION_CHAIN_OK')
          PY

      - name: UI route contracts
        run: |
          node --input-type=module <<'JS'
          import { handleTeamCurrentRequest } from './cloudflare-worker/src/team-current-routes.js';
          import { handleTelegramProductBotRequest } from './cloudflare-worker/src/telegram-product-bot.js';
          let r = await handleTeamCurrentRequest(new Request('https://example.test/telegram-app'), {}, '/telegram-app');
          const mini = await r.text();
          for (const needle of ['NHL CENTER','Center подключён','V24.4.1','WINLINE','/api/telegram-center-v7','/telegram-app/v9.css','/telegram-app/v9.js','/telegram-app/v15-core.js','/telegram-app/v15-team.js','/telegram-app/v19.js','/telegram-app/v20.js','/telegram-app/v21.js','/telegram-app/v22.js','/telegram-app/v23-player.js']) {
            if (!r || r.status !== 200 || !mini.includes(needle)) throw new Error('Telegram Center shell missing: '+needle);
          }
          if (!mini.includes('data-tab="follows">Мои</button>')) throw new Error('Center subscription tab contract missing');
          if (mini.includes('<span class="v8">V8</span>')) throw new Error('Telegram Center leaked stale V8 build badge');
          if (!String(r.headers.get('cache-control') || '').includes('no-store')) throw new Error('Telegram Center shell must be no-store');
          if (mini.includes('<script src="/telegram-app/app.js"></script>')) throw new Error('Telegram Center must not depend on cached external app.js');
          for (const asset of ['/telegram-app/v9.js','/telegram-app/v15-core.js','/telegram-app/v15-team.js','/telegram-app/v19.js','/telegram-app/v20.js','/telegram-app/v21.js','/telegram-app/v22.js','/telegram-app/v23-player.js','/telegram-app/v24-visual.js']) {
            const ar = await handleTeamCurrentRequest(new Request('https://example.test'+asset), {}, asset);
            if (!ar || ar.status !== 200) throw new Error('Center browser asset route failed: '+asset);
            const js = await ar.text();
            try { new Function(js); } catch (e) { throw new Error('Center browser asset syntax invalid '+asset+': '+e.message); }
          }
          r = await handleTeamCurrentRequest(new Request('https://example.test/telegram-app/v9.css'), {}, '/telegram-app/v9.css');
          if (!r || r.status !== 200 || !(await r.text()).includes('.monthModal')) throw new Error('Center V9 CSS route failed');
          r = await handleTeamCurrentRequest(new Request('https://example.test/telegram-app/v9.js'), {}, '/telegram-app/v9.js');
          if (!r || r.status !== 200 || !(await r.text()).includes('openMonthCalendar')) throw new Error('Center V9 JS route failed');
          r = await handleTeamCurrentRequest(new Request('https://example.test/telegram-app/v9-polish.js'), {}, '/telegram-app/v9-polish.js');
          const polish = await r.text();
          if (!r || r.status !== 200 || !polish.includes('fixMine') || !polish.includes('fixProfile')) throw new Error('Center V9 polish route failed');
          r = await handleTeamCurrentRequest(new Request('https://example.test/telegram-app/v11.js'), {}, '/telegram-app/v11.js');
          const v11 = await r.text();
          if (!r || r.status !== 200 || !v11.includes('v11Audio') || !v11.includes('hoh-center-v11-expanded-subscriptions')) throw new Error('Center V11 UI route failed');
          r = await handleTeamCurrentRequest(new Request('https://example.test/api/telegram-center-v11/pronunciation/8478864'), {}, '/api/telegram-center-v11/pronunciation/8478864');
          const kaprizovAudio = await r.json();
          if (!r || r.status !== 200 || !kaprizovAudio.available || kaprizovAudio.source !== 'eliteprospects_player_audio' || !String(kaprizovAudio.audio_url||'').includes('kirill_kaprizov.mp3')) throw new Error('Kaprizov Elite Prospects audio contract failed');
          r = await handleTeamCurrentRequest(new Request('https://example.test/telegram-app/v12.js'), {}, '/telegram-app/v12.js');
          const v12 = await r.text();
          for (const needle of ['v12PhotoBadge','v12Audio','installSeasons','место\\s+обновится','/api/telegram-center-v12']) if (!r || r.status !== 200 || !v12.includes(needle)) throw new Error('Center V12 UI missing: '+needle);
          r = await handleTeamCurrentRequest(new Request('https://example.test/api/telegram-center-v12/media'), {}, '/api/telegram-center-v12/media');
          const media = await r.json();
          if (!r || r.status !== 200 || !media.configured || !Array.isArray(media.items) || media.items.length !== 3) throw new Error('Center V12 media route failed');
          if (media.items.filter(x=>x.kind==='short').length !== 2 || media.items.filter(x=>x.kind==='news').length !== 1) throw new Error('Center V12 media mix failed');
          if (!media.items.every(x=>String(x.url||'').startsWith('https://www.youtube.com/') && String(x.thumb||'').startsWith('https://'))) throw new Error('Center V12 media links failed');
          r = await handleTeamCurrentRequest(new Request('https://example.test/telegram-app/v19.js'), {}, '/telegram-app/v19.js');
          const v19 = await r.text();
          for (const needle of ['openBroadcasts','v19Audio','aspect-ratio:16/9','historical_pregame','v19Country']) {
            if (!r || r.status !== 200 || !v19.includes(needle)) throw new Error('Center V19 UI missing: '+needle);
          }
          if (v19.includes('new MutationObserver')) throw new Error('V19 authoritative UI must not add a MutationObserver layer');
          r = await handleTeamCurrentRequest(new Request('https://example.test/telegram-app/v20.js'), {}, '/telegram-app/v20.js');
          const v20 = await r.text();
          for (const needle of ['СВЕЖЕЕ В НХЛ','v20PlayerNews','v20CommentSend','/api/telegram-center-v20']) {
            if (!r || r.status !== 200 || !v20.includes(needle)) throw new Error('Center V20 UI missing: '+needle);
          }
          if (v20.includes('sports.ru/')) throw new Error('V20 UI must not expose Sports.ru links');
          r = await handleTeamCurrentRequest(new Request('https://example.test/telegram-app/game-follow.js'), {}, '/telegram-app/game-follow.js');
          if (!r || r.status !== 200 || !(await r.text()).includes('gameFollowEnhancer')) throw new Error('Game-follow JS route failed');
          r = await handleTeamCurrentRequest(new Request('https://example.test/telegram-app/preferences.js'), {}, '/telegram-app/preferences.js');
          if (!r || r.status !== 200 || !(await r.text()).includes('notificationPreferencesEnhancer')) throw new Error('Notification preferences JS route failed');
          r = await handleTeamCurrentRequest(new Request('https://example.test/telegram-app/matchup.js'), {}, '/telegram-app/matchup.js');
          if (!r || r.status !== 200 || !(await r.text()).includes('telegramMatchupPreview')) throw new Error('Telegram Matchup preview JS route failed');
          r = await handleTeamCurrentRequest(new Request('https://example.test/teams'), {}, '/teams');
          if (!r || r.status !== 200 || !(await r.text()).includes('Team Center')) throw new Error('Team Center shell failed');
          r = await handleTeamCurrentRequest(new Request('https://example.test/control'), {}, '/control');
          if (!r || r.status !== 200 || !(await r.text()).includes('HOH NHL Control Center')) throw new Error('Control Center v2 shell failed');
          r = await handleTeamCurrentRequest(new Request('https://example.test/matchup'), {}, '/matchup');
          if (!r || r.status !== 200 || !(await r.text()).includes('MATCHUP LAB')) throw new Error('Matchup Lab shell failed');
          r = await handleTeamCurrentRequest(new Request('https://example.test/broadcast/operator'), {}, '/broadcast/operator');
          if (!r || r.status !== 200 || !(await r.text()).includes('BROADCAST OPERATOR')) throw new Error('Broadcast Operator shell failed');
          r = await handleTeamCurrentRequest(new Request('https://example.test/broadcast/overlay'), {}, '/broadcast/overlay');
          if (!r || r.status !== 200 || !(await r.text()).includes('HOME OF HOCKEY × WINLINE')) throw new Error('Broadcast overlay shell failed');
          const secret = 'test-secret';
          const req = new Request('https://example.test/api/telegram', {
            method:'POST',
            headers:{'x-telegram-bot-api-secret-token':secret,'content-type':'application/json'},
            body:JSON.stringify({message:{chat:{id:-100,type:'supergroup'},text:'/start'}}),
          });
          const delegated = await handleTelegramProductBotRequest(req,{TELEGRAM_WEBHOOK_VERIFY_SECRET:secret},'/api/telegram');
          if (delegated !== null) throw new Error('Group Telegram update was intercepted');
          console.log('ROUTE_CONTRACTS_OK');
          JS

      - name: Kaprizov historical season smoke
        run: |
          node --input-type=module <<'JS'
          import { handleTeamCurrentRequest } from './cloudflare-worker/src/team-current-routes.js';
          const call = async path => {
            let last;
            for (let i=0;i<3;i++) {
              const r=await handleTeamCurrentRequest(new Request('https://example.test'+path), {}, path);
              const d=await r.json().catch(()=>({}));
              if (r.ok) return d;
              last=new Error(JSON.stringify(d));
              await new Promise(res=>setTimeout(res,500*(i+1)));
            }
            throw last;
          };
          const seasons=await call('/api/telegram-center-v12/players/8478864/seasons');
          if (!(seasons.seasons||[]).some(x=>x.season_id==='20252026')) throw new Error('Kaprizov 2025/26 season missing');
          const prev=await call('/api/telegram-center-v12/players/8478864/season/20252026');
          if (!prev.stats || Number(prev.stats.games_played||0)<1 || Number(prev.stats.points||0)<1) throw new Error('Kaprizov historical stats missing');
          if (!/^[A-Z]{3}$/.test(String(prev.team_tri||''))) throw new Error('Kaprizov historical team missing');
          console.log('KAPRIZOV_HISTORY_OK', prev.season, prev.team_tri, prev.stats);
          JS

      - name: Telegram notification rules
        run: |
          node tests/validate_notification_engine.mjs
          node tests/validate_game_subscription.mjs
          node tests/validate_mini_app_subscriptions.mjs

      - name: Market line evaluator
        run: |
          node tests/validate_market_line_evaluator.mjs
          node tests/validate_universal_market_evaluator.mjs
          node tests/validate_winline_broadcast_mapping.mjs

      - name: Broadcast renderer
        working-directory: vercel-broadcast-renderer
        run: |
          python3 -m pip install --quiet fonttools
          curl -fsSL --retry 3 --retry-delay 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/sofiasanscondensed/SofiaSansCondensed-Italic%5Bwght%5D.ttf' -o /tmp/sofia-sans-condensed-variable.ttf
          python3 -m fontTools.varLib.instancer /tmp/sofia-sans-condensed-variable.ttf wght=700 --output assets/sofia-sans-condensed-italic.ttf
          test -s assets/sofia-sans-condensed-italic.ttf
          file assets/sofia-sans-condensed-italic.ttf
          npm install --no-audit --no-fund
          npm test

      - name: Broadcast Operator safety
        run: |
          node tests/validate_broadcast_operator.mjs
          node tests/validate_broadcast_operator_leases.mjs
          node tests/validate_broadcast_air_score.mjs
          node tests/validate_broadcast_value_score_v2.mjs
          node tests/validate_broadcast_multi_match_state.mjs
          node tests/validate_broadcast_operator_actions.mjs
          node tests/validate_broadcast_queue_summary.mjs
          node tests/validate_market_combination_engine.mjs
          node tests/validate_market_coverage_audit.mjs
          node tests/validate_provider_market_history.mjs
          node tests/validate_broadcast_angle_engine.mjs
          node tests/validate_broadcast_four_cards.mjs
          node tests/validate_h2h_current_line_broadcast.mjs
          node tests/validate_winline_live_feed.mjs
          node tests/validate_live_market_enrichment.mjs
          node tests/validate_advanced_team_snapshot_insights.mjs
          node tests/validate_advanced_winline_link.mjs
          node tests/validate_broadcast_priced_merge.mjs
          node tests/validate_period_market_insights.mjs
          node tests/validate_advanced_rolling_venue.mjs
          node tests/validate_postgame_finalizer.mjs
          node tests/validate_broadcast_insight_history.mjs
          python tests/validate_team_current_snapshot_refresh.py

      - name: Worker dry run
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir .validation-build
