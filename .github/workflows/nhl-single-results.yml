name: NHL Single Result Bot

on:
  repository_dispatch:
    types:
      - nhl_poll
      - resend_last_day
  workflow_dispatch:
    inputs:
      gamepk:
        description: "Specific NHL gamePk"
        required: false
        default: ""
      date:
        description: "Date in YYYY-MM-DD for autopost/search"
        required: false
        default: ""
      match:
        description: "Matchup, e.g. PIT@WPG or WPG-PIT"
        required: false
        default: ""
      resend_last_day:
        description: "Set to true to resend the latest final hockey day"
        required: false
        default: "false"
      full_day:
        description: "Send all completed games for TARGET_DATE"
        required: false
        default: "false"
      target_chat_id:
        description: "Override Telegram chat for an interactive response"
        required: false
        default: ""
      target_thread_id:
        description: "Override Telegram thread for an interactive response"
        required: false
        default: ""
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: nhl-single-results-${{ github.ref }}
  cancel-in-progress: false

env:
  BOT_STATE_PATH: state/github_actions_posted_games.json

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Build env vars
        env:
          INPUT_GAMEPK: ${{ github.event.inputs.gamepk || github.event.client_payload.gamepk }}
          INPUT_DATE: ${{ github.event.inputs.date || github.event.client_payload.date }}
          INPUT_MATCH: ${{ github.event.inputs.match || github.event.client_payload.match }}
          INPUT_RESEND_LAST_DAY: ${{ github.event.inputs.resend_last_day || github.event.client_payload.resend_last_day }}
          INPUT_FULL_DAY: ${{ github.event.inputs.full_day || github.event.client_payload.full_day }}
          INPUT_TARGET_CHAT_ID: ${{ github.event.inputs.target_chat_id || github.event.client_payload.target_chat_id }}
          INPUT_TARGET_THREAD_ID: ${{ github.event.inputs.target_thread_id || github.event.client_payload.target_thread_id }}
        run: |
          python - << 'PY'
          import os, re

          gp = (os.getenv("INPUT_GAMEPK") or "").strip()
          dt = (os.getenv("INPUT_DATE") or "").strip()
          mt = (os.getenv("INPUT_MATCH") or "").strip()
          resend = (os.getenv("INPUT_RESEND_LAST_DAY") or "").strip()
          full_day = (os.getenv("INPUT_FULL_DAY") or "").strip()
          target_chat = (os.getenv("INPUT_TARGET_CHAT_ID") or "").strip()
          target_thread = (os.getenv("INPUT_TARGET_THREAD_ID") or "").strip()

          q = ""
          if not gp and dt and mt:
              def tri(s):
                  return re.sub(r"\s+", "", s).upper()

              home = away = ""
              if "@" in mt:
                  away, home = [tri(x) for x in mt.split("@", 1)]
              elif "-" in mt:
                  left, right = [tri(x) for x in mt.split("-", 1)]
                  home, away = left, right

              if home and away:
                  q = f"{dt} {home} - {away}"

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"GAME_PK={gp}\n")
              fh.write(f"GAME_QUERY={q}\n")
              fh.write(f"TARGET_DATE={dt}\n")
              fh.write(f"RESEND_LAST_DAY={resend}\n")
              fh.write(f"FULL_DAY_MENU={full_day}\n")
              fh.write(f"TARGET_CHAT_ID={target_chat}\n")
              fh.write(f"TARGET_THREAD_ID={target_thread}\n")

          print("GAME_PK:", gp or "(empty)")
          print("GAME_QUERY:", q or "(empty)")
          print("TARGET_DATE:", dt or "(empty)")
          print("RESEND_LAST_DAY:", resend or "(empty)")
          print("FULL_DAY_MENU:", full_day or "(empty)")
          print("TARGET_CHAT_ID:", target_chat or "(default)")
          print("TARGET_THREAD_ID:", target_thread or "(default)")
          PY

      - name: Init state
        run: |
          mkdir -p state
          [ -f "$BOT_STATE_PATH" ] || echo '{"posted":{}}' > "$BOT_STATE_PATH"
          cat "$BOT_STATE_PATH"

      - name: Compile bot
        run: python -m py_compile nhl_single_result_bot.py

      - name: Run bot
        env:
          GAME_PK: ${{ env.GAME_PK }}
          GAME_QUERY: ${{ env.GAME_QUERY }}
          TARGET_DATE: ${{ env.TARGET_DATE }}
          RESEND_LAST_DAY: ${{ env.RESEND_LAST_DAY }}
          FULL_DAY_MENU: ${{ env.FULL_DAY_MENU }}
          STATE_PATH: ${{ env.BOT_STATE_PATH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ env.TARGET_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ env.TARGET_THREAD_ID || secrets.TELEGRAM_THREAD_ID }}
          TELEGRAM_INTERACTIVE_ENABLED: 0
          HOH_CHANNEL_URL: http://t.me/home_of_hockey
          DEBUG_VERBOSE: 1
        run: python nhl_single_result_bot.py

      - name: Show state
        run: |
          git status --porcelain
          echo "--- state file ---"
          cat "$BOT_STATE_PATH" || true

      - name: Commit state
        run: |
          set -e

          if ! git status --porcelain -- "$BOT_STATE_PATH" | grep . >/dev/null; then
            echo "No state changes"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="${GITHUB_REF_NAME:-main}"

          git add -f "$BOT_STATE_PATH"
          git commit -m "Update posted games state" || exit 0

          git fetch origin "$BRANCH" || true
          git pull --rebase origin "$BRANCH" || true
          git push origin "HEAD:$BRANCH"
