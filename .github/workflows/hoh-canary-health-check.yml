name: HOH Canary Health Check

on:
  push:
    paths:
      - '.github/workflows/hoh-canary-health-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check root health
        run: |
          set -euo pipefail
          echo 'ROOT:'
          curl --fail --silent --show-error --max-time 20 'https://hoh-nhl-daily-results.znamteam-903.workers.dev/'
          echo
      - name: Check Data Core health
        run: |
          set -euo pipefail
          echo 'DATA_CORE:'
          curl --fail --silent --show-error --max-time 20 'https://hoh-nhl-daily-results.znamteam-903.workers.dev/api/data-core/health'
          echo
