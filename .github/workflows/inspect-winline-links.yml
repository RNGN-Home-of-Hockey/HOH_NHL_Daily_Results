name: Inspect Winline Links

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-winline-links.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '9032ec1bd3cb868d89a38453e4bd1a69' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Inspect D1 Winline deeplinks
        run: |
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT we.game_pk,we.winline_event_id,we.starts_at,we.deeplink,
                   g.home_tri,g.away_tri,g.game_state
            FROM winline_events we JOIN games g ON g.game_pk=we.game_pk
            ORDER BY we.starts_at ASC LIMIT 8;
          "
      - name: Verify production affiliate router
        shell: bash
        run: |
          set -euo pipefail
          FUTURE='https://hoh-nhl-daily-results.znamteam-903.workers.dev/go/winline?game_pk=2026020001'
          HIST='https://hoh-nhl-daily-results.znamteam-903.workers.dev/go/winline?game_pk=2024030116'
          echo '--- future route ---'
          FH="$(curl -sS -D - -o /dev/null --max-time 15 "$FUTURE")"
          echo "$FH" | grep -Ei '^(HTTP/|location:)'
          FL="$(printf '%s\n' "$FH" | awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/\r$/,"");sub(/^[Ll]ocation:[[:space:]]*/,"");print;exit}')"
          [[ "$FL" == *"/plus/16255232"* ]] || { echo "future route missing event deeplink"; exit 1; }
          [[ "$FL" == *"statid=2558_"* ]] || { echo "future route missing statid"; exit 1; }
          [[ "$FL" == *"sub4=nhl"* ]] || { echo "future route missing sub4"; exit 1; }
          [[ "$FL" == *"promocode=NHL"* ]] || { echo "future route missing promo"; exit 1; }
          [[ "$FL" == *"clickid="* ]] || { echo "future route missing clickid"; exit 1; }

          echo '--- historical route ---'
          HH="$(curl -sS -D - -o /dev/null --max-time 15 "$HIST")"
          echo "$HH" | grep -Ei '^(HTTP/|location:)'
          HL="$(printf '%s\n' "$HH" | awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/\r$/,"");sub(/^[Ll]ocation:[[:space:]]*/,"");print;exit}')"
          [[ "$HL" == *"/stavki/sport/xokkej/ssha/nhl"* ]] || { echo "historical route missing NHL section"; exit 1; }
          [[ "$HL" == *"statid=2558_"* ]] || { echo "historical route missing statid"; exit 1; }
          [[ "$HL" == *"sub4=nhl"* ]] || { echo "historical route missing sub4"; exit 1; }
          [[ "$HL" == *"promocode=NHL"* ]] || { echo "historical route missing promo"; exit 1; }
          [[ "$HL" == *"clickid="* ]] || { echo "historical route missing clickid"; exit 1; }

      - name: Inspect affiliate redirect
        shell: bash
        run: |
          set +e
          echo '--- affiliate headers ---'
          curl -sS -D - -o /dev/null --max-time 15 'https://p.winline.ru/s/hSJPscomBm?statid=2558_&sub4=nhl&promocode=NHL' | sed -n '1,40p'
          echo '--- affiliate redirect chain ---'
          curl -sS -L -D - -o /dev/null --max-time 20 'https://p.winline.ru/s/hSJPscomBm?statid=2558_&sub4=nhl&promocode=NHL' | grep -Ei '^(HTTP/|location:)' | head -30
          exit 0
