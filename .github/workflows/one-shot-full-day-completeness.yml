name: One-shot full-day completeness smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-full-day-completeness.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - name: Build full day
        env:
          FULL_DAY_MENU: "1"
          TARGET_DATE: "2026-09-20"
          DRY_RUN: "1"
          DEBUG_VERBOSE: "0"
          SPORTSRU_ON_DEMAND_ENABLED: "1"
          TELEGRAM_INTERACTIVE_ENABLED: "0"
        run: |
          start=$(date +%s)
          python nhl_single_result_bot.py
          end=$(date +%s)
          echo "FULL_DAY_SECONDS=$((end-start))"
          echo "FULL_DAY_COMPLETENESS_SMOKE_OK"
