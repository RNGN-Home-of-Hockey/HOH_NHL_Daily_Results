name: Compact Broadcast Cards

on:
  push:
    paths:
      - '.github/workflows/compact-broadcast-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python scripts/patch_compact_cards.py
      - name: Validate
        run: |
          node --check cloudflare-worker/src/winline-logo.js
          node --check cloudflare-worker/src/broadcast-dashboard-v2.js
          node --check cloudflare-worker/src/worker-entry.js
          node --input-type=module <<'NODE'
          import { handleBroadcastRequest } from './cloudflare-worker/src/broadcast-dashboard-v2.js';
          import fs from 'node:fs';
          const logo = await handleBroadcastRequest(new Request('https://example.test/broadcast/winline-logo.png'), {}, '/broadcast/winline-logo.png');
          if (!logo || logo.status !== 200 || logo.headers.get('content-type') !== 'image/png') throw new Error('logo route failed');
          const b = new Uint8Array(await logo.arrayBuffer());
          if (b.length < 1000 || b[0] !== 0x89 || b[1] !== 0x50 || b[2] !== 0x4e || b[3] !== 0x47) throw new Error('logo bytes invalid');
          const app = await handleBroadcastRequest(new Request('https://example.test/broadcast/app.js'), {}, '/broadcast/app.js');
          const js = await app.text();
          fs.writeFileSync('/tmp/broadcast-app.js', js);
          const html = await handleBroadcastRequest(new Request('https://example.test/broadcast'), {}, '/broadcast');
          const h = await html.text();
          if (!h.includes('id="previewcard"') || !h.includes('Compact 1920x1080 broadcast-card language')) throw new Error('compact UI missing');
          console.log('LOGO_BYTES', b.length, 'APP_BYTES', js.length, 'HTML_BYTES', h.length);
          NODE
          node --check /tmp/broadcast-app.js
          git diff --check
      - name: Commit
        run: |
          git config user.name 'znamteam-max'
          git config user.email 'znamteam@gmail.com'
          git add cloudflare-worker/src/broadcast-dashboard-v2.js
          git commit -m 'Compact Winline broadcast cards for 1080p overlays'
          git push origin HEAD:main
