name: Probe NBA Data Game Detail

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-nba-data-gamedetail.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Probe legacy NBA player directories and rosters
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          headers={'User-Agent':'Mozilla/5.0','Accept':'application/json','Referer':'https://www.nba.com/'}
          urls=[
            'https://data.nba.com/data/10s/v2015/json/mobile_teams/nba/2025/players/00_player_info.json',
            'https://data.nba.com/data/v2015/json/mobile_teams/nba/2025/players/00_player_info.json',
            'https://data.nba.com/data/10s/v2015/json/mobile_teams/nba/2021/players/00_player_info.json',
            'https://data.nba.com/data/10s/v2015/json/mobile_teams/nba/2025/teams/thunder_roster.json',
            'https://data.nba.com/data/10s/v2015/json/mobile_teams/nba/2025/teams/rockets_roster.json',
          ]
          useful=0
          for url in urls:
            print('\nURL',url,flush=True)
            try:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                raw=r.read()
              p=json.loads(raw.decode('utf-8-sig'))
              print('status=200 bytes=',len(raw),'keys=',list(p)[:15],flush=True)
              candidates=[]
              for path in [('pls','pl'),('t','pl')]:
                cur=p
                for key in path:
                  cur=cur.get(key) if isinstance(cur,dict) else None
                if isinstance(cur,list): candidates=cur; break
              if not candidates:
                for key in ('pl','players'):
                  if isinstance(p.get(key),list): candidates=p[key]; break
              print('players=',len(candidates),flush=True)
              if candidates:
                print('sample=',candidates[0],flush=True)
                print('sample_keys=',list(candidates[0])[:80],flush=True)
                useful += 1
            except Exception as e:
              print(type(e).__name__,repr(e),flush=True)
          if useful == 0:
            raise SystemExit('No official legacy NBA player directory/roster worked')
          PY
