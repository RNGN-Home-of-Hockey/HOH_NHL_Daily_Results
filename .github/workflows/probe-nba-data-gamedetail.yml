name: Probe NBA Data Game Detail

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-nba-data-gamedetail.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Probe api.nba.com mobilefeed
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          headers={'User-Agent':'Mozilla/5.0','Accept':'application/json','Referer':'https://www.nba.com/'}
          urls=[
            'https://api.nba.com/v0/api/mobilefeed/nba/2025/scores/gamedetail/0022500001_gamedetail.json',
            'https://api.nba.com/v0/api/mobilefeed/nba/2025/league/00_full_schedule.json',
            'https://api.nba.com/v0/api/mobilefeed/nba/2021/scores/gamedetail/0022100773_gamedetail.json',
            'https://api.nba.com/v0/api/mobilefeed/nba/2024/scores/gamedetail/0022400061_gamedetail.json',
          ]
          working=0
          for url in urls:
            print('\nURL',url,flush=True)
            try:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                raw=r.read()
              p=json.loads(raw.decode('utf-8-sig'))
              print('status=200 bytes=',len(raw),'keys=',list(p)[:10],flush=True)
              data=p.get('data') if isinstance(p.get('data'),dict) else p
              if 'gamedetail' in url:
                g=(data or {}).get('g') or data or {}; h=g.get('hls') or {}; v=g.get('vls') or {}
                print('gid=',g.get('gid'),'status=',g.get('st'),g.get('stt'),'home=',h.get('ta'),'score=',h.get('s'),'players=',len(h.get('pstsg') or []),'away=',v.get('ta'),'score=',v.get('s'),'players=',len(v.get('pstsg') or []),flush=True)
                if h.get('pstsg') and v.get('pstsg'): working += 1
              else:
                root=data or {}; games=[]
                for x in root.get('lscd') or []:
                  games.extend((x.get('mscd') or {}).get('g') or [])
                finals=[g for g in games if str(g.get('st'))=='3' or 'final' in str(g.get('stt') or '').lower()]
                print('schedule_games=',len(games),'finals=',len(finals),'regular_finals=',sum(1 for g in finals if str(g.get('gid') or '').startswith('002')),flush=True)
                if any(str(g.get('gid') or '').startswith('002') for g in finals): working += 1
            except Exception as e:
              print(type(e).__name__,repr(e),flush=True)
          if working == 0:
            raise SystemExit('api.nba.com mobilefeed not usable from runner')
          PY
