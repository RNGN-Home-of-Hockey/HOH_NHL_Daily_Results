name: Probe NBA Data Game Detail

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-nba-data-gamedetail.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Probe ESPN scoreboard limits and adjacent NBA directory
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'}
          urls=[
            'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=20211101',
            'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=20211101&limit=100',
            'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=20251105',
            'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=20251105&limit=100',
            'https://data.nba.com/data/10s/v2015/json/mobile_teams/nba/2026/players/00_player_info.json',
          ]
          for url in urls:
            print('\nURL',url,flush=True)
            try:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                raw=r.read()
              p=json.loads(raw.decode('utf-8-sig'))
              print('status=200 bytes=',len(raw),'keys=',list(p)[:15],flush=True)
              if 'scoreboard' in url:
                ev=p.get('events') or []
                print('events=',len(ev),'ids=',[(e.get('id'),e.get('name')) for e in ev],flush=True)
              else:
                rows=((p.get('pls') or {}).get('pl') or [])
                print('players=',len(rows),flush=True)
                needles=['Edgecombe','Richardson','Jarreau','Pedulla','Malachi Smith','Antetokounmpo','Trevon Scott','Boeheim','Grant Nelson','Sandfort','Okani','Jayson Kent','Williamson']
                for needle in needles:
                  hits=[]
                  for x in rows:
                    full=(str(x.get('fn') or '')+' '+str(x.get('ln') or '')).strip()
                    if needle.lower() in full.lower(): hits.append((full,x.get('pid'),x.get('ta'),x.get('s')))
                  if hits: print(needle,hits,flush=True)
            except Exception as e:
              print(type(e).__name__,repr(e),flush=True)
          PY
