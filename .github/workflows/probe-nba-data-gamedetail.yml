name: Probe NBA Data Game Detail

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-nba-data-gamedetail.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Probe 2025 NBA feed variants
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          headers={'User-Agent':'Mozilla/5.0','Accept':'application/json','Referer':'https://www.nba.com/'}
          urls=[
            'https://data.nba.com/data/10s/v2015/json/mobile_teams/nba/2025/scores/gamedetail/0022500001_gamedetail.json',
            'https://data.nba.com/data/v2015/json/mobile_teams/nba/2025/scores/gamedetail/0022500001_gamedetail.json',
            'https://data.nba.com/data/10s/v2022/json/mobile_teams/nba/2025/scores/gamedetail/0022500001_gamedetail.json',
            'https://data.nba.com/data/v2022/json/mobile_teams/nba/2025/scores/gamedetail/0022500001_gamedetail.json',
            'https://data.nba.com/data/10s/v2022/json/mobile_teams/nba/2025/league/00_full_schedule.json',
            'https://data.nba.com/data/v2022/json/mobile_teams/nba/2025/league/00_full_schedule.json',
          ]
          for url in urls:
            print('\nURL',url,flush=True)
            try:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as r:
                raw=r.read()
              p=json.loads(raw.decode('utf-8-sig'))
              print('status=200 bytes=',len(raw),'keys=',list(p)[:10],flush=True)
              if 'gamedetail' in url:
                g=p.get('g') or p.get('gs') or {}; h=g.get('hls') or {}; v=g.get('vls') or {}
                print('gid=',g.get('gid'),'status=',g.get('st'),g.get('stt'),'home=',h.get('ta'),'score=',h.get('s'),'players=',len(h.get('pstsg') or []),'away=',v.get('ta'),'score=',v.get('s'),'players=',len(v.get('pstsg') or []),flush=True)
                if h.get('pstsg'):
                  print('player_keys=',list(h['pstsg'][0].keys())[:50],flush=True)
              else:
                games=[]
                for x in p.get('lscd') or []:
                  games.extend((x.get('mscd') or {}).get('g') or [])
                finals=[g for g in games if str(g.get('st'))=='3' or 'final' in str(g.get('stt') or '').lower()]
                print('schedule_games=',len(games),'finals=',len(finals),'regular_finals=',sum(1 for g in finals if str(g.get('gid') or '').startswith('002')),flush=True)
            except Exception as e:
              print(type(e).__name__,repr(e),flush=True)
          PY
