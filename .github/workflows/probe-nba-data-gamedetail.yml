name: Probe NBA Data Game Detail

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-nba-data-gamedetail.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Confirm ESPN play-in schedule coverage
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'}
          for team in ('cle','bkn','atl','lac'):
            url=f'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams/{team}/schedule?season=2022&seasontype=3'
            print('\n',url,flush=True)
            with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r: p=json.load(r)
            ev=p.get('events') or []
            print('events=',len(ev),[(e.get('id'),e.get('date'),e.get('name')) for e in ev[:8]],flush=True)
          PY
