name: Probe NBA Data Game Detail

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-nba-data-gamedetail.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Probe ESPN team season schedules
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'}
          urls=[
            'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams/bos/schedule?season=2022',
            'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams/bos/schedule?season=2022&seasontype=2',
            'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams/bos/schedule?season=2026',
            'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams/phi/schedule?season=2026',
          ]
          for url in urls:
            print('\nURL',url,flush=True)
            try:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: raw=r.read()
              p=json.loads(raw.decode('utf-8-sig')); ev=p.get('events') or []
              print('status=200 bytes=',len(raw),'events=',len(ev),'keys=',list(p)[:20],flush=True)
              states={}
              for e in ev:
                st=(((e.get('competitions') or [{}])[0].get('status') or {}).get('type') or {}).get('state') or ((e.get('status') or {}).get('type') or {}).get('state')
                states[st]=states.get(st,0)+1
              print('states=',states,flush=True)
              print('first=',[(e.get('id'),e.get('date'),e.get('name')) for e in ev[:3]],flush=True)
              print('last=',[(e.get('id'),e.get('date'),e.get('name')) for e in ev[-3:]],flush=True)
            except Exception as e: print(type(e).__name__,repr(e),flush=True)
          PY
