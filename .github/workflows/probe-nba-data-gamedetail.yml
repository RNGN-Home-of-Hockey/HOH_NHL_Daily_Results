name: Probe NBA Data Game Detail

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-nba-data-gamedetail.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Probe ESPN summary score structure
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'}
          for eid in ('401358773','401809936'):
            url=f'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event={eid}'
            with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r: p=json.load(r)
            print('\nEVENT',eid,flush=True)
            comps=((p.get('header') or {}).get('competitions') or [])
            print('header_comp_count',len(comps),flush=True)
            if comps:
              for c in comps[0].get('competitors') or []:
                print('competitor',json.dumps(c,ensure_ascii=False)[:4000],flush=True)
            print('box teams',json.dumps((p.get('boxscore') or {}).get('teams') or [],ensure_ascii=False)[:5000],flush=True)
          PY
