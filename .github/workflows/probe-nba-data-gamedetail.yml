name: Probe NBA Data Game Detail

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-nba-data-gamedetail.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Probe compact ESPN final score fields
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'}
          for eid in ('401358773','401809936'):
            url=f'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event={eid}'
            with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r: p=json.load(r)
            print('EVENT',eid,flush=True)
            comps=((p.get('header') or {}).get('competitions') or [])
            for c in (comps[0].get('competitors') if comps else []) or []:
              print({
                'homeAway':c.get('homeAway'),
                'abbr':(c.get('team') or {}).get('abbreviation'),
                'score':c.get('score'),
                'score_type':type(c.get('score')).__name__,
                'winner':c.get('winner'),
              },flush=True)
          PY
