name: Refresh Elite Prospects player pronunciation audio

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/build_center_player_pronunciations_from_eliteprospects.py'
      - '.github/workflows/center-player-pronunciation-eliteprospects.yml'
  schedule:
    - cron: '41 5 * * 1'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Build verified Elite Prospects audio cache
        run: python tools/build_center_player_pronunciations_from_eliteprospects.py --workers 24 --out state/center_player_pronunciations_eliteprospects.json
      - name: Validate cache
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('state/center_player_pronunciations_eliteprospects.json').read_text(encoding='utf-8'))
          matched=int(p.get('matched') or 0); roster=int(p.get('roster_players') or 0)
          print({'matched':matched,'roster':roster})
          if roster < 500:
              raise SystemExit('unexpectedly small NHL roster pool')
          if matched < 25:
              raise SystemExit(f'Elite Prospects audio cache unexpectedly weak: {matched}')
          for row in (p.get('players') or {}).values():
              u=str(row.get('pronunciation_url') or '')
              if not u.startswith('https://files.eliteprospects.com/layout/player_audio/') or not u.endswith('.mp3'):
                  raise SystemExit('invalid Elite Prospects pronunciation URL')
          PY
      - name: Commit refreshed cache
        run: |
          if [ -z "$(git status --porcelain -- state/center_player_pronunciations_eliteprospects.json)" ]; then
            echo "No Elite Prospects pronunciation changes"
            exit 0
          fi
          git config user.name "HOH Center Bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/center_player_pronunciations_eliteprospects.json
          git commit -m "Refresh Elite Prospects player pronunciations"
          git pull --rebase origin main
          git push origin HEAD:main
