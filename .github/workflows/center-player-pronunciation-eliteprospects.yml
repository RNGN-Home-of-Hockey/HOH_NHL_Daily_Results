name: Refresh Elite Prospects player pronunciation audio

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/build_center_player_pronunciations_from_eliteprospects.py'
      - '.github/workflows/center-player-pronunciation-eliteprospects.yml'
  push:
    branches: [main]
    paths:
      - 'tools/build_center_player_pronunciations_from_eliteprospects.py'
      - '.github/workflows/center-player-pronunciation-eliteprospects.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: center-player-pronunciation
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Build verified Elite Prospects audio cache
        run: python tools/build_center_player_pronunciations_from_eliteprospects.py --workers 24 --audio-dir cloudflare-worker/public/player-audio --out state/center_player_pronunciations_eliteprospects.json
      - name: Validate cache
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('state/center_player_pronunciations_eliteprospects.json').read_text(encoding='utf-8'))
          matched=int(p.get('matched') or 0); roster=int(p.get('roster_players') or 0)
          print({'matched':matched,'roster':roster})
          if roster < 500:
              raise SystemExit('unexpectedly small NHL roster pool')
          if matched < 25:
              raise SystemExit(f'Elite Prospects audio cache unexpectedly weak: {matched}')
          profiles=p.get('profiles') or {}
          if len(profiles) != roster:
              raise SystemExit(f'player profile catalog incomplete: {len(profiles)}/{roster}')
          resolved_profiles=sum(1 for row in profiles.values() if str(row.get('eliteprospects_url') or '').strip())
          print({'eliteprospects_profiles_resolved':resolved_profiles})
          if resolved_profiles < max(500, int(roster*0.70)):
              raise SystemExit(f'Elite Prospects profile resolver unexpectedly weak: {resolved_profiles}/{roster}')
          for pid,row in profiles.items():
              if not str(row.get('full_name_en') or '').strip() or not str(row.get('team_tri') or '').strip():
                  raise SystemExit(f'player profile metadata incomplete: {pid}')
          for pid in ('8480803','8478864','8478402','8481559'):
              row=profiles.get(pid)
              if row:
                  print('PLAYER_AUDIT',pid,{k:row.get(k) for k in ('full_name_en','team_tri','eliteprospects_url','pronunciation_source','audio_local_path')})
          local=0
          for row in (p.get('players') or {}).values():
              u=str(row.get('pronunciation_url') or '')
              local_path=str(row.get('audio_local_path') or '')
              if row.get('pronunciation_source') == 'eliteprospects_player_audio':
                  if not u.startswith('https://files.eliteprospects.com/layout/player_audio/') or not u.endswith('.mp3'):
                      raise SystemExit('invalid Elite Prospects pronunciation URL')
              if not local_path.startswith('/player-audio/') or not local_path.endswith('.mp3'):
                  raise SystemExit('missing local player audio path')
              disk=Path('cloudflare-worker/public'+local_path)
              if not disk.is_file() or disk.stat().st_size < 1000:
                  raise SystemExit(f'local audio asset missing: {disk}')
              local += 1
          if local != matched:
              raise SystemExit(f'local audio coverage mismatch: {local}/{matched}')
          print({'local_audio':local})
          PY
      - name: Commit refreshed cache
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -z "$(git status --porcelain -- state/center_player_pronunciations_eliteprospects.json cloudflare-worker/public/player-audio)" ]; then
            echo "No Elite Prospects pronunciation changes"
            exit 0
          fi
          git config user.name "HOH Center Bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/center_player_pronunciations_eliteprospects.json cloudflare-worker/public/player-audio
          git commit -m "Refresh Elite Prospects player pronunciations"
          git pull --rebase origin main
          git push origin HEAD:main
