name: Backfill NBA Five Seasons

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill-nba-five-seasons.yml'
      - 'tools/backfill_nba_cdn.py'
      - 'tools/backfill_nba_cdn_resilient.py'
      - 'tools/backfill_nba_espn.py'
      - 'tools/backfill_nba_espn_team.py'
      - 'tools/backfill_nba_espn_team_v2.py'
      - 'tools/backfill_nba_stats.py'
      - 'migrations/0044_nba_data_core.sql'
      - 'migrations/0045_nba_cdn_manifest.sql'

permissions:
  contents: read

concurrency:
  group: nba-five-season-backfill
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '9032ec1bd3cb868d89a38453e4bd1a69' }}

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 2; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 2; }
      - run: npm install --no-audit --no-fund
      - run: npx wrangler d1 migrations apply hoh-data-core --remote

  source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify both production source paths
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          h={'User-Agent':'Mozilla/5.0','Accept':'application/json'}
          def get(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=30) as r: return json.load(r)
          old=get('https://data.nba.com/data/10s/v2015/json/mobile_teams/nba/2024/scores/gamedetail/0022400061_gamedetail.json')
          g=old.get('g') or {}; hp=len((g.get('hls') or {}).get('pstsg') or []); vp=len((g.get('vls') or {}).get('pstsg') or [])
          directory=get('https://data.nba.com/data/10s/v2015/json/mobile_teams/nba/2025/players/00_player_info.json')
          players=((directory.get('pls') or {}).get('pl') or [])
          team_schedule=get('https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams/2/schedule?season=2026&seasontype=2')
          events=team_schedule.get('events') or []
          espn=get('https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=401809243')
          groups=((espn.get('boxscore') or {}).get('players') or [])
          print({'legacy_players':hp+vp,'directory_players':len(players),'team_schedule_events':len(events),'espn_groups':len(groups)},flush=True)
          if hp==0 or vp==0 or len(players)<500 or len(events)<82 or len(groups)!=2: raise SystemExit('NBA source smoke failed')
          PY

  fetch-official:
    needs: [migrate, source-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        season: ['2022-23', '2023-24', '2024-25']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch official NBA season with same-feed fallback
        run: |
          python tools/backfill_nba_cdn_resilient.py \
            --seasons "${{ matrix.season }}" \
            --output-dir "local-data/nba-data/${{ matrix.season }}" \
            --workers 12 --attempts 5 --timeout 30 \
            --statement-rows 150 --statements-per-file 50 --allow-failures 0
      - uses: actions/upload-artifact@v4
        with:
          name: nba-data-sql-${{ matrix.season }}
          path: local-data/nba-data/${{ matrix.season }}/sql/*.sql
          if-no-files-found: error
          retention-days: 7
      - name: Save official source snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-data-raw-${{ matrix.season }}
          path: |
            local-data/nba-data/${{ matrix.season }}/raw
            local-data/nba-data/${{ matrix.season }}/summary.json
          if-no-files-found: warn
          retention-days: 30

  fetch-hybrid:
    needs: [migrate, source-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        season: ['2021-22', '2025-26']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch complete ESPN team schedules and box scores with deterministic NBA identity mapping
        run: |
          python tools/backfill_nba_espn_team_v2.py \
            --seasons "${{ matrix.season }}" \
            --output-dir "local-data/nba-data/${{ matrix.season }}" \
            --workers 12 --attempts 5 --timeout 30 \
            --statement-rows 150 --statements-per-file 50 --allow-failures 0
      - uses: actions/upload-artifact@v4
        with:
          name: nba-data-sql-${{ matrix.season }}
          path: local-data/nba-data/${{ matrix.season }}/sql/*.sql
          if-no-files-found: error
          retention-days: 7
      - name: Save hybrid source snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-data-raw-${{ matrix.season }}
          path: |
            local-data/nba-data/${{ matrix.season }}/raw
            local-data/nba-data/${{ matrix.season }}/summary.json
          if-no-files-found: warn
          retention-days: 30

  load-and-verify:
    needs: [fetch-official, fetch-hybrid]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || exit 2
          test -n "$CLOUDFLARE_ACCOUNT_ID" || exit 2
      - run: npm install --no-audit --no-fund
      - name: Download generated SQL
        uses: actions/download-artifact@v4
        with:
          pattern: nba-data-sql-*
          path: nba-sql
          merge-multiple: true
      - name: Upload NBA data to D1
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find nba-sql -type f -name '*.sql' -print0 | sort -z)
          test ${#files[@]} -gt 0 || { echo 'No generated NBA SQL files'; exit 3; }
          echo "Uploading ${#files[@]} SQL files"
          for file in "${files[@]}"; do
            echo "IMPORT $file"
            npx wrangler d1 execute hoh-data-core --remote --file "$file"
          done
      - name: Verify NBA coverage and integrity
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute hoh-data-core --remote --json --command "
            SELECT
              (SELECT COUNT(DISTINCT season_year) FROM nba_games) AS seasons,
              (SELECT COUNT(*) FROM nba_games) AS games,
              (SELECT COUNT(*) FROM nba_team_game_stats) AS team_rows,
              (SELECT COUNT(*) FROM nba_player_game_stats) AS player_rows,
              (SELECT COUNT(*) FROM nba_sync_manifest) AS manifest_rows,
              (SELECT COALESCE(SUM(failed_game_count),0) FROM nba_sync_manifest) AS failed_games,
              (SELECT COUNT(*) FROM nba_player_game_stats p LEFT JOIN nba_games g ON g.game_id=p.game_id LEFT JOIN nba_players d ON d.player_id=p.player_id WHERE g.game_id IS NULL OR d.player_id IS NULL) AS orphan_player_rows,
              (SELECT COUNT(*) FROM nba_team_game_stats t LEFT JOIN nba_games g ON g.game_id=t.game_id LEFT JOIN nba_teams d ON d.team_id=t.team_id WHERE g.game_id IS NULL OR d.team_id IS NULL) AS orphan_team_rows,
              (SELECT COUNT(*) FROM nba_games g WHERE (SELECT COUNT(*) FROM nba_team_game_stats t WHERE t.game_id=g.game_id)<>2) AS bad_team_row_counts;
          " > /tmp/nba_verify.json
          cat /tmp/nba_verify.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/nba_verify.json')); data=data[0] if isinstance(data,list) else data
          rows=data.get('results') or data.get('result') or []; rows=[rows] if isinstance(rows,dict) else rows
          if not rows: raise SystemExit('No verification result from D1')
          r=rows[0]
          checks={
            'five_seasons': int(r['seasons']) >= 5,
            'games_gt_6000': int(r['games']) > 6000,
            'two_team_rows_per_game': int(r['team_rows']) == int(r['games']) * 2,
            'player_rows_gt_120k': int(r['player_rows']) > 120000,
            'manifest_present': int(r['manifest_rows']) >= 10,
            'failed_games_zero': int(r['failed_games']) == 0,
            'orphan_players_zero': int(r['orphan_player_rows']) == 0,
            'orphan_teams_zero': int(r['orphan_team_rows']) == 0,
            'bad_team_counts_zero': int(r['bad_team_row_counts']) == 0,
          }
          print(json.dumps({'metrics':r,'checks':checks},indent=2))
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('NBA D1 verification failed: '+', '.join(failed))
          PY
      - name: Show NBA season coverage
        run: |
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT season_year,season_type,game_rows,team_rows,player_rows,failed_game_count,first_game_date,last_game_date,source
            FROM nba_sync_manifest
            ORDER BY season_year,season_type;
          "
