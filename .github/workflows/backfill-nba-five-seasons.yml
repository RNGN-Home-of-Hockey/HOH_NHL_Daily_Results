name: Backfill NBA Five Seasons

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill-nba-five-seasons.yml'
      - 'tools/backfill_nba_stats.py'
      - 'migrations/0044_nba_data_core.sql'

permissions:
  contents: read

concurrency:
  group: nba-five-season-backfill
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '9032ec1bd3cb868d89a38453e4bd1a69' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 2; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 2; }

      - name: Install Wrangler
        run: npm install --no-audit --no-fund

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply hoh-data-core --remote

      - name: Fetch NBA league-wide game logs
        run: |
          python tools/backfill_nba_stats.py \
            --seasons 2021-22 2022-23 2023-24 2024-25 2025-26 \
            --season-types "Regular Season" Playoffs \
            --request-gap 8 \
            --attempts 6 \
            --timeout 60 \
            --rows-per-statement 200 \
            --statements-per-file 40

      - name: Upload NBA data to D1
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find local-data/nba/sql -type f -name '*.sql' -print0 | sort -z)
          test ${#files[@]} -gt 0 || { echo 'No generated NBA SQL files'; exit 3; }
          for file in "${files[@]}"; do
            echo "IMPORT $file"
            npx wrangler d1 execute hoh-data-core --remote --file "$file"
          done

      - name: Verify NBA coverage
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT season_year,season_type,game_rows,team_rows,player_rows,first_game_date,last_game_date,fetched_at
            FROM nba_sync_manifest
            ORDER BY season_year,season_type;

            SELECT season_year,season_type,COUNT(*) games
            FROM nba_games
            GROUP BY season_year,season_type
            ORDER BY season_year,season_type;

            SELECT season_year,season_type,COUNT(*) player_game_rows,COUNT(DISTINCT player_id) players
            FROM nba_player_game_stats
            GROUP BY season_year,season_type
            ORDER BY season_year,season_type;

            SELECT COUNT(*) orphan_player_rows
            FROM nba_player_game_stats p
            LEFT JOIN nba_games g ON g.game_id=p.game_id
            LEFT JOIN nba_players d ON d.player_id=p.player_id
            WHERE g.game_id IS NULL OR d.player_id IS NULL;

            SELECT COUNT(*) orphan_team_rows
            FROM nba_team_game_stats t
            LEFT JOIN nba_games g ON g.game_id=t.game_id
            LEFT JOIN nba_teams d ON d.team_id=t.team_id
            WHERE g.game_id IS NULL OR d.team_id IS NULL;
          "

      - name: Save NBA raw snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-five-season-backfill
          path: |
            local-data/nba/raw
            local-data/nba/summary.json
          if-no-files-found: warn
          retention-days: 30
