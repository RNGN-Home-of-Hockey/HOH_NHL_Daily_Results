name: Refresh HOH YouTube media

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/build_hoh_youtube_media.py'
      - '.github/workflows/refresh-hoh-youtube-media.yml'
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check yt-dlp
      - run: python tools/build_hoh_youtube_media.py --out state/hoh_youtube_media.json
      - name: Validate media cache
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('state/hoh_youtube_media.json').read_text(encoding='utf-8'))
          shorts=p.get('shorts_top10') or []
          news=p.get('news') or {}
          assert len(shorts) >= 2, len(shorts)
          assert news.get('id') == 'mjDYO1uaw7E', news
          assert all(str(x.get('url','')).startswith('https://www.youtube.com/shorts/') for x in shorts)
          print({'shorts':len(shorts),'news':news.get('id')})
          PY
      - name: Commit refreshed media cache
        run: |
          if [ -z "$(git status --porcelain -- state/hoh_youtube_media.json)" ]; then
            echo "No YouTube media changes"
            exit 0
          fi
          git config user.name "HOH Center Bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/hoh_youtube_media.json
          git commit -m "Refresh HOH YouTube media"
          git pull --rebase origin main
          git push origin HEAD:main
