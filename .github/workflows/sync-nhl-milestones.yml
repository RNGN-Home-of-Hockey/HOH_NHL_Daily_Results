name: Sync NHL Milestone Watch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-nhl-milestones.yml'
      - 'tools/sync_nhl_milestones.py'
      - 'migrations/0025_nhl_milestone_watch.sql'
  schedule:
    - cron: '17 8 * * *'

permissions:
  contents: read

concurrency:
  group: hoh-d1-bulk-import
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '9032ec1bd3cb868d89a38453e4bd1a69' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply hoh-data-core --remote
      - name: Fetch milestone watch
        run: python tools/sync_nhl_milestones.py
      - name: Upload milestone watch
        run: npx wrangler d1 execute hoh-data-core --remote --file local-data/nhl-milestones/milestones.sql
      - name: Verify milestone watch
        run: |
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT entity_type,game_type,COUNT(*) AS rows,
                   MIN(remaining_value) AS nearest,
                   MAX(remaining_value) AS farthest
            FROM nhl_milestone_watch
            GROUP BY entity_type,game_type
            ORDER BY entity_type,game_type;
            SELECT player_name,team_tri,milestone_type,milestone_amount,current_value,remaining_value
            FROM nhl_milestone_watch
            WHERE game_type=2 AND remaining_value>=0
            ORDER BY remaining_value ASC,milestone_amount DESC
            LIMIT 25;
          "
      - name: Save milestone summary
        uses: actions/upload-artifact@v4
        with:
          name: nhl-milestone-watch-summary
          path: local-data/nhl-milestones/summary.json
          retention-days: 30
