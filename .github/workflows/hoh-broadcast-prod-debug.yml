name: HOH Broadcast Prod Debug

on:
  push:
    paths:
      - '.github/workflows/hoh-broadcast-prod-debug.yml'

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check production broadcast routes
        run: |
          set -euo pipefail
          BASE='https://hoh-nhl-daily-results.znamteam-903.workers.dev'
          for path in /broadcast /broadcast/app.js /api/broadcast/games /api/broadcast/state; do
            echo "=== $path ==="
            curl -sS -D /tmp/headers -o /tmp/body "$BASE$path"
            head -n 20 /tmp/headers
            echo '--- BODY HEAD ---'
            head -c 800 /tmp/body || true
            echo
          done
