name: One-shot resend fixed game card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-resend-fixed-card.yml'

permissions:
  contents: read
  actions: read

jobs:
  resend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Recover failed click target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/oldrun
          curl -fsSL -L             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/35600074881/logs"             -o /tmp/oldrun/logs.zip
          unzip -oq /tmp/oldrun/logs.zip -d /tmp/oldrun/logs
          game_pk=$(grep -RhoE 'GAME_PK: [0-9]+' /tmp/oldrun/logs | tail -1 | awk '{print $2}')
          target_chat=$(grep -RhoE 'TARGET_CHAT_ID: -?[0-9]+' /tmp/oldrun/logs | tail -1 | awk '{print $2}')
          test -n "$game_pk"
          test -n "$target_chat"
          echo "::add-mask::$target_chat"
          echo "GAME_PK=$game_pk" >> "$GITHUB_ENV"
          echo "TELEGRAM_TARGET_CHAT_ID=$target_chat" >> "$GITHUB_ENV"
          echo "Recovered failed click target for game $game_pk"
      - name: Send fixed card
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GAME_PK: ${{ env.GAME_PK }}
          TELEGRAM_TARGET_CHAT_ID: ${{ env.TELEGRAM_TARGET_CHAT_ID }}
          TELEGRAM_INTERACTIVE_ENABLED: "0"
          SPORTSRU_ON_DEMAND_ENABLED: "1"
          DEBUG_VERBOSE: "0"
          DRY_RUN: "0"
        run: python nhl_single_result_bot.py
