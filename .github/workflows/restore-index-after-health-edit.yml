name: Restore Index After Health Edit

on:
  push:
    paths:
      - '.github/workflows/restore-index-after-health-edit.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore full index and add advanced table
        run: |
          git show fa5ca73485dc34468fd70de29a7af2a2af7e8d11:cloudflare-worker/src/index.js > cloudflare-worker/src/index.js
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-worker/src/index.js')
          s=p.read_text(encoding='utf-8')
          anchor='  "team_game_features",\n'
          if '  "team_game_advanced_features",\n' not in s:
              if anchor not in s: raise SystemExit('anchor missing')
              s=s.replace(anchor,'  "team_game_advanced_features",\n'+anchor,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check cloudflare-worker/src/index.js
          git diff --check
      - name: Commit repair
        run: |
          git config user.name 'znamteam-max'
          git config user.email 'znamteam@gmail.com'
          git add cloudflare-worker/src/index.js
          git commit -m 'Restore full index and include advanced feature table'
          git push origin HEAD:main
