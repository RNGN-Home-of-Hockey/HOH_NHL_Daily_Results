name: Validate History Sync PowerShell

on:
  push:
    paths:
      - '.github/workflows/validate-history-sync-powershell.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse scripts with Windows PowerShell
        shell: powershell
        run: |
          $files = @('tools\upload_warehouse_d1.ps1','tools\run_full_history_sync.ps1','tools\run_build_warehouse.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Host
              throw "PowerShell parse failed: $file"
            }
            Write-Host "PARSE_OK $file"
          }
      - name: Verify multi-season Python builder syntax
        shell: powershell
        run: |
          python -m py_compile tools\build_local_warehouse.py
          $content = Get-Content tools\build_local_warehouse.py -Raw
          if ($content -notmatch "glob\('\*/teams/\*\.csv'\)") { throw 'multi-season CSV glob missing' }
          Write-Host 'MULTISEASON_OK'
