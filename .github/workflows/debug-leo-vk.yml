name: Debug Leo VK mapping

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug-leo-vk.yml'

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '9032ec1bd3cb868d89a38453e4bd1a69' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Inspect ANA VGK playoff broadcast candidates
        run: |
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT game_pk,scheduled_start_utc,home_tri,away_tri,home_score,away_score
            FROM games WHERE game_pk=2025030246;
            SELECT * FROM game_vk_broadcasts WHERE game_pk=2025030246;
            SELECT source_key,title,published_at,scheduled_at,duration_seconds,parsed_home_tri,parsed_away_tri,web_url
            FROM vk_broadcasts
            WHERE (published_at BETWEEN '2026-05-12T00:00:00Z' AND '2026-05-17T23:59:59Z')
               OR (scheduled_at BETWEEN '2026-05-12T00:00:00Z' AND '2026-05-17T23:59:59Z')
               OR LOWER(title) LIKE '%анахайм%'
               OR LOWER(title) LIKE '%вегас%'
            ORDER BY COALESCE(scheduled_at,published_at) DESC
            LIMIT 120;
          "
