name: Temporary Windows compact sync validation
on:
  push:
    paths:
      - '.github/workflows/_tmp-windows-compact-sync-test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell 5.1 scripts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $files=@(
            'tools\run_compact_snapshot_sync.ps1',
            'tools\upload_compact_snapshots_d1.ps1'
          )
          foreach($f in $files){
            $text=Get-Content $f -Raw
            [void][scriptblock]::Create($text)
            Write-Host "PARSE_OK $f"
          }
      - name: Python compile
        shell: powershell
        run: |
          python -m py_compile tools\build_compact_snapshots.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'PY_COMPILE_OK'
