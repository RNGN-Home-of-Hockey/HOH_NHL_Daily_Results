name: Refresh Center Russian player names

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  push:
    paths:
      - "tools/build_center_player_meta_from_sports_ru.py"
      - ".github/workflows/center-player-meta.yml"

permissions:
  contents: write

concurrency:
  group: center-player-meta
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scraper dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Build Sports.ru full-name cache
        run: python tools/build_center_player_meta_from_sports_ru.py --sleep 0.20 --out state/center_player_meta_sports_ru.json --full-names-out ru_full_names.json
      - name: Validate cache quality
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          payload=json.loads(Path('state/center_player_meta_sports_ru.json').read_text(encoding='utf-8'))
          names=json.loads(Path('ru_full_names.json').read_text(encoding='utf-8'))
          matched=len(payload.get('players') or [])
          errors=[k for k,v in (payload.get('teams') or {}).items() if isinstance(v,dict) and v.get('error')]
          mixed={pid:name for pid,name in names.items() if re.search(r'[А-Яа-яЁё]', str(name)) and re.search(r'[A-Za-z]', str(name))}
          non_cyr={pid:name for pid,name in names.items() if not re.search(r'[А-Яа-яЁё]', str(name))}
          print({'matched':matched,'team_errors':len(errors),'full_names':len(names),'mixed_script':len(mixed),'non_cyrillic':len(non_cyr)})
          if matched < 500:
              raise SystemExit(f'refusing weak Sports.ru cache: only {matched} matched players')
          if len(errors) > 8:
              raise SystemExit(f'refusing weak Sports.ru cache: {len(errors)} team fetch errors')
          if mixed:
              sample=list(mixed.items())[:10]
              raise SystemExit(f'refusing mixed-script Russian names: {sample}')
          if non_cyr:
              sample=list(non_cyr.items())[:10]
              raise SystemExit(f'refusing non-Cyrillic Russian names: {sample}')
          PY
      - name: Commit refreshed name cache
        run: |
          # The rich state payload contains a generated timestamp and is diagnostic only.
          # Commit only the deterministic name map so unrelated concurrent product commits
          # cannot create rebase conflicts in the generated state file.
          git checkout -- state/center_player_meta_sports_ru.json || true
          if git diff --quiet -- ru_full_names.json; then
            echo "No player-name changes"
            exit 0
          fi
          git config user.name "HOH Center Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ru_full_names.json
          git commit -m "Refresh Sports.ru Russian NHL player names"
          git pull --rebase origin main
          git push origin HEAD:main
