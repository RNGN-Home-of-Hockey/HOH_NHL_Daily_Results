name: Stage2 Postdeploy Production Smoke

on:
  push:
    paths:
      - '.github/workflows/stage2-prod-postdeploy-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose production game endpoints
        env:
          BASE_URL: https://hoh-nhl-daily-results.znamteam-903.workers.dev
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          base=os.environ['BASE_URL'].rstrip('/')
          def raw(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'HOH-Stage2-Diagnostic/1.0','Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      body=r.read().decode('utf-8','replace')
                      return r.status,body
              except urllib.error.HTTPError as e:
                  return e.code,e.read().decode('utf-8','replace')
          status,body=raw('/api/broadcast/games')
          print('LIST_STATUS',status)
          print('LIST_BODY_PREFIX',body[:500])
          listing=json.loads(body)
          games=listing.get('games') or []
          for g in games[:8]:
              path='/api/broadcast/games/'+str(g['game_pk'])
              status,body=raw(path)
              print('GAME',g['game_pk'],g.get('away_tri'),g.get('home_tri'),'STATUS',status,'BODY',body[:1000])
          print('DIAGNOSTIC_DONE')
          PY
