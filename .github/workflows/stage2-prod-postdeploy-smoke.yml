name: Stage2 Production Recovery Validation

on:
  push:
    paths:
      - '.github/workflows/stage2-prod-postdeploy-smoke.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Add fail-safe portfolio and endpoint degradation
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('cloudflare-worker/src/betting-insight-engine.js')
          s=p.read_text(encoding='utf-8')
          old='''  const portfolio = selectInsightPortfolio(dedupe(insights), 12);\n  return applyWinlineMarkets(portfolio, options.provider_markets, {\n    now: options.now,\n    max_age_ms: options.market_max_age_ms,\n  });\n'''
          new='''  const rawPortfolio = dedupe(insights);\n  let portfolio;\n  try {\n    portfolio = selectInsightPortfolio(rawPortfolio, 12);\n  } catch (error) {\n    console.error("betting insight portfolio failed", error);\n    portfolio = [...rawPortfolio]\n      .sort((a, b) => Number(b?.score || 0) - Number(a?.score || 0))\n      .slice(0, 12);\n  }\n\n  try {\n    return applyWinlineMarkets(portfolio, options.provider_markets, {\n      now: options.now,\n      max_age_ms: options.market_max_age_ms,\n    });\n  } catch (error) {\n    console.error("winline market adapter failed", error);\n    return portfolio;\n  }\n'''
          if old not in s: raise SystemExit('betting portfolio anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('cloudflare-worker/src/broadcast-dashboard-v2.js')
          s=p.read_text(encoding='utf-8')
          old='''    const teamStats=teamStatsResult.results||[];\n    const playerStats=playerStatsResult.results||[];\n    const bettingInsights=await buildBettingInsights(env.DB,game);\n    return jsonResponse({\n'''
          new='''    const teamStats=teamStatsResult.results||[];\n    const playerStats=playerStatsResult.results||[];\n    let bettingInsights=[];\n    let bettingInsightsDegraded=false;\n    try {\n      bettingInsights=await buildBettingInsights(env.DB,game);\n    } catch (error) {\n      bettingInsightsDegraded=true;\n      console.error("broadcast betting insights degraded", error);\n    }\n    return jsonResponse({\n'''
          if old not in s: raise SystemExit('broadcast betting anchor missing')
          s=s.replace(old,new,1)
          old='''      cards:bettingInsights,\n      quick_cards:buildQuickCards(game,teamStats,playerStats),\n'''
          new='''      cards:bettingInsights,\n      betting_insights_degraded:bettingInsightsDegraded,\n      quick_cards:buildQuickCards(game,teamStats,playerStats),\n'''
          if old not in s: raise SystemExit('broadcast cards anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check cloudflare-worker/src/betting-insight-engine.js
          node --check cloudflare-worker/src/broadcast-dashboard-v2.js
          git diff --check
      - name: Full Worker dry run
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir .stage2-recovery-build
          test -d .stage2-recovery-build
          echo STAGE2_RECOVERY_BUILD_OK
      - name: Commit recovery
        run: |
          git config user.name 'znamteam-max'
          git config user.email 'znamteam@gmail.com'
          git add cloudflare-worker/src/betting-insight-engine.js cloudflare-worker/src/broadcast-dashboard-v2.js
          git commit -m 'Keep Broadcast game endpoint alive when insight ranking fails'
          git push origin HEAD:main
