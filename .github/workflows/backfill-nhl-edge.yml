name: Backfill NHL EDGE Two-Season Tracking

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill-nhl-edge.yml'
      - 'tools/backfill_nhl_edge.py'
      - 'migrations/0023_nhl_edge_tracking.sql'

permissions:
  contents: read

concurrency:
  group: nhl-edge-two-season
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '9032ec1bd3cb868d89a38453e4bd1a69' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 2; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 2; }

      - name: Install Wrangler
        run: npm install --no-audit --no-fund

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply hoh-data-core --remote

      - name: Download NHL EDGE tracking profiles
        run: python tools/backfill_nhl_edge.py --workers 12

      - name: Upload NHL EDGE data to D1
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(local-data/nhl-edge/sql/edge_data_*.sql)
          test ${#files[@]} -gt 0 || { echo 'No generated EDGE SQL files'; exit 3; }
          for file in "${files[@]}"; do
            echo "IMPORT $file"
            npx wrangler d1 execute hoh-data-core --remote --file "$file"
          done
          npx wrangler d1 execute hoh-data-core --remote --file local-data/nhl-edge/sql/edge_meta.sql

      - name: Verify NHL EDGE coverage
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute hoh-data-core --remote --command "
            SELECT season_id,game_type,entity_type,
                   COUNT(*) AS entities,
                   SUM(CASE WHEN skating_speed_max_mph IS NOT NULL THEN 1 ELSE 0 END) AS speed_rows,
                   SUM(CASE WHEN top_shot_speed_mph IS NOT NULL THEN 1 ELSE 0 END) AS shot_speed_rows,
                   SUM(CASE WHEN distance_miles IS NOT NULL THEN 1 ELSE 0 END) AS distance_rows,
                   SUM(CASE WHEN offensive_zone_pct IS NOT NULL THEN 1 ELSE 0 END) AS zone_rows
            FROM nhl_edge_features
            GROUP BY season_id,game_type,entity_type
            ORDER BY season_id,game_type,entity_type;
            SELECT season_id,game_type,report_name,COUNT(*) AS rows
            FROM nhl_edge_payloads
            GROUP BY season_id,game_type,report_name
            ORDER BY season_id,game_type,report_name;
          "

      - name: Save EDGE summary
        uses: actions/upload-artifact@v4
        with:
          name: nhl-edge-two-season-summary
          path: local-data/nhl-edge/summary.json
          retention-days: 30
