name: Probe HOH VK archive

on:
  push:
    branches: [main]
    paths:
      - 'tools/probe_vk_hoh.py'
      - '.github/workflows/vk-hoh-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install probe dependency
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Probe VK archive
        run: python tools/probe_vk_hoh.py
      - name: Commit probe result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/vk_hoh_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Capture HOH VK archive probe"
          git push
